<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #output {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,0.72);
      padding: 12px 15px;
      border-radius: 10px;
      z-index: 30;
      font-size: 16px;
      line-height: 1.5;
    }

    /* =========================
       CUBE POSITION
    ========================= */

    #cube-container {
      position: fixed;

      left: 0;
      top: 0;

      width: 0;
      height: 0;

      display: none;

      z-index: 10;

      pointer-events: none;

      perspective: 700px;

      transform-style: preserve-3d;
    }

    /* =========================
       CUBE
    ========================= */

    #cube {
      position: absolute;

      left: -45px;
      top: -45px;

      width: 90px;
      height: 90px;

      transform-style: preserve-3d;

      animation:
        rotateCube 2.5s linear infinite;
    }

    .face {
      position: absolute;

      width: 90px;
      height: 90px;

      box-sizing: border-box;

      border: 3px solid cyan;

      background:
        rgba(0,220,255,0.20);

      box-shadow:
        inset 0 0 18px cyan,
        0 0 15px cyan;
    }

    .front {
      transform:
        translateZ(45px);
    }

    .back {
      transform:
        rotateY(180deg)
        translateZ(45px);
    }

    .right {
      transform:
        rotateY(90deg)
        translateZ(45px);
    }

    .left {
      transform:
        rotateY(-90deg)
        translateZ(45px);
    }

    .top {
      transform:
        rotateX(90deg)
        translateZ(45px);
    }

    .bottom {
      transform:
        rotateX(-90deg)
        translateZ(45px);
    }

    @keyframes rotateCube {

      from {
        transform:
          rotateX(0deg)
          rotateY(0deg);
      }

      to {
        transform:
          rotateX(360deg)
          rotateY(360deg);
      }

    }
  </style>
</head>

<body>

<video
  id="camera"
  autoplay
  playsinline>
</video>

<canvas id="output"></canvas>

<div id="hud">

  <b>JARVIS AR</b>

  <div id="status">
    Starting camera...
  </div>

  <div id="hands">
    Hands: 0
  </div>

</div>


<!-- =========================
     CUBE
========================= -->

<div id="cube-container">

  <div id="cube">

    <div class="face front"></div>

    <div class="face back"></div>

    <div class="face right"></div>

    <div class="face left"></div>

    <div class="face top"></div>

    <div class="face bottom"></div>

  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsDisplay =
  document.getElementById("hands");

const cubeContainer =
  document.getElementById("cube-container");


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   CAMERA → SCREEN
===================================================== */

function screenPosition(point) {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if (!vw || !vh) {

    return {
      x: sw / 2,
      y: sh / 2
    };

  }


  const videoRatio =
    vw / vh;

  const screenRatio =
    sw / sh;


  let displayWidth;
  let displayHeight;

  let offsetX = 0;
  let offsetY = 0;


  /*
    Match the camera's
    object-fit: cover.
  */

  if (screenRatio > videoRatio) {

    displayWidth =
      sw;

    displayHeight =
      sw / videoRatio;

    offsetY =
      (sh - displayHeight) / 2;

  }

  else {

    displayHeight =
      sh;

    displayWidth =
      sh * videoRatio;

    offsetX =
      (sw - displayWidth) / 2;

  }


  let x =
    point.x *
    displayWidth +
    offsetX;

  let y =
    point.y *
    displayHeight +
    offsetY;


  /*
    Mirror to match
    the front camera.
  */

  x =
    sw - x;


  return {
    x: x,
    y: y
  };

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
  new Hands({

    locateFile: (file) => {

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 0,

  minDetectionConfidence: 0.50,

  minTrackingConfidence: 0.50

});


/* =====================================================
   CUBE STATE
===================================================== */

let cubeX =
  window.innerWidth / 2;

let cubeY =
  window.innerHeight / 2;


/*
  TRUE means the cube
  is currently grabbed.
*/

let grabbed = false;


/*
  Which hand is controlling
  the cube.

  0 = first hand
  1 = second hand
*/

let grabbingHandIndex =
  -1;


/*
  Faster response so the cube
  stays close to the fingertip.
*/

const smoothing = 0.80;


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults((results) => {


  /* CLEAR OLD HAND DRAWING */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detectedHands =
    results.multiHandLandmarks || [];


  /*
    Display number of hands.
  */

  handsDisplay.textContent =
    "Hands: " +
    detectedHands.length;


  /* =================================================
     NO HANDS
  ================================================= */

  if (
    detectedHands.length === 0
  ) {

    status.textContent =
      "Show your hands";

    return;

  }


  /*
    Store which hand is currently
    pinching.
  */

  let currentPinchingIndex =
    -1;


  /* =================================================
     PROCESS BOTH HANDS
  ================================================= */

  for (
    let i = 0;
    i < detectedHands.length;
    i++
  ) {


    const hand =
      detectedHands[i];


    const points =
      hand.map(
        screenPosition
      );


    /* ===============================================
       DRAW HAND LINES
    =============================================== */

    ctx.strokeStyle =
      "cyan";

    ctx.lineWidth = 3;


    for (
      const connection
      of HAND_CONNECTIONS
    ) {

      const start =
        points[
          connection[0]
        ];

      const end =
        points[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        start.x,
        start.y
      );

      ctx.lineTo(
        end.x,
        end.y
      );

      ctx.stroke();

    }


    /* ===============================================
       DRAW HAND DOTS
    =============================================== */

    ctx.fillStyle =
      "cyan";


    for (
      const point
      of points
    ) {

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        5,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    /* ===============================================
       PINCH DETECTION
    =============================================== */

    const thumb =
      hand[4];

    const index =
      hand[8];


    const distance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    if (
      distance < 0.065
    ) {

      currentPinchingIndex =
        i;

    }

  }


  /* =================================================
     START GRAB
  ================================================= */

  if (
    !grabbed &&
    currentPinchingIndex !== -1
  ) {

    grabbed = true;

    grabbingHandIndex =
      currentPinchingIndex;


    /*
      Immediately place the cube
      on the fingertip.
    */

    const hand =
      detectedHands[
        grabbingHandIndex
      ];


    const index =
      hand[8];


    const target =
      screenPosition(index);


    cubeX =
      target.x;

    cubeY =
      target.y;


    cubeContainer.style.left =
      cubeX + "px";

    cubeContainer.style.top =
      cubeY + "px";


    cubeContainer.style.display =
      "block";


    status.textContent =
      "CUBE GRABBED 🤏";

  }


  /* =================================================
     MOVE GRABBED CUBE
  ================================================= */

  if (grabbed) {


    /*
      Make sure the hand that grabbed
      the cube still exists.
    */

    if (
      grabbingHandIndex >=
      detectedHands.length
    ) {

      grabbed = false;

      grabbingHandIndex = -1;

      status.textContent =
        "CUBE DROPPED";

      return;

    }


    const grabbingHand =
      detectedHands[
        grabbingHandIndex
      ];


    /*
      Check thumb/index distance
      every frame.
    */

    const thumb =
      grabbingHand[4];

    const index =
      grabbingHand[8];


    const distance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    /* ===============================================
       STILL PINCHING
    =============================================== */

    if (
      distance < 0.075
    ) {


      const target =
        screenPosition(index);


      /*
        Follow the fingertip.
      */

      cubeX +=
        (target.x - cubeX) *
        smoothing;


      cubeY +=
        (target.y - cubeY) *
        smoothing;


      /*
        Center cube exactly
        on fingertip.
      */

      cubeContainer.style.left =
        cubeX + "px";


      cubeContainer.style.top =
        cubeY + "px";


      cubeContainer.style.display =
        "block";


      status.textContent =
        "CUBE GRABBED 🤏";

    }


    /* ===============================================
       RELEASE
    =============================================== */

    else {


      grabbed = false;

      grabbingHandIndex =
        -1;


      /*
        DO NOT hide the cube.
        It stays where it was dropped.
      */

      cubeContainer.style.left =
        cubeX + "px";


      cubeContainer.style.top =
        cubeY + "px";


      cubeContainer.style.display =
        "block";


      status.textContent =
        "CUBE DROPPED ✓";

    }

  }


  /* =================================================
     NOT GRABBED
  ================================================= */

  if (!grabbed) {

    /*
      If the cube hasn't been grabbed,
      don't show it.

      Once it has been dropped,
      it remains visible.
    */

  }

});


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {


    status.textContent =
      "Requesting camera...";


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },

          width: 1280,

          height: 720

        }
      );


    camera.start();


  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Camera error: " +
      error.message;

  }

}


/* =====================================================
   START
===================================================== */

startCamera();

</script>

</body>
</html>
