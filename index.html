<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#camera.front{
  transform:scaleX(-1);
}

#camera.back{
  transform:none;
}

#output{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:2;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:50;

  color:#00eaff;

  background:rgba(0,0,0,.78);

  border:1px solid #00eaff;

  border-radius:10px;

  padding:12px 16px;

  line-height:1.5;

  font-size:15px;
}

#cameraButton{
  position:fixed;

  top:15px;
  right:15px;

  z-index:60;

  padding:12px 16px;

  color:#00eaff;

  background:rgba(0,0,0,.8);

  border:1px solid #00eaff;

  border-radius:10px;

  font-weight:bold;

  font-size:14px;
}

#cameraButton:disabled{
  opacity:.5;
}

#cube-container{

  position:fixed;

  left:50%;
  top:50%;

  width:0;
  height:0;

  display:none;

  z-index:10;

  perspective:900px;

  transform-style:preserve-3d;

  pointer-events:none;
}

#cube{

  position:absolute;

  width:120px;
  height:120px;

  left:-60px;
  top:-60px;

  transform-style:preserve-3d;

  will-change:transform;
}

.face{

  position:absolute;

  width:120px;
  height:120px;

  box-sizing:border-box;

  border:3px solid #00eaff;

  background:rgba(0,220,255,.18);

  box-shadow:
    inset 0 0 25px rgba(0,240,255,.7),
    0 0 15px rgba(0,240,255,.8);

  backface-visibility:visible;
}

.frontFace{
  transform:translateZ(60px);
}

.backFace{
  transform:
    rotateY(180deg)
    translateZ(60px);
}

.rightFace{
  transform:
    rotateY(90deg)
    translateZ(60px);
}

.leftFace{
  transform:
    rotateY(-90deg)
    translateZ(60px);
}

.topFace{
  transform:
    rotateX(90deg)
    translateZ(60px);
}

.bottomFace{
  transform:
    rotateX(-90deg)
    translateZ(60px);
}

#centerDot{

  position:fixed;

  width:7px;
  height:7px;

  margin-left:-3.5px;
  margin-top:-3.5px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:0 0 12px #00eaff;

  display:none;

  z-index:15;
}

#grabRing{

  position:fixed;

  width:30px;
  height:30px;

  margin-left:-15px;
  margin-top:-15px;

  border:2px solid #00eaff;

  border-radius:50%;

  display:none;

  z-index:14;

  pointer-events:none;

  box-shadow:0 0 12px #00eaff;
}

</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<canvas id="output"></canvas>

<div id="hud">

  <b>JARVIS AR</b>

  <div id="status">
    Starting...
  </div>

  <div id="hands">
    Hands: 0
  </div>

  <div id="mode">
    Mode: STANDBY
  </div>

  <div id="cameraMode">
    Camera: BACK
  </div>

</div>

<button id="cameraButton">
  SWITCH TO FRONT
</button>

<div id="grabRing"></div>

<div id="centerDot"></div>

<div id="cube-container">

  <div id="cube">

    <div class="face frontFace"></div>
    <div class="face backFace"></div>
    <div class="face rightFace"></div>
    <div class="face leftFace"></div>
    <div class="face topFace"></div>
    <div class="face bottomFace"></div>

  </div>

</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsText =
  document.getElementById("hands");

const modeText =
  document.getElementById("mode");

const cameraModeText =
  document.getElementById("cameraMode");

const cameraButton =
  document.getElementById("cameraButton");

const cubeContainer =
  document.getElementById("cube-container");

const cube =
  document.getElementById("cube");

const centerDot =
  document.getElementById("centerDot");

const grabRing =
  document.getElementById("grabRing");


/* =====================================================
   CAMERA STATE
===================================================== */

let usingFrontCamera = false;

let currentStream = null;

let cameraReady = false;

let processing = false;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(point){

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if(!vw || !vh){

    return{
      x:sw/2,
      y:sh/2
    };

  }


  const videoRatio =
    vw / vh;

  const screenRatio =
    sw / sh;


  let width;
  let height;

  let offsetX = 0;
  let offsetY = 0;


  if(screenRatio > videoRatio){

    width = sw;

    height =
      sw / videoRatio;

    offsetY =
      (sh-height)/2;

  }

  else{

    height = sh;

    width =
      sh * videoRatio;

    offsetX =
      (sw-width)/2;

  }


  let x =
    point.x * width +
    offsetX;

  let y =
    point.y * height +
    offsetY;


  /*
    Only mirror the front camera.
  */

  if(usingFrontCamera){

    x =
      sw-x;

  }


  return{
    x:x,
    y:y
  };

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
  new Hands({

    locateFile:(file)=>{

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


/* =====================================================
   CUBE STATE
===================================================== */

let cubeExists = false;

let cubeX =
  window.innerWidth/2;

let cubeY =
  window.innerHeight/2;

let cubeScale = 1;

let rotX = -20;

let rotY = 30;

let rotZ = 0;


/* =====================================================
   GRAB STATE
===================================================== */

let grabbed = false;

let grabX = 0;

let grabY = 0;

let grabOffsetX = 0;

let grabOffsetY = 0;


/* =====================================================
   TWO HAND STATE
===================================================== */

let twoHandMode = false;

let twoStartDistance = 1;

let twoStartScale = 1;

let twoStartAngle = 0;

let twoStartRotZ = 0;

let twoStartCenterY = 0;

let twoStartRotX = 0;


/* =====================================================
   PINCH
===================================================== */

function isPinching(hand){

  const thumb =
    hand[4];

  const index =
    hand[8];


  const distance =
    Math.hypot(

      thumb.x-index.x,

      thumb.y-index.y

    );


  return distance < .055;

}


/* =====================================================
   UPDATE CUBE
===================================================== */

function updateCube(){

  cubeContainer.style.left =
    cubeX+"px";

  cubeContainer.style.top =
    cubeY+"px";


  cube.style.transform =
  `
    scale(${cubeScale})
    rotateX(${rotX}deg)
    rotateY(${rotY}deg)
    rotateZ(${rotZ}deg)
  `;


  cubeContainer.style.display =
    "block";


  centerDot.style.display =
    "block";

  centerDot.style.left =
    cubeX+"px";

  centerDot.style.top =
    cubeY+"px";

}


/* =====================================================
   GRAB RING
===================================================== */

function showRing(x,y){

  grabRing.style.display =
    "block";

  grabRing.style.left =
    x+"px";

  grabRing.style.top =
    y+"px";

}


function hideRing(){

  grabRing.style.display =
    "none";

}


/* =====================================================
   FIND PINCHING HANDS
===================================================== */

function getPinchingHands(
  detected
){

  const list = [];


  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      list.push(i);

    }

  }


  return list;

}


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults(
(results)=>{

  if(!cameraReady){

    return;

  }


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detected =
    results.multiHandLandmarks || [];


  handsText.textContent =
    "Hands: "+
    detected.length;


  /* =================================================
     DRAW HANDS
  ================================================= */

  for(
    const hand of detected
  ){

    const points =
      hand.map(
        screenPosition
      );


    ctx.strokeStyle =
      "#00eaff";

    ctx.lineWidth = 2.5;


    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a =
        points[
          connection[0]
        ];

      const b =
        points[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        a.x,
        a.y
      );

      ctx.lineTo(
        b.x,
        b.y
      );

      ctx.stroke();

    }


    ctx.fillStyle =
      "#00eaff";


    for(
      const p of points
    ){

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  const pinching =
    getPinchingHands(
      detected
    );


  /* =================================================
     TWO-HAND CONTROL
  ================================================= */

  if(
    cubeExists &&
    pinching.length === 2
  ){

    const p1 =
      screenPosition(
        detected[
          pinching[0]
        ][8]
      );


    const p2 =
      screenPosition(
        detected[
          pinching[1]
        ][8]
      );


    const dx =
      p2.x-p1.x;

    const dy =
      p2.y-p1.y;


    const distance =
      Math.hypot(
        dx,
        dy
      );


    const angle =
      Math.atan2(
        dy,
        dx
      );


    const centerX =
      (p1.x+p2.x)/2;

    const centerY =
      (p1.y+p2.y)/2;


    if(!twoHandMode){

      twoHandMode=true;

      grabbed=true;

      twoStartDistance =
        Math.max(
          distance,
          10
        );

      twoStartScale =
        cubeScale;

      twoStartAngle =
        angle;

      twoStartRotZ =
        rotZ;

      twoStartCenterY =
        centerY;

      twoStartRotX =
        rotX;

    }


    /* SCALE */

    let targetScale =
      twoStartScale *
      (
        distance/
        twoStartDistance
      );


    targetScale =
      Math.max(
        .4,
        Math.min(
          3.5,
          targetScale
        )
      );


    cubeScale +=
      (
        targetScale-
        cubeScale
      )*.25;


    /* ROTATE */

    let angleChange =
      (
        angle-
        twoStartAngle
      ) *
      180/Math.PI;


    while(
      angleChange>180
    ){

      angleChange-=360;

    }


    while(
      angleChange<-180
    ){

      angleChange+=360;

    }


    const targetRotZ =
      twoStartRotZ+
      angleChange;


    rotZ +=
      (
        targetRotZ-
        rotZ
      )*.25;


    /* TILT FORWARD / BACK */

    const vertical =
      centerY-
      twoStartCenterY;


    let targetRotX =
      twoStartRotX+
      vertical*.8;


    targetRotX =
      Math.max(
        -80,
        Math.min(
          80,
          targetRotX
        )
      );


    rotX +=
      (
        targetRotX-
        rotX
      )*.25;


    /* MOVE */

    cubeX =
      centerX;

    cubeY =
      centerY;


    modeText.textContent =
      "Mode: TWO HAND";

    status.textContent =
      "MOVE • TWIST • TILT • RESIZE";


    updateCube();

    return;

  }


  /* =================================================
     EXIT TWO HAND
  ================================================= */

  twoHandMode=false;


  /* =================================================
     CURRENT GRAB
  ================================================= */

  if(grabbed){

    let best = -1;

    let bestDistance =
      Infinity;


    for(
      let i=0;
      i<detected.length;
      i++
    ){

      if(
        !isPinching(
          detected[i]
        )
      ){

        continue;

      }


      const fingertip =
        screenPosition(
          detected[i][8]
        );


      const d =
        Math.hypot(

          fingertip.x-grabX,

          fingertip.y-grabY

        );


      if(
        d<bestDistance
      ){

        bestDistance=d;

        best=i;

      }

    }


    if(
      best>=0 &&
      bestDistance<180
    ){

      const fingertip =
        screenPosition(
          detected[best][8]
        );


      cubeX =
        fingertip.x+
        grabOffsetX;


      cubeY =
        fingertip.y+
        grabOffsetY;


      grabX =
        fingertip.x;

      grabY =
        fingertip.y;


      showRing(
        fingertip.x,
        fingertip.y
      );


      modeText.textContent =
        "Mode: GRABBED";

      status.textContent =
        "CUBE IN HAND 🤏";


      updateCube();

      return;

    }


    /* RELEASE */

    grabbed=false;

    hideRing();


    modeText.textContent =
      "Mode: PLACED";

    status.textContent =
      "CUBE RELEASED";


    return;

  }


  /* =================================================
     GRAB EXISTING CUBE
  ================================================= */

  if(
    cubeExists &&
    pinching.length>0
  ){

    let closest = -1;

    let closestDistance =
      Infinity;


    for(
      const i of pinching
    ){

      const fingertip =
        screenPosition(
          detected[i][8]
        );


      const d =
        Math.hypot(

          fingertip.x-cubeX,

          fingertip.y-cubeY

        );


      if(
        d<closestDistance
      ){

        closestDistance=d;

        closest=i;

      }

    }


    if(
      closest>=0 &&
      closestDistance<
      110*cubeScale
    ){

      const fingertip =
        screenPosition(
          detected[closest][8]
        );


      grabbed=true;


      grabX =
        fingertip.x;

      grabY =
        fingertip.y;


      grabOffsetX =
        cubeX-
        fingertip.x;

      grabOffsetY =
        cubeY-
        fingertip.y;


      showRing(
        fingertip.x,
        fingertip.y
      );


      modeText.textContent =
        "Mode: GRABBED";

      status.textContent =
        "CUBE GRABBED 🤏";


      updateCube();

      return;

    }

  }


  /* =================================================
     CREATE FIRST CUBE
  ================================================= */

  if(
    !cubeExists &&
    pinching.length>0
  ){

    const fingertip =
      screenPosition(
        detected[
          pinching[0]
        ][8]
      );


    cubeX =
      fingertip.x;

    cubeY =
      fingertip.y;


    cubeScale=1;

    rotX=-20;

    rotY=30;

    rotZ=0;


    cubeExists=true;

    grabbed=true;


    grabX =
      fingertip.x;

    grabY =
      fingertip.y;


    grabOffsetX=0;

    grabOffsetY=0;


    showRing(
      fingertip.x,
      fingertip.y
    );


    modeText.textContent =
      "Mode: GRABBED";

    status.textContent =
      "CUBE CREATED 🤏";


    updateCube();

    return;

  }


  /* =================================================
     NORMAL
  ================================================= */

  if(cubeExists){

    updateCube();

    modeText.textContent =
      "Mode: PLACED";

    status.textContent =
      "PINCH THE CUBE TO GRAB";

  }

  else{

    status.textContent =
      detected.length
      ?
      "PINCH TO CREATE CUBE"
      :
      "SHOW YOUR HANDS";

  }

});


/* =====================================================
   STOP CAMERA
===================================================== */

function stopCamera(){

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(
        track =>
        track.stop()
      );

    currentStream=null;

  }


  video.pause();

  video.srcObject=null;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  cameraReady=false;


  stopCamera();


  try{

    status.textContent =
      usingFrontCamera
      ?
      "Starting front camera..."
      :
      "Starting back camera...";


    /*
      First try the requested camera.

      Phones:
      environment = rear
      user = front

      Computers:
      browser may simply use the
      available webcam.
    */

    let stream;


    try{

      stream =
        await navigator
        .mediaDevices
        .getUserMedia({

          video:{

            facingMode:
              usingFrontCamera
              ? "user"
              : "environment",

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            frameRate:{
              ideal:30,
              max:30
            }

          },

          audio:false

        });

    }

    catch(firstError){

      console.log(
        "Requested camera unavailable. Using fallback.",
        firstError
      );


      /*
        COMPUTER / FALLBACK

        Use whatever video camera
        the browser can provide.
      */

      stream =
        await navigator
        .mediaDevices
        .getUserMedia({

          video:true,

          audio:false

        });

    }


    currentStream =
      stream;


    video.srcObject =
      stream;


    /*
      Set mirroring BEFORE playback.
    */

    video.classList.remove(
      "front",
      "back"
    );


    if(usingFrontCamera){

      video.classList.add(
        "front"
      );

    }

    else{

      video.classList.add(
        "back"
      );

    }


    await video.play();


    cameraReady=true;


    /*
      Get actual camera information.
    */

    const track =
      stream
      .getVideoTracks()[0];


    console.log(
      "ACTIVE CAMERA:",
      track.getSettings()
    );


    cameraModeText.textContent =
      usingFrontCamera
      ?
      "Camera: FRONT"
      :
      "Camera: BACK";


    cameraButton.textContent =
      usingFrontCamera
      ?
      "SWITCH TO BACK"
      :
      "SWITCH TO FRONT";


    status.textContent =
      "Hand tracking active";


    /*
      Start frame processing.
    */

    requestAnimationFrame(
      processFrame
    );

  }

  catch(error){

    console.error(
      error
    );


    cameraReady=false;


    status.textContent =
      "Camera error: "+
      error.message;

  }

}


/* =====================================================
   PROCESS FRAMES
===================================================== */

async function processFrame(){

  if(

    cameraReady &&

    video.readyState>=2 &&

    !processing

  ){

    processing=true;


    try{

      await hands.send({

        image:video

      });

    }

    catch(error){

      console.error(
        "Tracking error:",
        error
      );

    }


    processing=false;

  }


  requestAnimationFrame(
    processFrame
  );

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

cameraButton.addEventListener(
  "click",
  async()=>{

    if(!cameraReady){

      return;

    }


    cameraButton.disabled=true;


    usingFrontCamera =
      !usingFrontCamera;


    await startCamera();


    cameraButton.disabled=false;

  }
);


/* =====================================================
   START
===================================================== */

/*
  Always begin with the BACK camera.

  If the device doesn't have a rear camera,
  the fallback automatically uses its
  available webcam.
*/

usingFrontCamera=false;

startCamera();

</script>

</body>
</html>
