<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const handCanvas =
  document.getElementById("handCanvas");

const handCtx =
  handCanvas.getContext("2d");

const threeCanvas =
  document.getElementById("threeCanvas");

const statusText =
  document.getElementById("statusText");

const listenDot =
  document.getElementById("listenDot");

const voiceText =
  document.getElementById("voiceText");

const reticle =

const cameraButton =

/* =====================================================
   CAMERA
===================================================== */

let usingFrontCamera=true;
let currentStream=null;
let cameraReady=false;
let processing=false;


async function startCamera(){

  cameraReady=false;

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );

  }

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:
            usingFrontCamera
            ?"user"
            :"environment",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }
        },

        audio:false

      });

    currentStream=stream;

    video.srcObject=stream;

    video.classList.remove(
      "front",
      "back"
    );

    video.classList.add(
      usingFrontCamera
      ?"front"
      :"back"
    );

    await video.play();

    cameraReady=true;

    statusText.textContent=
      "JARVIS READY";

  }

  catch(error){

    console.error(error);

    statusText.textContent=
      "CAMERA ERROR";

  }

}


cameraButton.onclick=async()=>{

  usingFrontCamera=
    !usingFrontCamera;

  await startCamera();

};


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  handCanvas.width=
    window.innerWidth;

  handCanvas.height=
    window.innerHeight;

}

resize();

window.addEventListener(

);


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(point){

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const sw=window.innerWidth;
  const sh=window.innerHeight;

  if(!vw || !vh){

    return{
      x:sw/2,
      y:sh/2
    };

  }

  const videoRatio=vw/vh;
  const screenRatio=sw/sh;

  let width;
  let height;
  let offsetX=0;
  let offsetY=0;

  if(screenRatio>videoRatio){

    width=sw;
    height=sw/videoRatio;

    offsetY=(sh-height)/2;

  }

  else{

    height=sh;
    width=sh*videoRatio;

    offsetX=(sw-width)/2;

  }

  let x=
    point.x*width+
    offsetX;

  let y=
    point.y*height+
    offsetY;

  if(usingFrontCamera){

    x=sw-x;

  }

  return{x,y};

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands=
  new Hands({

    locateFile:
      file=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });

hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


/* =====================================================
   THREE
===================================================== */

const renderer=
  new THREE.WebGLRenderer({

    canvas:threeCanvas,

    alpha:true,

    antialias:true

  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene=
  new THREE.Scene();


const camera=
  new THREE.PerspectiveCamera(

    55,

    window.innerWidth/
    window.innerHeight,

    .1,

    100

  );

camera.position.z=8;


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.5
  )
);

const pointLight=
  new THREE.PointLight(
    0x00eaff,
    5,
    20
  );

pointLight.position.set(
  0,
  2,
  4
);

scene.add(pointLight);


/* =====================================================
   OBJECT SYSTEM
===================================================== */

const objects=[];

let activeObject=null;

const shapeNames=[
  "CUBE",
  "SPHERE",
  "PYRAMID",
  "TORUS",
  "CYLINDER",
  "STAR"
];

let nextShape=0;


/* =====================================================
   NEON HOLOGRAM MATERIAL
===================================================== */

function hologramMaterial(){

  const colors=[
    0x00eaff,
    0x00ffff,
    0x008cff,
    0xff00ff,
    0x7a00ff,
    0x00ffcc
  ];

  const color=
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];

  return new THREE.MeshStandardMaterial({

    color:color,

    emissive:color,

    emissiveIntensity:2.5,

    transparent:true,

    opacity:.82,

    wireframe:true,

    metalness:.15,

    roughness:.25

  });

}


/* =====================================================
   CREATE SHAPE
===================================================== */

function createShape(type){

  let geometry;


  if(type==="CUBE"){

    geometry=
      new THREE.BoxGeometry(
        1.4,
        1.4,
        1.4
      );

  }

  else if(type==="SPHERE"){

    geometry=
      new THREE.SphereGeometry(
        .8,
        32,
        32
      );

  }

  else if(type==="PYRAMID"){

    geometry=
      new THREE.ConeGeometry(
        .9,
        1.6,
        4
      );

  }

  else if(type==="TORUS"){

    geometry=
      new THREE.TorusGeometry(
        .65,
        .22,
        20,
        48
      );

  }

  else if(type==="CYLINDER"){

    geometry=
      new THREE.CylinderGeometry(
        .65,
        .65,
        1.5,
        32
      );

  }

  else{

    geometry=
      new THREE.IcosahedronGeometry(
        .9,
        1
      );

  }


  const mesh=
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    );


  mesh.userData.type=type;

  /*
     IMPORTANT:
     No gravity.
     Objects remain exactly where
     JARVIS or your hands put them.
  */

  mesh.userData.velocity=
    new THREE.Vector3();

  mesh.userData.angularVelocity=
    new THREE.Vector3();


  scene.add(mesh);

  objects.push(mesh);

  return mesh;

}


/* =====================================================
   HAND → WORLD
===================================================== */

function handToWorld(x,y){

  const nx=
    (x/window.innerWidth)*2-1;

  const ny=
    -(y/window.innerHeight)*2+1;

  const vector=
    new THREE.Vector3(
      nx,
      ny,
      0
    );

  vector.unproject(camera);

  const direction=
    vector
      .sub(camera.position)
      .normalize();

  return camera.position
    .clone()
    .add(
      direction.multiplyScalar(6)
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance2D(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =====================================================
   PINCH
===================================================== */

function isPinching(hand){

  return(
    distance2D(
      hand[4],
      hand[8]
    )<.055
  );

}


/* =====================================================
   FIND OBJECT
===================================================== */

function worldToScreen(position){

  const vector=
    position
      .clone()
      .project(camera);

  return{

    x:
      (vector.x+1)/2*
      window.innerWidth,

    y:
      (-vector.y+1)/2*
      window.innerHeight

  };

}


function findObject(position){

  let closest=null;

  let closestDistance=Infinity;

  for(const obj of objects){

    const screen=
      worldToScreen(
        obj.position
      );

    const d=
      distance2D(
        position,
        screen
      );

    if(d<closestDistance){

      closestDistance=d;
      closest=obj;

    }

  }

  if(
    closestDistance<130
  ){

    return closest;

  }

  return null;

}


/* =====================================================
   GRAB SYSTEM
===================================================== */

let grabbing=false;

let grabOffset=
  new THREE.Vector3();

let previousFinger=null;

let grabVelocity=
  new THREE.Vector3();

let twoHand=false;

let twoStartDistance=1;

let twoStartScale=1;

let twoStartAngle=0;

let twoStartRotation=0;

let twoStartTilt=0;


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults(results=>{

  if(!cameraReady)return;


  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );


  const detected=
    results.multiHandLandmarks||[];


  /*
     HAND VISUALS
  */

  for(const hand of detected){

    const points=
      hand.map(screenPosition);

    handCtx.strokeStyle=
      "#00eaff";

    handCtx.lineWidth=2;

    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a=
        points[connection[0]];

      const b=
        points[connection[1]];

      handCtx.beginPath();

      handCtx.moveTo(
        a.x,
        a.y
      );

      handCtx.lineTo(
        b.x,
        b.y
      );

      handCtx.stroke();

    }


    handCtx.fillStyle=
      "#00eaff";

    for(const p of points){

      handCtx.beginPath();

      handCtx.arc(
        p.x,
        p.y,
        3,
        0,
        Math.PI*2
      );

      handCtx.fill();

    }

  }


  /*
     PINCHING
  */

  const pinching=[];

  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      pinching.push(i);

    }

  }


  /* =================================================
     TWO HAND MANIPULATION
  ================================================= */

  if(pinching.length===2){

    const p1=
      screenPosition(
        detected[pinching[0]][8]
      );

    const p2=
      screenPosition(
        detected[pinching[1]][8]
      );

    const d=
      distance2D(p1,p2);

    const angle=
      Math.atan2(
        p2.y-p1.y,
        p2.x-p1.x
      );

    const centerX=
      (p1.x+p2.x)/2;

    const centerY=
      (p1.y+p2.y)/2;


    if(
      !twoHand &&
      activeObject
    ){

      twoHand=true;

      grabbing=true;

      twoStartDistance=
        Math.max(d,10);

      twoStartScale=
        activeObject.scale.x;

      twoStartAngle=
        angle;

      twoStartRotation=
        activeObject.rotation.z;

      twoStartTilt=
        activeObject.rotation.x;

    }


    if(activeObject){

      let scale=
        twoStartScale*
        d/
        twoStartDistance;

      scale=
        Math.max(
          .25,
          Math.min(
            5,
            scale
          )
        );

      activeObject.scale.setScalar(
        scale
      );


      activeObject.rotation.z=
        twoStartRotation+
        (
          angle-
          twoStartAngle
        );


      activeObject.rotation.x=
        twoStartTilt+
        (
          centerY-
          window.innerHeight/2
        )*.008;


      activeObject.position.copy(
        handToWorld(
          centerX,
          centerY
        )
      );

    }

    return;

  }


  twoHand=false;


  /* =================================================
     SINGLE HAND GRAB
  ================================================= */

  if(pinching.length>0){

    const index=
      pinching[0];

    const fingertip=
      screenPosition(
        detected[index][8]
      );


    reticle.style.display="block";

    reticle.style.left=
      fingertip.x+"px";

    reticle.style.top=
      fingertip.y+"px";


    /*
       CONTINUE GRAB
    */

    if(
      grabbing &&
      activeObject
    ){

      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );

      target.add(
        grabOffset
      );

      activeObject.position.lerp(
        target,
        .75
      );


      if(previousFinger){

        grabVelocity.set(

          fingertip.x-
          previousFinger.x,

          previousFinger.y-
          fingertip.y,

          0

        );

      }

      previousFinger=
        fingertip;

      return;

    }


    /*
       SELECT EXISTING OBJECT
    */

    const found=
      findObject(
        fingertip
      );


    if(found){

      activeObject=found;

      grabbing=true;

      previousFinger=
        fingertip;

      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );

      grabOffset=
        activeObject.position
          .clone()
          .sub(target);

      return;

    }


    /*
       CREATE ORIGINAL CUBE
       ON FIRST PINCH
    */

    const type=
      shapeNames[nextShape];

    nextShape=
      (nextShape+1)%
      shapeNames.length;

    activeObject=
      createShape(type);

    activeObject.position.copy(
      handToWorld(
        fingertip.x,
        fingertip.y
      )
    );

    grabbing=true;

    previousFinger=
      fingertip;

    grabOffset.set(0,0,0);

    return;

  }


  /* =================================================
     RELEASE
  ================================================= */

  if(grabbing){

    grabbing=false;

    previousFinger=null;

    /*
       Small momentum only.
       NO gravity.
    */

    if(activeObject){

      activeObject.position.x+=
        grabVelocity.x*.002;

      activeObject.position.y+=
        grabVelocity.y*.002;

    }

    grabVelocity.set(0,0,0);

  }


  reticle.style.display="none";

});


/* =====================================================
   JARVIS VOICE
===================================================== */

const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;


let recognition=null;

let listening=false;

let jarvisActive=false;


function speak(text){

  if(!("speechSynthesis" in window))
    return;

  speechSynthesis.cancel();

  const utterance=
    new SpeechSynthesisUtterance(
      text
    );

  utterance.rate=.95;

  utterance.pitch=.85;

  utterance.volume=1;

  speechSynthesis.speak(
    utterance
  );

  voiceText.textContent=
    "JARVIS: "+text;

}


function startListening(){

  if(!recognition)return;

  try{

    recognition.start();

  }

  catch(e){}

}


function setupVoice(){

  if(!SpeechRecognition){

    voiceText.textContent=
      "Voice recognition is not supported in this browser.";

    return;

  }


  recognition=
    new SpeechRecognition();


  recognition.continuous=true;

  recognition.interimResults=false;

  recognition.lang="en-US";


  recognition.onstart=()=>{

    listening=true;

    listenDot.classList.add(
      "listening"
    );

    statusText.textContent=
      "LISTENING";

  };


  recognition.onend=()=>{

    listening=false;

    listenDot.classList.remove(
      "listening"
    );

    statusText.textContent=
      "JARVIS READY";

    setTimeout(
      startListening,
      300
    );

  };


  recognition.onerror=event=>{

    console.log(
      "Voice:",
      event.error
    );

  };


  recognition.onresult=event=>{

    const result=
      event.results[
        event.results.length-1
      ];

    const text=
      result[0].transcript
        .trim()
        .toLowerCase();


    console.log(
      "Heard:",
      text
    );


    handleCommand(text);

  };


  startListening();

}


/* =====================================================
   JARVIS COMMAND SYSTEM
===================================================== */

function handleCommand(text){

  /*
     JARVIS ACTIVATION
  */

  if(
    text.includes("jarvis")
  ){

    jarvisActive=true;

    speak(
      "Yes. How can I help?"
    );

    return;

  }


  if(!jarvisActive)
    return;


  /*
     CREATE OBJECTS
  */

  if(
    text.includes("cube")
  ){

    createVoiceObject(
      "CUBE"
    );

    speak(
      "Creating a cube."
    );

    return;

  }


  if(
    text.includes("sphere") ||
    text.includes("ball")
  ){

    createVoiceObject(
      "SPHERE"
    );

    speak(
      "Creating a sphere."
    );

    return;

  }


  if(
    text.includes("pyramid")
  ){

    createVoiceObject(
      "PYRAMID"
    );

    speak(
      "Creating a pyramid."
    );

    return;

  }


  if(
    text.includes("torus") ||
    text.includes("ring")
  ){

    createVoiceObject(
      "TORUS"
    );

    speak(
      "Creating a torus."
    );

    return;

  }


  if(
    text.includes("cylinder")
  ){

    createVoiceObject(
      "CYLINDER"
    );

    speak(
      "Creating a cylinder."
    );

    return;

  }


  /*
     CLEAR
  */

  if(
    text.includes("clear") ||
    text.includes("remove everything")
  ){

    clearObjects();

    speak(
      "All models removed."
    );

    return;

  }


  /*
     DELETE ACTIVE
  */

  if(
    text.includes("delete") ||
    text.includes("remove it")
  ){

    if(activeObject){

      scene.remove(
        activeObject
      );

      const index=
        objects.indexOf(
          activeObject
        );

      if(index>-1)
        objects.splice(
          index,
          1
        );

      activeObject=null;

      speak(
        "Model removed."
      );

    }

    else{

      speak(
        "There is no active model."
      );

    }

    return;

  }


  /*
     HELP
  */

  if(
    text.includes("what can you do") ||
    text.includes("help")
  ){

    speak(
      "I can create models, manipulate them with your hands, and help you design objects."
    );

    return;

  }


  /*
     UNKNOWN COMMAND
  */

  speak(
    "I heard you. I don't have a command for that yet."
  );

}


/* =====================================================
   VOICE OBJECT
===================================================== */

function createVoiceObject(type){

  const object=
    createShape(type);

  object.position.set(
    0,
    0,
    0
  );

  activeObject=
    object;

}


/* =====================================================
   CLEAR OBJECTS
===================================================== */

function clearObjects(){

  for(
    const object
    of objects
  ){

    scene.remove(
      object
    );

  }

  objects.length=0;

  activeObject=null;

}

    (Math.random()-.5)*8;

}


particleGeometry.setAttribute(

  "position",

  new THREE.BufferAttribute(
    positions,
    3
  )

);


const particleMaterial=
  new THREE.PointsMaterial({

    color:0x00eaff,

    size:.025,

    transparent:true,

    opacity:.45

  });


const particles=
  new THREE.Points(
    particleGeometry,
    particleMaterial
  );

scene.add(particles);


/* =====================================================
   ANIMATION
===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  /*
     PARTICLES
  */

  particles.rotation.y+=
    .0005;


  /*
     NEON OBJECT PULSE
  */

  for(
    const object
    of objects
  ){

    if(
      object.material &&
      object.material.emissive
    ){

      object.material.emissiveIntensity=
        object===activeObject
        ?
        2.8+
        Math.sin(
          performance.now()*.004
        )*.8
        :
        2.2;

    }

  }


  renderer.render(
    scene,
    camera
  );

}

animate();


/* =====================================================
   TRACKING LOOP
===================================================== */

async function trackingLoop(){

  if(
    cameraReady &&
    video.readyState>=2 &&
    !processing
  ){

    processing=true;

    try{

      await hands.send({
        image:video
      });

    }

    catch(error){

      console.log(error);

    }

    processing=false;

  }

  requestAnimationFrame(
    trackingLoop
  );

}


/* =====================================================
   RESIZE THREE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

  }
);


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  await startCamera();

  setupVoice();

  trackingLoop();

}

boot();

</script>
