<!DOCTYPE html>
<html>
<head>

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

/* CAMERA */

#camera{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  transform:scaleX(-1);

  z-index:1;
}


/* HAND CANVAS */

#output{
  position:fixed;
  inset:0;

  width:100%;
  height:100%;

  pointer-events:none;

  z-index:2;
}


/* HUD */

#hud{

  position:fixed;

  top:15px;
  left:15px;

  z-index:50;

  color:#00eaff;

  background:rgba(0,0,0,.75);

  border:1px solid #00eaff;

  border-radius:10px;

  padding:12px 16px;

  line-height:1.5;

  font-size:15px;

}


/* =====================================================
   CUBE CONTAINER
===================================================== */

#cube-container{

  position:fixed;

  left:50%;
  top:50%;

  width:0;
  height:0;

  display:none;

  z-index:10;

  perspective:900px;

  transform-style:preserve-3d;

  pointer-events:none;

}


/* =====================================================
   CUBE
===================================================== */

#cube{

  position:absolute;

  width:120px;
  height:120px;

  left:-60px;
  top:-60px;

  transform-style:preserve-3d;

  will-change:
    transform;

}


/* =====================================================
   CUBE FACES
===================================================== */

.face{

  position:absolute;

  width:120px;
  height:120px;

  box-sizing:border-box;

  border:3px solid #00eaff;

  background:
    linear-gradient(
      135deg,
      rgba(0,255,255,.24),
      rgba(0,80,255,.08)
    );

  box-shadow:

    inset 0 0 25px rgba(0,240,255,.7),

    0 0 15px rgba(0,240,255,.8),

    0 0 35px rgba(0,180,255,.25);

  backface-visibility:visible;

}


/* FRONT */

.front{

  transform:
    translateZ(60px);

}


/* BACK */

.back{

  transform:
    rotateY(180deg)
    translateZ(60px);

}


/* RIGHT */

.right{

  transform:
    rotateY(90deg)
    translateZ(60px);

}


/* LEFT */

.left{

  transform:
    rotateY(-90deg)
    translateZ(60px);

}


/* TOP */

.top{

  transform:
    rotateX(90deg)
    translateZ(60px);

}


/* BOTTOM */

.bottom{

  transform:
    rotateX(-90deg)
    translateZ(60px);

}


/* =====================================================
   CENTER / GRAB POINT
===================================================== */

#centerDot{

  position:fixed;

  width:7px;
  height:7px;

  margin-left:-3.5px;
  margin-top:-3.5px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:
    0 0 12px #00eaff,
    0 0 25px #00eaff;

  display:none;

  z-index:15;

}


/* =====================================================
   GRAB RING
===================================================== */

#grabRing{

  position:fixed;

  width:30px;
  height:30px;

  margin-left:-15px;
  margin-top:-15px;

  border:

    2px solid
    rgba(0,234,255,.8);

  border-radius:50%;

  display:none;

  z-index:14;

  pointer-events:none;

  box-shadow:
    0 0 12px #00eaff;

}

</style>
</head>


<body>


<!-- CAMERA -->

<video
  id="camera"
  autoplay
  playsinline>
</video>


<!-- HAND DRAWING -->

<canvas id="output"></canvas>


<!-- HUD -->

<div id="hud">

  <b>JARVIS AR</b>

  <div id="status">
    Starting camera...
  </div>

  <div id="hands">
    Hands: 0
  </div>

  <div id="mode">
    Mode: STANDBY
  </div>

</div>


<!-- GRAB INDICATORS -->

<div id="grabRing"></div>

<div id="centerDot"></div>


<!-- CUBE -->

<div id="cube-container">

  <div id="cube">

    <div class="face front"></div>

    <div class="face back"></div>

    <div class="face right"></div>

    <div class="face left"></div>

    <div class="face top"></div>

    <div class="face bottom"></div>

  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsText =
  document.getElementById("hands");

const modeText =
  document.getElementById("mode");

const cubeContainer =
  document.getElementById("cube-container");

const cube =
  document.getElementById("cube");

const centerDot =
  document.getElementById("centerDot");

const grabRing =
  document.getElementById("grabRing");


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   CAMERA → SCREEN
===================================================== */

function screenPosition(point){

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if(!vw || !vh){

    return {
      x:sw/2,
      y:sh/2
    };

  }


  const videoRatio =
    vw/vh;

  const screenRatio =
    sw/sh;


  let width;
  let height;

  let offsetX=0;
  let offsetY=0;


  if(screenRatio > videoRatio){

    width=sw;

    height=
      sw/videoRatio;

    offsetY=
      (sh-height)/2;

  }else{

    height=sh;

    width=
      sh*videoRatio;

    offsetX=
      (sw-width)/2;

  }


  let x =
    point.x*width+
    offsetX;

  let y =
    point.y*height+
    offsetY;


  /* MIRROR */

  x =
    sw-x;


  return {
    x:x,
    y:y
  };

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
  new Hands({

    locateFile:(file)=>{

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.60,

  minTrackingConfidence:.60

});


/* =====================================================
   OBJECT STATE
===================================================== */

let cubeExists =
  false;


/* POSITION */

let cubeX =
  window.innerWidth/2;

let cubeY =
  window.innerHeight/2;


/* ROTATION */

let rotX =
  -20;

let rotY =
  30;

let rotZ =
  0;


/* SCALE */

let cubeScale =
  1;


/* VELOCITY */

let velocityX =
  0;

let velocityY =
  0;

let velocityRotX =
  0;

let velocityRotY =
  0;

let velocityRotZ =
  0;


/* =====================================================
   GRAB STATE
===================================================== */

let grabbed =
  false;

let grabbingHand =
  -1;


/*
   Difference between fingertip
   and cube center.

   This prevents the cube from
   snapping when grabbed.
*/

let grabOffsetX =
  0;

let grabOffsetY =
  0;


/* =====================================================
   TWO HAND STATE
===================================================== */

let twoHandMode =
  false;

let twoHandStartDistance =
  0;

let twoHandStartScale =
  1;

let twoHandStartAngle =
  0;

let twoHandStartRotZ =
  0;

let twoHandStartAverageY =
  0;

let twoHandStartRotX =
  0;

let twoHandStartAverageX =
  0;

let twoHandStartAverageScreenY =
  0;


/* =====================================================
   SMOOTHING
===================================================== */

const positionSmoothing =
  .32;

const rotationSmoothing =
  .25;


/* =====================================================
   UTILITY
===================================================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function angle(a,b){

  return Math.atan2(
    b.y-a.y,
    b.x-a.x
  );

}


/* =====================================================
   PINCH DETECTION
===================================================== */

function pinchDistance(hand){

  const thumb =
    hand[4];

  const index =
    hand[8];


  return Math.hypot(

    thumb.x-index.x,

    thumb.y-index.y,

    thumb.z-index.z

  );

}


/*
   Slightly forgiving pinch.

   This makes grabbing feel
   more natural.
*/

function isPinching(hand){

  return pinchDistance(hand)
    < .070;

}


/* =====================================================
   CUBE UPDATE
===================================================== */

function updateCube(){

  cubeContainer.style.left =
    cubeX+"px";

  cubeContainer.style.top =
    cubeY+"px";


  cube.style.transform =

    `
    scale(${cubeScale})
    rotateX(${rotX}deg)
    rotateY(${rotY}deg)
    rotateZ(${rotZ}deg)
    `;


  cubeContainer.style.display =
    "block";


  centerDot.style.display =
    "block";


  centerDot.style.left =
    cubeX+"px";


  centerDot.style.top =
    cubeY+"px";

}


/* =====================================================
   GRAB RING
===================================================== */

function updateGrabRing(x,y){

  grabRing.style.display =
    "block";

  grabRing.style.left =
    x+"px";

  grabRing.style.top =
    y+"px";

}


function hideGrabRing(){

  grabRing.style.display =
    "none";

}


/* =====================================================
   FIND CLOSEST PINCH
===================================================== */

function findClosestPinch(
  detected,
  pinching
){

  let best =
    -1;

  let bestDistance =
    Infinity;


  for(
    const index of pinching
  ){

    const fingertip =
      screenPosition(
        detected[index][8]
      );


    const d =
      Math.hypot(

        fingertip.x-cubeX,

        fingertip.y-cubeY

      );


    if(
      d <
      bestDistance
    ){

      bestDistance=d;

      best=index;

    }

  }


  return best;

}


/* =====================================================
   MAIN HAND RESULTS
===================================================== */

hands.onResults((results)=>{


  /* CLEAR */

  ctx.clearRect(

    0,
    0,

    canvas.width,
    canvas.height

  );


  const detected =
    results.multiHandLandmarks || [];


  handsText.textContent =
    "Hands: "+
    detected.length;


  /* ===================================================
     DRAW HANDS
  =================================================== */

  for(
    const hand of detected
  ){

    const points =
      hand.map(
        screenPosition
      );


    ctx.strokeStyle =
      "#00eaff";

    ctx.lineWidth=2.5;


    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a =
        points[
          connection[0]
        ];

      const b =
        points[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        a.x,
        a.y
      );

      ctx.lineTo(
        b.x,
        b.y
      );

      ctx.stroke();

    }


    ctx.fillStyle =
      "#00eaff";


    for(
      const p of points
    ){

      ctx.beginPath();

      ctx.arc(

        p.x,
        p.y,

        4,

        0,
        Math.PI*2

      );

      ctx.fill();

    }

  }


  /* ===================================================
     FIND PINCHING HANDS
  =================================================== */

  let pinching=[];


  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      pinching.push(i);

    }

  }


  /* ===================================================
     TWO HAND MODE
  =================================================== */

  if(
    cubeExists &&
    pinching.length===2
  ){

    const handA =
      detected[
        pinching[0]
      ];

    const handB =
      detected[
        pinching[1]
      ];


    const p1 =
      screenPosition(
        handA[8]
      );

    const p2 =
      screenPosition(
        handB[8]
      );


    const d =
      distance(
        p1,
        p2
      );


    const a =
      angle(
        p1,
        p2
      );


    const averageX =
      (p1.x+p2.x)/2;

    const averageY =
      (p1.y+p2.y)/2;


    /* ===============================================
       START TWO HAND
    =============================================== */

    if(!twoHandMode){

      twoHandMode=true;

      grabbed=true;

      twoHandStartDistance =
        d;

      twoHandStartScale =
        cubeScale;

      twoHandStartAngle =
        a;

      twoHandStartRotZ =
        rotZ;

      twoHandStartAverageY =
        averageY;

      twoHandStartRotX =
        rotX;

      twoHandStartAverageX =
        averageX;

      twoHandStartAverageScreenY =
        averageY;

    }


    /* ===============================================
       SCALE
    =============================================== */

    if(
      twoHandStartDistance>5
    ){

      let scaleRatio =
        d/
        twoHandStartDistance;


      let targetScale =
        twoHandStartScale*
        scaleRatio;


      targetScale =
        Math.max(
          .45,
          Math.min(
            3.5,
            targetScale
          )
        );


      cubeScale +=
        (
          targetScale-
          cubeScale
        )*.20;

    }


    /* ===============================================
       TWIST
    =============================================== */

    let angleDifference =
      (
        a-
        twoHandStartAngle
      )*
      180/Math.PI;


    /*
      Keep rotation from
      suddenly jumping across
      -180 / +180.
    */

    while(
      angleDifference>180
    ){

      angleDifference-=360;

    }

    while(
      angleDifference<-180
    ){

      angleDifference+=360;

    }


    let targetRotZ =
      twoHandStartRotZ+
      angleDifference;


    rotZ +=
      (
        targetRotZ-
        rotZ
      )*.22;


    /* ===============================================
       FORWARD / BACKWARD
    =============================================== */

    const verticalMovement =
      averageY-
      twoHandStartAverageY;


    let targetRotX =
      twoHandStartRotX+
      verticalMovement*
      .85;


    targetRotX =
      Math.max(
        -80,
        Math.min(
          80,
          targetRotX
        )
      );


    rotX +=
      (
        targetRotX-
        rotX
      )*.20;


    /* ===============================================
       MOVE OBJECT
    =============================================== */

    let targetX =
      averageX;

    let targetY =
      averageY;


    cubeX +=
      (
        targetX-
        cubeX
      )*
      .35;


    cubeY +=
      (
        targetY-
        cubeY
      )*
      .35;


    velocityX =
      targetX-
      cubeX;

    velocityY =
      targetY-
      cubeY;


    modeText.textContent =
      "Mode: TWO-HAND GRAB";

    status.textContent =
      "MOVE • TWIST • TILT • RESIZE";


    updateCube();


    return;

  }


  /* ===================================================
     EXIT TWO HAND MODE
  =================================================== */

  if(twoHandMode){

    twoHandMode=false;

  }


  /* ===================================================
     CURRENT ONE HAND GRAB
  =================================================== */

  if(
    grabbed &&
    grabbingHand>=0
  ){

    if(
      grabbingHand<
      detected.length
    ){

      const hand =
        detected[
          grabbingHand
        ];


      /* =============================================
         STILL PINCHING
      ============================================= */

      if(
        isPinching(hand)
      ){

        const fingertip =
          screenPosition(
            hand[8]
          );


        /*
          Target includes the original
          grab offset.
        */

        const targetX =
          fingertip.x+
          grabOffsetX;


        const targetY =
          fingertip.y+
          grabOffsetY;


        const oldX =
          cubeX;

        const oldY =
          cubeY;


        cubeX +=
          (
            targetX-
            cubeX
          )*
          positionSmoothing;


        cubeY +=
          (
            targetY-
            cubeY
          )*
          positionSmoothing;


        /*
          Velocity gives the object
          physical-looking movement.
        */

        velocityX =
          cubeX-oldX;

        velocityY =
          cubeY-oldY;


        updateGrabRing(
          fingertip.x,
          fingertip.y
        );


        modeText.textContent =
          "Mode: GRABBED";

        status.textContent =
          "CUBE IN HAND 🤏";


        updateCube();

        return;

      }

    }


    /* =============================================
       RELEASE
    ============================================= */

    grabbed=false;

    grabbingHand=-1;


    hideGrabRing();


    modeText.textContent =
      "Mode: PLACED";

    status.textContent =
      "CUBE RELEASED";


    return;

  }


  /* ===================================================
     TRY TO GRAB EXISTING CUBE
  =================================================== */

  if(
    cubeExists &&
    pinching.length>0
  ){

    const candidate =
      findClosestPinch(
        detected,
        pinching
      );


    if(candidate>=0){

      const fingertip =
        screenPosition(
          detected[candidate][8]
        );


      const distanceToCube =
        Math.hypot(

          fingertip.x-
          cubeX,

          fingertip.y-
          cubeY

        );


      /*
        Larger grabbing zone
        makes it feel easier
        to physically grab.
      */

      const grabRadius =
        85*
        cubeScale;


      if(
        distanceToCube<
        grabRadius
      ){

        grabbed=true;

        grabbingHand=
          candidate;


        /*
          Remember where on the
          cube the finger grabbed it.
        */

        grabOffsetX =
          cubeX-
          fingertip.x;


        grabOffsetY =
          cubeY-
          fingertip.y;


        velocityX=0;
        velocityY=0;


        updateGrabRing(
          fingertip.x,
          fingertip.y
        );


        modeText.textContent =
          "Mode: GRABBED";

        status.textContent =
          "CUBE GRABBED 🤏";


        updateCube();

        return;

      }

    }

  }


  /* ===================================================
     CREATE FIRST CUBE
  =================================================== */

  if(
    !cubeExists &&
    pinching.length>0
  ){

    const index =
      pinching[0];


    const fingertip =
      screenPosition(
        detected[index][8]
      );


    cubeX =
      fingertip.x;

    cubeY =
      fingertip.y;


    cubeScale=1;


    rotX=-20;
    rotY=30;
    rotZ=0;


    velocityX=0;
    velocityY=0;


    cubeExists=true;

    grabbed=true;

    grabbingHand=
      index;


    grabOffsetX=0;
    grabOffsetY=0;


    updateGrabRing(
      fingertip.x,
      fingertip.y
    );


    modeText.textContent =
      "Mode: GRABBED";

    status.textContent =
      "CUBE CREATED 🤏";


    updateCube();

    return;

  }


  /* ===================================================
     PHYSICS AFTER RELEASE
  =================================================== */

  if(
    cubeExists &&
    !grabbed
  ){

    /*
      Natural momentum.
    */

    cubeX +=
      velocityX;

    cubeY +=
      velocityY;


    /*
      Air resistance.
    */

    velocityX *=
      .88;

    velocityY *=
      .88;


    /*
      Stop tiny movement.
    */

    if(
      Math.abs(velocityX)<.05
    ){

      velocityX=0;

    }

    if(
      Math.abs(velocityY)<.05
    ){

      velocityY=0;

    }


    updateCube();


    modeText.textContent =
      "Mode: PLACED";

    status.textContent =
      "PINCH CUBE TO GRAB";


  }else if(
    !cubeExists
  ){

    status.textContent =
      detected.length
      ? "PINCH TO CREATE CUBE"
      : "SHOW YOUR HANDS";

  }

});


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

  try{

    status.textContent =
      "Requesting camera...";


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{

          facingMode:"user",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    const camera =
      new Camera(
        video,
        {

          onFrame:
            async()=>{

              await hands.send({
                image:video
              });

            },

          width:1280,

          height:720

        }
      );


    camera.start();


  }catch(error){

    console.error(error);

    status.textContent =
      "Camera error: "+
      error.message;

  }

}


/* =====================================================
   START
===================================================== */

startCamera();

</script>

</body>
</html>
```
