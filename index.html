```html
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  z-index:1;
}

#output{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:50;
  color:#00eaff;
  background:rgba(0,0,0,.75);
  border:1px solid #00eaff;
  border-radius:10px;
  padding:12px 16px;
  line-height:1.5;
}

#cube-container{
  position:fixed;
  left:50%;
  top:50%;
  width:0;
  height:0;
  display:none;
  z-index:10;
  perspective:800px;
  transform-style:preserve-3d;
  pointer-events:none;
}

#cube{
  position:absolute;
  width:100px;
  height:100px;
  left:-50px;
  top:-50px;
  transform-style:preserve-3d;
  transform:
    rotateX(-20deg)
    rotateY(30deg);
  transition:none;
}

.face{
  position:absolute;
  width:100px;
  height:100px;
  box-sizing:border-box;
  border:3px solid #00eaff;
  background:rgba(0,220,255,.18);
  box-shadow:
    inset 0 0 20px #00eaff,
    0 0 15px #00eaff;
  backface-visibility:visible;
}

.front{
  transform:translateZ(50px);
}

.back{
  transform:
    rotateY(180deg)
    translateZ(50px);
}

.right{
  transform:
    rotateY(90deg)
    translateZ(50px);
}

.left{
  transform:
    rotateY(-90deg)
    translateZ(50px);
}

.top{
  transform:
    rotateX(90deg)
    translateZ(50px);
}

.bottom{
  transform:
    rotateX(-90deg)
    translateZ(50px);
}

#centerDot{
  position:fixed;
  width:8px;
  height:8px;
  margin-left:-4px;
  margin-top:-4px;
  background:#00eaff;
  border-radius:50%;
  box-shadow:0 0 12px #00eaff;
  display:none;
  z-index:15;
}
</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>

<div id="hud">
  <b>JARVIS AR</b>
  <div id="status">Starting camera...</div>
  <div id="hands">Hands: 0</div>
  <div id="mode">Mode: STANDBY</div>
</div>

<div id="centerDot"></div>

<div id="cube-container">

  <div id="cube">

    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>

  </div>

</div>

<script>

/* =================================================
   ELEMENTS
================================================= */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsText =
  document.getElementById("hands");

const modeText =
  document.getElementById("mode");

const cubeContainer =
  document.getElementById("cube-container");

const cube =
  document.getElementById("cube");

const centerDot =
  document.getElementById("centerDot");


/* =================================================
   CANVAS
================================================= */

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =================================================
   SCREEN POSITION
================================================= */

function screenPosition(point){

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;

  if(!vw || !vh){

    return {
      x:sw/2,
      y:sh/2
    };

  }

  const videoRatio =
    vw/vh;

  const screenRatio =
    sw/sh;

  let width;
  let height;

  let offsetX=0;
  let offsetY=0;

  if(screenRatio > videoRatio){

    width=sw;

    height=
      sw/videoRatio;

    offsetY=
      (sh-height)/2;

  }else{

    height=sh;

    width=
      sh*videoRatio;

    offsetX=
      (sw-width)/2;

  }

  let x =
    point.x*width+
    offsetX;

  let y =
    point.y*height+
    offsetY;

  x =
    sw-x;

  return {
    x:x,
    y:y
  };

}


/* =================================================
   MEDIAPIPE
================================================= */

const hands =
  new Hands({

    locateFile:(file)=>{

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });

hands.setOptions({

  maxNumHands:2,

  modelComplexity:0,

  minDetectionConfidence:.55,

  minTrackingConfidence:.55

});


/* =================================================
   CUBE STATE
================================================= */

let cubeX =
  window.innerWidth/2;

let cubeY =
  window.innerHeight/2;

let cubeScale =
  1;

let rotX =
  -20;

let rotY =
  30;

let rotZ =
  0;

let cubeExists =
  false;

let grabbed =
  false;

let grabbingHand =
  -1;


/* =================================================
   TWO HAND STATE
================================================= */

let twoHandMode =
  false;

let startDistance =
  0;

let startScale =
  1;

let startAngle =
  0;

let startRotation =
  0;


/*
  NEW:
  Starting vertical difference
  between the two fingertips.
*/

let startVerticalDifference =
  0;


/*
  NEW:
  Starting X rotation.
*/

let startRotX =
  0;


/* =================================================
   UPDATE CUBE
================================================= */

function updateCube(){

  cubeContainer.style.left =
    cubeX+"px";

  cubeContainer.style.top =
    cubeY+"px";

  cube.style.transform =
    `
      scale(${cubeScale})
      rotateX(${rotX}deg)
      rotateY(${rotY}deg)
      rotateZ(${rotZ}deg)
    `;

  cubeContainer.style.display =
    "block";

  centerDot.style.display =
    "block";

  centerDot.style.left =
    cubeX+"px";

  centerDot.style.top =
    cubeY+"px";

}


/* =================================================
   PINCH
================================================= */

function isPinching(hand){

  const thumb =
    hand[4];

  const index =
    hand[8];

  const d =
    Math.hypot(
      thumb.x-index.x,
      thumb.y-index.y
    );

  return d<.065;

}


/* =================================================
   DISTANCE
================================================= */

function getDistance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =================================================
   ANGLE
================================================= */

function getAngle(a,b){

  return Math.atan2(
    b.y-a.y,
    b.x-a.x
  );

}


/* =================================================
   RESULTS
================================================= */

hands.onResults((results)=>{

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );

  const detected =
    results.multiHandLandmarks || [];

  handsText.textContent =
    "Hands: "+
    detected.length;


  /* ===============================================
     DRAW HANDS
  =============================================== */

  for(
    const hand of detected
  ){

    const points =
      hand.map(
        screenPosition
      );

    ctx.strokeStyle =
      "#00eaff";

    ctx.lineWidth=3;

    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a =
        points[
          connection[0]
        ];

      const b =
        points[
          connection[1]
        ];

      ctx.beginPath();

      ctx.moveTo(
        a.x,
        a.y
      );

      ctx.lineTo(
        b.x,
        b.y
      );

      ctx.stroke();

    }

    ctx.fillStyle =
      "#00eaff";

    for(
      const p of points
    ){

      ctx.beginPath();

      ctx.arc(
        p.x,
        p.y,
        5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  /* ===============================================
     FIND PINCHING HANDS
  =============================================== */

  let pinching=[];

  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      pinching.push(i);

    }

  }


  /* ===============================================
     TWO-HAND CONTROL
  =============================================== */

  if(
    pinching.length===2 &&
    cubeExists
  ){

    const p1 =
      screenPosition(
        detected[
          pinching[0]
        ][8]
      );

    const p2 =
      screenPosition(
        detected[
          pinching[1]
        ][8]
      );


    const d =
      getDistance(
        p1,
        p2
      );


    const a =
      getAngle(
        p1,
        p2
      );


    /*
      Vertical distance between hands.
    */

    const verticalDifference =
      p2.y-p1.y;


    /* =============================================
       START TWO-HAND MODE
    ============================================= */

    if(!twoHandMode){

      twoHandMode=true;

      startDistance =
        d;

      startScale =
        cubeScale;

      startAngle =
        a;

      startRotation =
        rotZ;


      /*
        Save starting vertical position.
      */

      startVerticalDifference =
        verticalDifference;


      /*
        Save current X rotation.
      */

      startRotX =
        rotX;

    }


    /* =============================================
       SCALE
    ============================================= */

    if(
      startDistance>1
    ){

      cubeScale =
        startScale*
        (
          d/startDistance
        );

    }


    cubeScale =
      Math.max(
        .4,
        Math.min(
          3,
          cubeScale
        )
      );


    /* =============================================
       ROTATE LEFT / RIGHT
    ============================================= */

    rotZ =
      startRotation+
      (
        a-startAngle
      )*
      180/Math.PI;


    /* =============================================
       ROTATE FORWARD / BACKWARD
    ============================================= */

    const verticalMovement =
      verticalDifference-
      startVerticalDifference;


    /*
      Convert hand movement
      into X rotation.

      Move hands vertically
      relative to each other
      to tilt the cube.
    */

    rotX =
      startRotX+
      verticalMovement*
      220;


    /*
      Prevent extreme rotation.
    */

    rotX =
      Math.max(
        -90,
        Math.min(
          90,
          rotX
        )
      );


    /* =============================================
       MOVE
    ============================================= */

    cubeX =
      (p1.x+p2.x)/2;

    cubeY =
      (p1.y+p2.y)/2;


    grabbed=true;


    modeText.textContent =
      "Mode: TWO HAND";

    status.textContent =
      "MOVE • ROTATE • RESIZE";


    updateCube();

    return;

  }


  /* ===============================================
     END TWO HAND MODE
  =============================================== */

  twoHandMode=false;


  /* ===============================================
     CURRENT GRAB
  =============================================== */

  if(
    grabbed
  ){

    if(
      grabbingHand<0 ||
      grabbingHand>=detected.length
    ){

      grabbed=false;

      grabbingHand=-1;

      modeText.textContent =
        "Mode: PLACED";

      status.textContent =
        "CUBE DROPPED ✓";

      return;

    }


    const hand =
      detected[
        grabbingHand
      ];


    if(
      isPinching(hand)
    ){

      const fingertip =
        screenPosition(
          hand[8]
        );


      cubeX =
        fingertip.x;

      cubeY =
        fingertip.y;


      modeText.textContent =
        "Mode: GRABBED";

      status.textContent =
        "CUBE GRABBED 🤏";


      updateCube();

      return;

    }


    /* RELEASE */

    grabbed=false;

    grabbingHand=-1;


    modeText.textContent =
      "Mode: PLACED";

    status.textContent =
      "CUBE DROPPED ✓";


    updateCube();

    return;

  }


  /* ===============================================
     GRAB EXISTING CUBE
  =============================================== */

  if(
    cubeExists &&
    pinching.length>0
  ){

    for(
      const index of pinching
    ){

      const fingertip =
        screenPosition(
          detected[index][8]
        );


      const distanceToCube =
        Math.hypot(
          fingertip.x-cubeX,
          fingertip.y-cubeY
        );


      if(
        distanceToCube
        <
        70*cubeScale
      ){

        grabbed=true;

        grabbingHand=
          index;


        status.textContent =
          "CUBE GRABBED 🤏";

        modeText.textContent =
          "Mode: GRABBED";


        updateCube();

        return;

      }

    }

  }


  /* ===============================================
     FIRST CUBE
  =============================================== */

  if(
    !cubeExists &&
    pinching.length>0
  ){

    const hand =
      detected[
        pinching[0]
      ];


    const fingertip =
      screenPosition(
        hand[8]
      );


    cubeX =
      fingertip.x;

    cubeY =
      fingertip.y;


    cubeScale=1;

    rotX=-20;

    rotY=30;

    rotZ=0;


    cubeExists=true;

    grabbed=true;

    grabbingHand=
      pinching[0];


    status.textContent =
      "CUBE CREATED 🤏";

    modeText.textContent =
      "Mode: GRABBED";


    updateCube();

    return;

  }


  /* ===============================================
     NORMAL
  =============================================== */

  if(
    cubeExists
  ){

    cubeContainer.style.display =
      "block";

    centerDot.style.display =
      "block";


    modeText.textContent =
      "Mode: PLACED";

    status.textContent =
      "PINCH THE CUBE TO GRAB";

  }else{

    status.textContent =
      detected.length
      ? "PINCH TO CREATE CUBE"
      : "SHOW YOUR HANDS";

  }

});


/* =================================================
   CAMERA START
================================================= */

async function startCamera(){

  try{

    status.textContent =
      "Requesting camera...";


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{
          facingMode:"user",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }
        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    const camera =
      new Camera(
        video,
        {

          onFrame:
            async()=>{
              await hands.send({
                image:video
              });
            },

          width:1280,

          height:720

        }
      );


    camera.start();


  }catch(error){

    console.error(error);

    status.textContent =
      "Camera error: "+
      error.message;

  }

}


/* =================================================
   START
================================================= */

startCamera();

</script>

</body>
</html>
```
