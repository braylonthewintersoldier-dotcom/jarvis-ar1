<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

  <script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #output {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 12px;
      border-radius: 10px;
      z-index: 10;
    }

    #cube {
      position: fixed;
      width: 70px;
      height: 70px;
      display: none;
      z-index: 5;
      pointer-events: none;

      transform: translate(-50%, -50%)
                 rotateX(20deg)
                 rotateY(20deg);

      background: rgba(0,255,255,.25);
      border: 3px solid cyan;

      box-shadow:
        0 0 10px cyan,
        0 0 30px cyan;

      animation: spin 2s linear infinite;
    }

    @keyframes spin {
      from {
        transform:
          translate(-50%, -50%)
          rotateX(0deg)
          rotateY(0deg);
      }

      to {
        transform:
          translate(-50%, -50%)
          rotateX(360deg)
          rotateY(360deg);
      }
    }
  </style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>

<div id="hud">
  <b>JARVIS AR</b>
  <div id="status">Starting...</div>
</div>

<div id="cube"></div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");

const status = document.getElementById("status");
const cube = document.getElementById("cube");
  const scene = new THREE.Scene();

const threeCamera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.domElement.style.position = "fixed";
renderer.domElement.style.left = "0";
renderer.domElement.style.top = "0";
renderer.domElement.style.zIndex = "4";
renderer.domElement.style.pointerEvents = "none";

document.body.appendChild(renderer.domElement);


const geometry =
  new THREE.BoxGeometry(0.12, 0.12, 0.12);

const material =
  new THREE.MeshNormalMaterial();

const cube3D =
  new THREE.Mesh(
    geometry,
    material
  );

cube3D.visible = false;

scene.add(cube3D);


function animate3D() {

  requestAnimationFrame(animate3D);

  cube3D.rotation.x += 0.01;
  cube3D.rotation.y += 0.015;

  renderer.render(
    scene,
    threeCamera
  );

}

animate3D();

const hands = new Hands({
  locateFile: (file) => {
    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;
  }
});

hands.setOptions({
  maxNumHands: 2,
  modelComplexity: 1,
  minDetectionConfidence: 0.65,
  minTrackingConfidence: 0.65
});


function resizeCanvas() {

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

}

resizeCanvas();

window.addEventListener("resize", resizeCanvas);


function getCameraCoordinates(point) {

  const videoWidth = video.videoWidth;
  const videoHeight = video.videoHeight;

  const screenWidth = window.innerWidth;
  const screenHeight = window.innerHeight;

  const videoRatio =
    videoWidth / videoHeight;

  const screenRatio =
    screenWidth / screenHeight;

  let displayedWidth;
  let displayedHeight;

  let offsetX = 0;
  let offsetY = 0;

  if (screenRatio > videoRatio) {

    displayedWidth = screenWidth;

    displayedHeight =
      screenWidth / videoRatio;

    offsetY =
      (screenHeight - displayedHeight) / 2;

  } else {

    displayedHeight = screenHeight;

    displayedWidth =
      screenHeight * videoRatio;

    offsetX =
      (screenWidth - displayedWidth) / 2;

  }

  let x =
    point.x * displayedWidth + offsetX;

  let y =
    point.y * displayedHeight + offsetY;

  return { x, y };

}


hands.onResults((results) => {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  if (
    !results.multiHandLandmarks ||
    results.multiHandLandmarks.length === 0
  ) {

    status.textContent = "Show your hand";

    cube.style.display = "none";

    return;

  }


  status.textContent =
    "HAND TRACKING ACTIVE ✓";


  for (
    const landmarks
    of results.multiHandLandmarks
  ) {

    const converted =
      landmarks.map(getCameraCoordinates);


    /*
      DRAW CONNECTIONS
    */

    ctx.strokeStyle = "cyan";
    ctx.lineWidth = 3;

    for (
      const connection
      of HAND_CONNECTIONS
    ) {

      const start =
        converted[connection[0]];

      const end =
        converted[connection[1]];

      ctx.beginPath();

      ctx.moveTo(
        start.x,
        start.y
      );

      ctx.lineTo(
        end.x,
        end.y
      );

      ctx.stroke();

    }


    /*
      DRAW DOTS
    */

    ctx.fillStyle = "cyan";

    for (
      const point
      of converted
    ) {

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        6,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    /*
      PINCH
    */

    const thumb =
      landmarks[4];

    const index =
      landmarks[8];

    const distance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    if (distance < 0.06) {

      status.textContent =
        "PINCH DETECTED 🤏";


      const position =
        getCameraCoordinates(index);


      cube.style.display =
        "block";


      cube.style.left =
        position.x + "px";


      cube.style.top =
        position.y + "px";

    }

    else {

      cube.style.display =
        "none";

    }

  }

});


/*
  CAMERA
*/

const camera =
  new Camera(video, {

    onFrame: async () => {

      await hands.send({
        image: video
      });

    },

    width: 1280,
    height: 720

  });


camera.start();

</script>

</body>
</html>
