<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
  color:#00eaff;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#camera.front{transform:scaleX(-1)}
#camera.back{transform:scaleX(1)}

#threeCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  pointer-events:none;
}

#handCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:10;
  pointer-events:none;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:100;
  min-width:220px;
  padding:14px 17px;
  background:rgba(0,10,20,.78);
  border:1px solid #00eaff;
  border-radius:12px;
  box-shadow:0 0 20px rgba(0,234,255,.25);
  backdrop-filter:blur(8px);
}

#title{
  font-size:19px;
  font-weight:bold;
  letter-spacing:3px;
  margin-bottom:5px;
}

.line{
  margin-top:4px;
  font-size:13px;
}

.online{color:#00ff88}

#cameraButton{
  position:fixed;
  right:15px;
  top:15px;
  z-index:110;
  padding:11px 15px;
  border:1px solid #00eaff;
  border-radius:10px;
  background:rgba(0,10,20,.85);
  color:#00eaff;
  font-weight:bold;
  cursor:pointer;
}

#crosshair{
  position:fixed;
  left:50%;
  top:50%;
  width:18px;
  height:18px;
  margin-left:-9px;
  margin-top:-9px;
  border:1px solid rgba(0,234,255,.5);
  border-radius:50%;
  z-index:20;
  pointer-events:none;
}

#reticle{
  position:fixed;
  width:35px;
  height:35px;
  margin-left:-17.5px;
  margin-top:-17.5px;
  border:2px solid #00eaff;
  border-radius:50%;
  z-index:30;
  display:none;
  pointer-events:none;
  box-shadow:0 0 15px #00eaff;
}

#bottom{
  position:fixed;
  left:50%;
  bottom:20px;
  transform:translateX(-50%);
  z-index:100;
  padding:10px 22px;
  background:rgba(0,10,20,.8);
  border:1px solid #00eaff;
  border-radius:20px;
  font-size:13px;
  letter-spacing:1px;
}

.scanline{
  position:fixed;
  left:0;
  right:0;
  height:1px;
  background:rgba(0,234,255,.12);
  z-index:15;
  pointer-events:none;
  animation:scan 5s linear infinite;
}

@keyframes scan{
  from{top:0}
  to{top:100%}
}

#vignette{
  position:fixed;
  inset:0;
  z-index:18;
  pointer-events:none;
  box-shadow:inset 0 0 180px rgba(0,0,0,.75);
}

@media(max-width:600px){
  #hud{
    min-width:170px;
    padding:10px 12px;
  }

  #title{
    font-size:15px;
  }

  .line{
    font-size:11px;
  }

  #bottom{
    bottom:12px;
    font-size:11px;
    white-space:nowrap;
  }
}
</style>
</head>

<body>

<video id="camera" autoplay muted playsinline></video>

<canvas id="handCanvas"></canvas>

<canvas id="threeCanvas"></canvas>

<div id="hud">

  <div id="title">
    JARVIS AR
  </div>

  <div class="line">
    SYSTEM:
    <span id="system" class="online">
      ONLINE
    </span>
  </div>

  <div class="line">
    TRACKING:
    <span id="tracking">
      INITIALIZING
    </span>
  </div>

  <div class="line">
    HANDS:
    <span id="hands">
      0
    </span>
  </div>

  <div class="line">
    OBJECTS:
    <span id="objects">
      0
    </span>
  </div>

  <div class="line">
    MODE:
    <span id="mode">
      STANDBY
    </span>
  </div>

  <div class="line">
    ACTIVE:
    <span id="active">
      NONE
    </span>
  </div>

</div>

<button id="cameraButton">
  SWITCH CAMERA
</button>

<div id="crosshair"></div>

<div id="reticle"></div>

<div class="scanline"></div>

<div id="vignette"></div>

<div id="bottom">
  PINCH • GRAB • MOVE • ROTATE • RESIZE
</div>

<script>

const video =
  document.getElementById("camera");

const handCanvas =
  document.getElementById("handCanvas");

const handCtx =
  handCanvas.getContext("2d");

const threeCanvas =
  document.getElementById("threeCanvas");

const systemText =
  document.getElementById("system");

const trackingText =
  document.getElementById("tracking");

const handsText =
  document.getElementById("hands");

const objectsText =
  document.getElementById("objects");

const modeText =
  document.getElementById("mode");

const activeText =
  document.getElementById("active");

const cameraButton =
  document.getElementById("cameraButton");

const reticle =
  document.getElementById("reticle");


/* CAMERA */

let usingFrontCamera = true;
let currentStream = null;
let cameraReady = false;
let processing = false;


async function startCamera(){

  cameraReady = false;

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(track => track.stop());

  }

  currentStream = null;

  try{

    systemText.textContent = "STARTING";

    let stream;

    try{

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:{

            facingMode:
              usingFrontCamera
              ? "user"
              : "environment",

            width:{
              ideal:1280
            },

            height:{
              ideal:720
            },

            frameRate:{
              ideal:30,
              max:30
            }

          },

          audio:false

        });

    }

    catch(error){

      stream =
        await navigator.mediaDevices.getUserMedia({

          video:true,
          audio:false

        });

    }

    currentStream = stream;

    video.srcObject = stream;

    video.classList.remove("front","back");

    video.classList.add(
      usingFrontCamera
      ? "front"
      : "back"
    );

    await video.play();

    cameraReady = true;

    systemText.textContent = "ONLINE";

    trackingText.textContent = "ACTIVE";

  }

  catch(error){

    console.error(error);

    systemText.textContent =
      "CAMERA ERROR";

    trackingText.textContent =
      error.message;

  }

}


cameraButton.onclick =
async function(){

  usingFrontCamera =
    !usingFrontCamera;

  await startCamera();

};


/* RESIZE */

function resize(){

  handCanvas.width =
    window.innerWidth;

  handCanvas.height =
    window.innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* SCREEN POSITION */

function screenPosition(point){

  const vw = video.videoWidth;
  const vh = video.videoHeight;

  const sw = window.innerWidth;
  const sh = window.innerHeight;

  if(!vw || !vh){

    return{
      x:sw/2,
      y:sh/2
    };

  }

  const videoRatio = vw/vh;
  const screenRatio = sw/sh;

  let width;
  let height;

  let offsetX = 0;
  let offsetY = 0;

  if(screenRatio > videoRatio){

    width = sw;
    height = sw/videoRatio;

    offsetY =
      (sh-height)/2;

  }

  else{

    height = sh;
    width = sh*videoRatio;

    offsetX =
      (sw-width)/2;

  }

  let x =
    point.x*width+
    offsetX;

  let y =
    point.y*height+
    offsetY;

  if(usingFrontCamera){

    x = sw-x;

  }

  return{
    x,
    y
  };

}


/* MEDIAPIPE */

const hands =
  new Hands({

    locateFile:
    file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


/* THREE */

const renderer =
  new THREE.WebGLRenderer({

    canvas:threeCanvas,

    alpha:true,

    antialias:true

  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(

    55,

    window.innerWidth /
    window.innerHeight,

    .1,
    100

  );


camera.position.z = 8;


/* LIGHTING */

const ambient =
  new THREE.AmbientLight(
    0xffffff,
    1.5
  );

scene.add(ambient);


const pointLight =
  new THREE.PointLight(
    0x00eaff,
    5,
    20
  );

pointLight.position.set(
  0,
  2,
  4
);

scene.add(pointLight);


/* OBJECTS */

const objects = [];

let activeObject = null;


/* SHAPES */

const shapeNames = [

  "CUBE",
  "SPHERE",
  "PYRAMID",
  "TORUS",
  "CYLINDER",
  "STAR"

];

let nextShape = 0;


/* MATERIAL */

function hologramMaterial(){

  return new THREE.MeshStandardMaterial({

    color:
      new THREE.Color(
        `hsl(${Math.random()*360},100%,60%)`
      ),

    emissive:
      new THREE.Color(
        `hsl(${Math.random()*360},100%,45%)`
      ),

    emissiveIntensity:2,

    transparent:true,

    opacity:.75,

    wireframe:true

  });

}


/* CREATE SHAPE */

function createShape(type){

  let geometry;

  if(type==="CUBE"){

    geometry =
      new THREE.BoxGeometry(
        1.4,
        1.4,
        1.4
      );

  }

  else if(type==="SPHERE"){

    geometry =
      new THREE.SphereGeometry(
        .8,
        32,
        32
      );

  }

  else if(type==="PYRAMID"){

    geometry =
      new THREE.ConeGeometry(
        .9,
        1.6,
        4
      );

  }

  else if(type==="TORUS"){

    geometry =
      new THREE.TorusGeometry(
        .65,
        .22,
        16,
        40
      );

  }

  else if(type==="CYLINDER"){

    geometry =
      new THREE.CylinderGeometry(
        .65,
        .65,
        1.5,
        32
      );

  }

  else{

    geometry =
      new THREE.IcosahedronGeometry(
        .9,
        1
      );

  }

  const mesh =
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    );

  mesh.userData.type =
    type;

  mesh.userData.velocity =
    new THREE.Vector3();

  mesh.userData.angularVelocity =
    new THREE.Vector3();

  mesh.userData.mass = 1;

  scene.add(mesh);

  objects.push(mesh);

  objectsText.textContent =
    objects.length;

  return mesh;

}


/* HAND TO WORLD */

function handToWorld(x,y){

  const nx =
    (x/window.innerWidth)*2-1;

  const ny =
    -(y/window.innerHeight)*2+1;

  const vector =
    new THREE.Vector3(
      nx,
      ny,
      0
    );

  vector.unproject(camera);

  const direction =
    vector
      .sub(camera.position)
      .normalize();

  const distance = 6;

  return camera.position
    .clone()
    .add(
      direction.multiplyScalar(
        distance
      )
    );

}


/* DISTANCE */

function distance2D(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* PINCH */

function isPinching(hand){

  return(
    distance2D(
      hand[4],
      hand[8]
    ) < .055
  );

}


/* OPEN PALM */

function isOpenPalm(hand){

  const wrist = hand[0];

  const tips = [

    hand[8],
    hand[12],
    hand[16],
    hand[20]

  ];

  let count = 0;

  for(
    const tip of tips
  ){

    if(
      tip.y < wrist.y
    ){

      count++;

    }

  }

  return count >= 3;

}


/* FIST */

function isFist(hand){

  const wrist = hand[0];

  const tips = [

    hand[8],
    hand[12],
    hand[16],
    hand[20]

  ];

  let count = 0;

  for(
    const tip of tips
  ){

    if(
      distance2D(
        tip,
        wrist
      ) < .25
    ){

      count++;

    }

  }

  return count >= 3;

}


/* GRAB */

let grabbing = false;

let grabHand = -1;

let grabOffset =
  new THREE.Vector3();

let previousFinger = null;

let grabVelocity =
  new THREE.Vector3();


/* TWO HAND */

let twoHand = false;

let twoStartDistance = 1;

let twoStartScale = 1;

let twoStartAngle = 0;

let twoStartRotation = 0;

let twoStartTilt = 0;


/* FIND OBJECT */

function findObject(position){

  let closest = null;

  let closestDistance =
    Infinity;

  for(
    const obj of objects
  ){

    const screen =
      worldToScreen(
        obj.position
      );

    const d =
      distance2D(
        position,
        screen
      );

    if(
      d < closestDistance
    ){

      closestDistance = d;

      closest = obj;

    }

  }

  if(
    closestDistance < 130
  ){

    return closest;

  }

  return null;

}


/* WORLD TO SCREEN */

function worldToScreen(position){

  const vector =
    position
      .clone()
      .project(camera);

  return{

    x:
      (vector.x+1)/2*
      window.innerWidth,

    y:
      (-vector.y+1)/2*
      window.innerHeight

  };

}


/* PARTICLES */

const particleGeometry =
  new THREE.BufferGeometry();

const particleCount = 800;

const positions =
  new Float32Array(
    particleCount*3
  );

for(
  let i=0;
  i<particleCount;
  i++
){

  positions[i*3] =
    (Math.random()-.5)*16;

  positions[i*3+1] =
    (Math.random()-.5)*10;

  positions[i*3+2] =
    (Math.random()-.5)*8;

}

particleGeometry.setAttribute(

  "position",

  new THREE.BufferAttribute(
    positions,
    3
  )

);


const particleMaterial =
  new THREE.PointsMaterial({

    color:0x00eaff,

    size:.035,

    transparent:true,

    opacity:.7

  });


const particles =
  new THREE.Points(
    particleGeometry,
    particleMaterial
  );

scene.add(particles);


/* RINGS */

const rings = [];

for(
  let i=0;
  i<5;
  i++
){

  const geometry =
    new THREE.TorusGeometry(
      1.5+i*.4,
      .008,
      8,
      100
    );

  const material =
    new THREE.MeshBasicMaterial({

      color:0x00eaff,

      transparent:true,

      opacity:.4-i*.05

    });

  const ring =
    new THREE.Mesh(
      geometry,
      material
    );

  ring.rotation.x =
    Math.PI/2;

  ring.position.y =
    -2;

  scene.add(ring);

  rings.push(ring);

}


/* HAND RESULTS */

hands.onResults(
(results)=>{

  if(!cameraReady){
    return;
  }

  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );

  const detected =
    results.multiHandLandmarks || [];

  handsText.textContent =
    detected.length;

  trackingText.textContent =
    detected.length
    ? "ACTIVE"
    : "SEARCHING";


  /* DRAW HANDS */

  for(
    const hand of detected
  ){

    const points =
      hand.map(
        screenPosition
      );

    handCtx.strokeStyle =
      "#00eaff";

    handCtx.lineWidth = 2;

    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a =
        points[
          connection[0]
        ];

      const b =
        points[
          connection[1]
        ];

      handCtx.beginPath();

      handCtx.moveTo(
        a.x,
        a.y
      );

      handCtx.lineTo(
        b.x,
        b.y
      );

      handCtx.stroke();

    }

    handCtx.fillStyle =
      "#00eaff";

    for(
      const p of points
    ){

      handCtx.beginPath();

      handCtx.arc(
        p.x,
        p.y,
        3,
        0,
        Math.PI*2
      );

      handCtx.fill();

    }

  }


  /* PINCHING */

  const pinching = [];

  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      pinching.push(i);

    }

  }


  /* TWO HAND */

  if(
    pinching.length === 2
  ){

    const p1 =
      screenPosition(
        detected[
          pinching[0]
        ][8]
      );

    const p2 =
      screenPosition(
        detected[
          pinching[1]
        ][8]
      );

    const d =
      distance2D(
        p1,
        p2
      );

    const angle =
      Math.atan2(
        p2.y-p1.y,
        p2.x-p1.x
      );

    const centerX =
      (p1.x+p2.x)/2;

    const centerY =
      (p1.y+p2.y)/2;


    if(
      !twoHand &&
      activeObject
    ){

      twoHand = true;

      grabbing = true;

      twoStartDistance =
        Math.max(d,10);

      twoStartScale =
        activeObject.scale.x;

      twoStartAngle =
        angle;

      twoStartRotation =
        activeObject.rotation.z;

      twoStartTilt =
        activeObject.rotation.x;

    }


    if(activeObject){

      let scale =
        twoStartScale *
        d /
        twoStartDistance;

      scale =
        Math.max(
          .35,
          Math.min(
            4,
            scale
          )
        );

      activeObject.scale.setScalar(
        scale
      );


      let change =
        (
          angle-
          twoStartAngle
        ) *
        180/Math.PI;

      activeObject.rotation.z =
        twoStartRotation+
        change;


      const tilt =
        (
          centerY-
          window.innerHeight/2
        )*.008;

      activeObject.rotation.x =
        twoStartTilt+
        tilt;


      activeObject.position.copy(
        handToWorld(
          centerX,
          centerY
        )
      );


      modeText.textContent =
        "TWO HAND MANIPULATION";

      activeText.textContent =
        activeObject.userData.type;

    }

    return;

  }


  twoHand = false;


  /* NORMAL PINCH */

  if(
    pinching.length > 0
  ){

    const index =
      pinching[0];

    const fingertip =
      screenPosition(
        detected[index][8]
      );

    reticle.style.display =
      "block";

    reticle.style.left =
      fingertip.x+"px";

    reticle.style.top =
      fingertip.y+"px";


    /* CONTINUE GRAB */

    if(grabbing){

      if(activeObject){

        const target =
          handToWorld(
            fingertip.x,
            fingertip.y
          );

        target.add(
          grabOffset
        );

        activeObject.position.lerp(
          target,
          .75
        );


        if(previousFinger){

          grabVelocity.set(

            fingertip.x-
            previousFinger.x,

            previousFinger.y-
            fingertip.y,

            0

          );

        }

        previousFinger =
          fingertip;

        modeText.textContent =
          "GRABBING";

        activeText.textContent =
          activeObject.userData.type;

        return;

      }

    }


    /* FIND OBJECT */

    const found =
      findObject(
        fingertip
      );

    if(found){

      activeObject =
        found;

      grabbing = true;

      grabHand = index;

      previousFinger =
        fingertip;

      const target =
        handToWorld(
          fingertip.x,
          fingertip.y
        );

      grabOffset =
        activeObject.position
          .clone()
          .sub(target);

      modeText.textContent =
        "GRABBED";

      activeText.textContent =
        activeObject.userData.type;

      return;

    }


    /* CREATE OBJECT */

    if(!grabbing){

      const type =
        shapeNames[
          nextShape
        ];

      nextShape =
        (nextShape+1) %
        shapeNames.length;

      activeObject =
        createShape(type);

      activeObject.position.copy(
        handToWorld(
          fingertip.x,
          fingertip.y
        )
      );

      activeObject.scale.setScalar(1);

      grabbing = true;

      grabHand = index;

      previousFinger =
        fingertip;

      grabOffset.set(
        0,0,0
      );

      modeText.textContent =
        "CREATED";

      activeText.textContent =
        type;

      return;

    }

  }


  /* RELEASE */

  if(grabbing){

    grabbing = false;

    grabHand = -1;

    if(activeObject){

      activeObject.userData.velocity.x =
        grabVelocity.x*.045;

      activeObject.userData.velocity.y =
        grabVelocity.y*.045;

      activeObject.userData.angularVelocity.z =
        grabVelocity.x*.002;

      modeText.textContent =
        "RELEASED";

    }

    previousFinger = null;

    grabVelocity.set(
      0,0,0
    );

  }


  reticle.style.display =
    "none";


  if(
    detected.length>0 &&
    isOpenPalm(
      detected[0]
    )
  ){

    modeText.textContent =
      "PALM DETECTED";

  }


  if(
    detected.length>0 &&
    isFist(
      detected[0]
    )
  ){

    modeText.textContent =
      "FIST / PHYSICS";

  }

});


/* PHYSICS */

const clock =
  new THREE.Clock();


function physics(){

  const dt =
    Math.min(
      clock.getDelta(),
      .033
    );

  for(
    const obj of objects
  ){

    if(
      obj===activeObject &&
      grabbing
    ){

      continue;

    }

    const velocity =
      obj.userData.velocity;

    /* GRAVITY */

    velocity.y -=
      1.2*dt;

    obj.position.add(
      velocity
        .clone()
        .multiplyScalar(dt)
    );

    /* FRICTION */

    velocity.multiplyScalar(
      .985
    );

    /* ROTATION */

    obj.rotation.x +=
      obj.userData
        .angularVelocity.x;

    obj.rotation.y +=
      obj.userData
        .angularVelocity.y;

    obj.rotation.z +=
      obj.userData
        .angularVelocity.z;

    obj.userData
      .angularVelocity
      .multiplyScalar(.99);


    /* FLOOR */

    if(
      obj.position.y < -2.8
    ){

      obj.position.y = -2.8;

      velocity.y *= -.65;

    }


    /* SIDES */

    if(
      obj.position.x < -6
    ){

      obj.position.x = -6;

      velocity.x *= -.7;

    }


    if(
      obj.position.x > 6
    ){

      obj.position.x = 6;

      velocity.x *= -.7;

    }

  }

}


/* ANIMATION */

function animate(){

  requestAnimationFrame(
    animate
  );

  physics();

  particles.rotation.y += .0008;

  particles.rotation.x += .0002;


  for(
    let i=0;
    i<rings.length;
    i++
  ){

    rings[i].rotation.z +=
      .002+i*.0005;

  }


  for(
    const obj of objects
  ){

    if(
      obj.material &&
      obj.material.emissive
    ){

      obj.material.emissiveIntensity =
        obj===activeObject
        ?
        3+
        Math.sin(
          performance.now()*.005
        )
        :
        1.5;

    }

  }


  renderer.render(
    scene,
    camera
  );

}

animate();


/* MEDIAPIPE LOOP */

async function trackingLoop(){

  if(

    cameraReady &&
    video.readyState>=2 &&
    !processing

  ){

    processing = true;

    try{

      await hands.send({
        image:video
      });

    }

    catch(error){

      console.log(error);

    }

    processing = false;

  }

  requestAnimationFrame(
    trackingLoop
  );

}


/* THREE RESIZE */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect =
      window.innerWidth /
      window.innerHeight;

    camera.updateProjectionMatrix();

    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

    renderer.setPixelRatio(
      Math.min(
        window.devicePixelRatio,
        2
      )
    );

  }
);


/* START */

async function boot(){

  statusSafe();

  usingFrontCamera = true;

  await startCamera();

  trackingLoop();

}


function statusSafe(){

  systemText.textContent =
    "BOOTING";

  trackingText.textContent =
    "LOADING";

}


boot();

</script>
