<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

  <!-- Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.179.1/build/three.min.js"></script>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #output {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,.65);
      padding: 12px;
      border-radius: 10px;
      z-index: 10;
    }

    #threeCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }
  </style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>

<div id="hud">
  <b>JARVIS AR</b>
  <div id="status">Starting...</div>
</div>

<script>

const video = document.getElementById("camera");
const canvas = document.getElementById("output");
const ctx = canvas.getContext("2d");
const status = document.getElementById("status");


/* =========================
   THREE.JS AR SCENE
========================= */

const scene = new THREE.Scene();

const threeCamera = new THREE.PerspectiveCamera(
  70,
  window.innerWidth / window.innerHeight,
  0.01,
  100
);

threeCamera.position.z = 1;

const renderer = new THREE.WebGLRenderer({
  alpha: true,
  antialias: true
});

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);

renderer.setPixelRatio(
  Math.min(window.devicePixelRatio, 2)
);

renderer.domElement.id = "threeCanvas";

document.body.appendChild(
  renderer.domElement
);


/* REAL 3D CUBE */

const geometry =
  new THREE.BoxGeometry(
    0.18,
    0.18,
    0.18
  );

const material =
  new THREE.MeshNormalMaterial();

const cube =
  new THREE.Mesh(
    geometry,
    material
  );

cube.visible = false;

scene.add(cube);


/* LIGHT */

const light =
  new THREE.AmbientLight(
    0xffffff,
    1
  );

scene.add(light);


/* ANIMATION */

function animate() {

  requestAnimationFrame(animate);

  cube.rotation.x += 0.015;
  cube.rotation.y += 0.02;

  renderer.render(
    scene,
    threeCamera
  );
}

animate();


/* =========================
   RESIZE
========================= */

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  threeCamera.aspect =
    window.innerWidth /
    window.innerHeight;

  threeCamera.updateProjectionMatrix();
}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =========================
   CAMERA COORDINATES
========================= */

function getCameraCoordinates(point) {

  const videoWidth =
    video.videoWidth;

  const videoHeight =
    video.videoHeight;

  const screenWidth =
    window.innerWidth;

  const screenHeight =
    window.innerHeight;

  const videoRatio =
    videoWidth / videoHeight;

  const screenRatio =
    screenWidth / screenHeight;

  let displayedWidth;
  let displayedHeight;

  let offsetX = 0;
  let offsetY = 0;


  if (screenRatio > videoRatio) {

    displayedWidth =
      screenWidth;

    displayedHeight =
      screenWidth /
      videoRatio;

    offsetY =
      (screenHeight -
       displayedHeight) / 2;

  } else {

    displayedHeight =
      screenHeight;

    displayedWidth =
      screenHeight *
      videoRatio;

    offsetX =
      (screenWidth -
       displayedWidth) / 2;
  }


  let x =
    point.x *
    displayedWidth +
    offsetX;

  let y =
    point.y *
    displayedHeight +
    offsetY;


  /*
    Camera is mirrored,
    so mirror X coordinate.
  */

  x =
    screenWidth - x;


  return {
    x: x,
    y: y
  };
}


/* =========================
   MEDIAPIPE HAND TRACKING
========================= */

const hands =
  new Hands({

    locateFile: (file) => {

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 1,

  minDetectionConfidence: 0.65,

  minTrackingConfidence: 0.65

});


/* =========================
   HAND RESULTS
========================= */

hands.onResults(
  (results) => {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    if (
      !results.multiHandLandmarks ||
      results.multiHandLandmarks.length === 0
    ) {

      status.textContent =
        "Show your hand";

      cube.visible = false;

      return;
    }


    status.textContent =
      "HAND TRACKING ACTIVE ✓";


    const hand =
      results.multiHandLandmarks[0];


    /*
      DRAW HAND
    */

    const converted =
      hand.map(
        getCameraCoordinates
      );


    ctx.strokeStyle =
      "#00ffff";

    ctx.lineWidth = 3;


    for (
      const connection
      of HAND_CONNECTIONS
    ) {

      const start =
        converted[
          connection[0]
        ];

      const end =
        converted[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        start.x,
        start.y
      );

      ctx.lineTo(
        end.x,
        end.y
      );

      ctx.stroke();
    }


    /*
      DRAW DOTS
    */

    ctx.fillStyle =
      "#00ffff";


    for (
      const point
      of converted
    ) {

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        6,
        0,
        Math.PI * 2
      );

      ctx.fill();
    }


    /* =========================
       PINCH DETECTION
    ========================= */

    const thumb =
      hand[4];

    const index =
      hand[8];


    const distance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    if (distance < 0.06) {

      status.textContent =
        "PINCH — CUBE ACTIVE 🤏";


      /*
        Get fingertip position
      */

      const position =
        getCameraCoordinates(
          index
        );


      /*
        Convert screen position
        to Three.js position
      */

      const x =
        (position.x /
         window.innerWidth) * 2 - 1;


      const y =
        -(position.y /
          window.innerHeight) * 2 + 1;


      /*
        Put cube in front
        of the camera
      */

      cube.position.x =
        x * 0.55;

      cube.position.y =
        y * 0.55;

      cube.position.z =
        0;


      cube.visible = true;

    } else {

      cube.visible = false;

    }

  }
);


/* =========================
   CAMERA
========================= */

const camera =
  new Camera(
    video,
    {

      onFrame: async () => {

        await hands.send({
          image: video
        });

      },

      width: 1280,

      height: 720

    }
  );


camera.start();

</script>

</body>
</html>
