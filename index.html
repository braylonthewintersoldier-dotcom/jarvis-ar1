<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover">

<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<style>

*{
  box-sizing:border-box;
}

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

#camera.front{
  transform:scaleX(-1);
}

#camera.back{
  transform:scaleX(1);
}

#threeCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  pointer-events:none;
}

#handCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:6;
  pointer-events:none;
}

/* =========================================
   JARVIS LISTENING INDICATOR
========================================= */

#jarvisIndicator{

  position:fixed;

  left:50%;
  bottom:28px;

  transform:translateX(-50%);

  width:18px;
  height:18px;

  border-radius:50%;

  background:#20252b;

  box-shadow:
    0 0 0 1px rgba(255,255,255,.15);

  z-index:100;

  transition:.25s;

}

#jarvisIndicator.listening{

  background:#00eaff;

  box-shadow:
    0 0 10px #00eaff,
    0 0 30px rgba(0,234,255,.7);

  animation:
    listeningPulse 1s infinite;

}

#jarvisIndicator.speaking{

  background:#ffffff;

  box-shadow:
    0 0 12px #ffffff,
    0 0 30px rgba(255,255,255,.5);

}

@keyframes listeningPulse{

  0%,100%{
    transform:translateX(-50%) scale(1);
  }

  50%{
    transform:translateX(-50%) scale(1.35);
  }

}

/* =========================================
   VERY SMALL STATUS
========================================= */

#status{

  position:fixed;

  left:50%;
  top:20px;

  transform:translateX(-50%);

  z-index:100;

  color:rgba(255,255,255,.75);

  font-size:12px;

  letter-spacing:2px;

  opacity:0;

  transition:.3s;

  pointer-events:none;

}

#status.visible{
  opacity:1;
}

/* =========================================
   RETICLE
========================================= */

#reticle{

  position:fixed;

  width:36px;
  height:36px;

  margin-left:-18px;
  margin-top:-18px;

  border:1px solid rgba(0,234,255,.9);

  border-radius:50%;

  z-index:30;

  display:none;

  pointer-events:none;

  box-shadow:
    0 0 14px rgba(0,234,255,.8);

}

/* =========================================
   START BUTTON
   Only appears when browser requires
   user interaction for microphone/camera.
========================================= */

#startButton{

  position:fixed;

  left:50%;
  top:50%;

  transform:translate(-50%,-50%);

  z-index:200;

  padding:16px 28px;

  border:1px solid rgba(0,234,255,.7);

  border-radius:8px;

  background:rgba(5,10,15,.9);

  color:#fff;

  font-size:15px;

  letter-spacing:2px;

  cursor:pointer;

}

#startButton.hidden{
  display:none;
}

</style>
</head>

<body>

<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>

<canvas id="handCanvas"></canvas>

<canvas id="threeCanvas"></canvas>

<div id="status">JARVIS</div>

<div id="jarvisIndicator"></div>

<div id="reticle"></div>

<button id="startButton">
  INITIALIZE JARVIS
</button>

<script>

/* =========================================================
   ELEMENTS
========================================================= */

const video =
  document.getElementById("camera");

const handCanvas =
  document.getElementById("handCanvas");

const handCtx =
  handCanvas.getContext("2d");

const threeCanvas =
  document.getElementById("threeCanvas");

const indicator =
  document.getElementById("jarvisIndicator");

const status =
  document.getElementById("status");

const reticle =
  document.getElementById("reticle");

const startButton =
  document.getElementById("startButton");


/* =========================================================
   CAMERA
========================================================= */

let usingFrontCamera = true;

let currentStream = null;

let cameraReady = false;

let processing = false;


async function startCamera(){

  cameraReady=false;

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(track => track.stop());

  }

  try{

    const stream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:
            usingFrontCamera
            ? "user"
            : "environment",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }
        },

        audio:false

      });

    currentStream=stream;

    video.srcObject=stream;

    video.classList.remove(
      "front",
      "back"
    );

    video.classList.add(
      usingFrontCamera
      ? "front"
      : "back"
    );

    await video.play();

    cameraReady=true;

  }

  catch(error){

    console.error(error);

    speak(
      "I could not access the camera."
    );

  }

}


/* =========================================================
   CAMERA SWITCH
========================================================= */

function switchCamera(){

  usingFrontCamera =
    !usingFrontCamera;

  startCamera();

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  handCanvas.width=
    window.innerWidth;

  handCanvas.height=
    window.innerHeight;

  renderer.setSize(
    window.innerWidth,
    window.innerHeight
  );

  camera3D.aspect=
    window.innerWidth/
    window.innerHeight;

  camera3D.updateProjectionMatrix();

}

window.addEventListener(
  "resize",
  resize
);


/* =========================================================
   SCREEN POSITION
========================================================= */

function screenPosition(point){

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const sw=window.innerWidth;
  const sh=window.innerHeight;

  if(!vw || !vh){

    return{
      x:sw/2,
      y:sh/2
    };

  }

  const videoRatio=vw/vh;
  const screenRatio=sw/sh;

  let width;
  let height;

  let offsetX=0;
  let offsetY=0;

  if(screenRatio>videoRatio){

    width=sw;
    height=sw/videoRatio;

    offsetY=(sh-height)/2;

  }

  else{

    height=sh;
    width=sh*videoRatio;

    offsetX=(sw-width)/2;

  }

  let x=
    point.x*width+
    offsetX;

  let y=
    point.y*height+
    offsetY;

  if(usingFrontCamera){

    x=sw-x;

  }

  return{
    x,
    y
  };

}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
  new Hands({

    locateFile:
    file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


/* =========================================================
   THREE.JS
========================================================= */

const renderer =
  new THREE.WebGLRenderer({

    canvas:threeCanvas,

    alpha:true,

    antialias:true

  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene =
  new THREE.Scene();


const camera3D =
  new THREE.PerspectiveCamera(

    55,

    window.innerWidth/
    window.innerHeight,

    .1,

    100

  );


camera3D.position.z=8;


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    2
  )
);

const light =
  new THREE.PointLight(
    0xffffff,
    4,
    30
  );

light.position.set(
  2,
  4,
  6
);

scene.add(light);


/* =========================================================
   MODEL SYSTEM
========================================================= */

const models=[];

let activeObject=null;

let selectedPart=null;


/*
  Every model can contain multiple parts.
  Each part can be grabbed independently.
*/

function createPart(
  geometry,
  name="PART"
){

  const material =
    new THREE.MeshStandardMaterial({

      color:0x00eaff,

      metalness:.65,

      roughness:.3,

      transparent:true,

      opacity:.9

    });

  const mesh =
    new THREE.Mesh(
      geometry,
      material
    );

  mesh.userData.partName=name;

  mesh.userData.velocity=
    new THREE.Vector3();

  mesh.userData.angularVelocity=
    new THREE.Vector3();

  mesh.userData.grabbable=true;

  return mesh;

}


/* =========================================================
   ORIGINAL CUBE
========================================================= */

function createOriginalCube(){

  const cube =
    createPart(
      new THREE.BoxGeometry(
        1.4,
        1.4,
        1.4
      ),
      "CUBE"
    );

  cube.position.set(
    0,
    0,
    0
  );

  cube.userData.modelName=
    "Original Cube";

  scene.add(cube);

  models.push(cube);

  activeObject=cube;

  return cube;

}


/* =========================================================
   PRACTICAL MODEL BUILDER
========================================================= */

function createModel(
  name,
  parts
){

  const group =
    new THREE.Group();

  group.userData.modelName=name;

  group.userData.isAssembly=true;

  parts.forEach(
    part => {

      group.add(part);

    }
  );

  scene.add(group);

  models.push(group);

  activeObject=group;

  return group;

}


/* =========================================================
   ENGINE EXAMPLE
   JARVIS can use this as a local fallback model.
========================================================= */

function createEngine(){

  const parts=[];

  const block =
    createPart(
      new THREE.BoxGeometry(
        2.5,
        1.6,
        1.5
      ),
      "ENGINE BLOCK"
    );

  block.position.set(
    0,
    0,
    0
  );

  parts.push(block);


  const cylinder =
    createPart(
      new THREE.CylinderGeometry(
        .42,
        .42,
        1.5,
        32
      ),
      "CYLINDER"
    );

  cylinder.rotation.z=
    Math.PI/2;

  cylinder.position.set(
    0,
    1.05,
    0
  );

  parts.push(cylinder);


  const head =
    createPart(
      new THREE.BoxGeometry(
        2.3,
        .45,
        1.35
      ),
      "CYLINDER HEAD"
    );

  head.position.set(
    0,
    1.15,
    0
  );

  parts.push(head);


  const flywheel =
    createPart(
      new THREE.CylinderGeometry(
        .7,
        .7,
        .22,
        48
      ),
      "FLYWHEEL"
    );

  flywheel.rotation.x=
    Math.PI/2;

  flywheel.position.set(
    -1.45,
    0,
    0
  );

  parts.push(flywheel);


  const intake =
    createPart(
      new THREE.BoxGeometry(
        .8,
        .35,
        .55
      ),
      "INTAKE"
    );

  intake.position.set(
    .8,
    1.55,
    0
  );

  parts.push(intake);


  return createModel(
    "ENGINE",
    parts
  );

}


/* =========================================================
   DISASSEMBLE
========================================================= */

function disassemble(){

  if(!activeObject)
    return;

  if(!activeObject.userData.isAssembly)
    return;

  const center =
    activeObject.position.clone();

  const children=[
    ...activeObject.children
  ];

  children.forEach(
    (part,index)=>{

      const world=
        new THREE.Vector3();

      part.getWorldPosition(world);

      activeObject.remove(part);

      scene.add(part);

      part.position.copy(world);

      const angle=
        (index/children.length)*
        Math.PI*2;

      const radius=2;

      part.position.x+=
        Math.cos(angle)*radius;

      part.position.y+=
        Math.sin(angle)*radius;

      part.position.z+=
        (index%3)*.7;

    }
  );

  activeObject.userData.isAssembly=false;

  speak(
    "The assembly has been separated. You can inspect each part."
  );

}


/* =========================================================
   REASSEMBLE
========================================================= */

function reassemble(){

  if(!activeObject)
    return;

  /*
    Simple reassembly command.
    Parts return toward the assembly center.
  */

  const nearby=[];

  scene.traverse(
    obj=>{

      if(
        obj.userData &&
        obj.userData.grabbable &&
        obj!==activeObject
      ){

        nearby.push(obj);

      }

    }
  );

  nearby.forEach(
    part=>{

      part.position.lerp(
        new THREE.Vector3(
          0,
          0,
          0
        ),
        .15
      );

    }
  );

  speak(
    "Reassembly sequence initiated."
  );

}


/* =========================================================
   REMOVE PART
========================================================= */

function removeActivePart(){

  if(!selectedPart)
    return;

  scene.remove(
    selectedPart
  );

  selectedPart=null;

  speak(
    "Part removed."
  );

}


/* =========================================================
   HAND MATH
========================================================= */

function distance2D(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function isPinching(hand){

  return distance2D(
    hand[4],
    hand[8]
  ) < .055;

}


function handToWorld(x,y){

  const nx=
    (x/window.innerWidth)*2-1;

  const ny=
    -(y/window.innerHeight)*2+1;

  const vector=
    new THREE.Vector3(
      nx,
      ny,
      0
    );

  vector.unproject(
    camera3D
  );

  const direction=
    vector
      .sub(camera3D.position)
      .normalize();

  return camera3D
    .position
    .clone()
    .add(
      direction.multiplyScalar(6)
    );

}


function worldToScreen(position){

  const vector=
    position
      .clone()
      .project(camera3D);

  return{

    x:
      (vector.x+1)/
      2*
      window.innerWidth,

    y:
      (-vector.y+1)/
      2*
      window.innerHeight

  };

}


/* =========================================================
   OBJECT PICKING
========================================================= */

function findObject(position){

  let closest=null;

  let closestDistance=Infinity;

  scene.traverse(
    obj=>{

      if(
        !obj.userData ||
        !obj.userData.grabbable
      ){

        return;

      }

      const screen=
        worldToScreen(
          obj.getWorldPosition(
            new THREE.Vector3()
          )
        );

      const distance=
        distance2D(
          position,
          screen
        );

      if(
        distance<
        closestDistance
      ){

        closestDistance=
          distance;

        closest=obj;

      }

    }
  );

  if(
    closestDistance<130
  ){

    return closest;

  }

  return null;

}


/* =========================================================
   HAND STATE
========================================================= */

let grabbing=false;

let grabOffset=
  new THREE.Vector3();

let previousFinger=null;

let grabVelocity=
  new THREE.Vector3();

let twoHand=false;

let twoDistance=1;

let twoScale=1;

let twoAngle=0;

let twoRotation=0;


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(
results=>{

  if(!cameraReady)
    return;

  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );

  const detected=
    results.multiHandLandmarks||[];


  const pinching=[];


  detected.forEach(
    (hand,index)=>{

      if(
        isPinching(hand)
      ){

        pinching.push(index);

      }

    }
  );


  /* ==========================================
     TWO HAND MANIPULATION
  ========================================== */

  if(
    pinching.length===2 &&
    activeObject
  ){

    const p1=
      screenPosition(
        detected[
          pinching[0]
        ][8]
      );

    const p2=
      screenPosition(
        detected[
          pinching[1]
        ][8]
      );

    const distance=
      distance2D(p1,p2);

    const angle=
      Math.atan2(
        p2.y-p1.y,
        p2.x-p1.x
      );

    const centerX=
      (p1.x+p2.x)/2;

    const centerY=
      (p1.y+p2.y)/2;


    if(!twoHand){

      twoHand=true;

      twoDistance=
        Math.max(
          distance,
          10
        );

      twoScale=
        activeObject.scale.x;

      twoAngle=angle;

      twoRotation=
        activeObject.rotation.z;

    }


    const scale=
      Math.max(
        .2,
        Math.min(
          5,
          twoScale*
          distance/
          twoDistance
        )
      );


    activeObject.scale.setScalar(
      scale
    );


    activeObject.rotation.z=
      twoRotation+
      angle-
      twoAngle;


    activeObject.position.copy(
      handToWorld(
        centerX,
        centerY
      )
    );


    return;

  }


  twoHand=false;


  /* ==========================================
     SINGLE HAND
  ========================================== */

  if(
    pinching.length>0
  ){

    const hand=
      detected[
        pinching[0]
      ];

    const fingertip=
      screenPosition(
        hand[8]
      );


    reticle.style.display=
      "block";

    reticle.style.left=
      fingertip.x+"px";

    reticle.style.top=
      fingertip.y+"px";


    /* CONTINUE GRAB */

    if(
      grabbing &&
      activeObject
    ){

      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );

      target.add(
        grabOffset
      );

      activeObject.position.lerp(
        target,
        .75
      );


      if(previousFinger){

        grabVelocity.set(

          fingertip.x-
          previousFinger.x,

          previousFinger.y-
          fingertip.y,

          0

        );

      }

      previousFinger=
        fingertip;

      return;

    }


    /* FIND PART */

    const found=
      findObject(
        fingertip
      );


    if(found){

      selectedPart=found;

      activeObject=found;

      grabbing=true;

      previousFinger=
        fingertip;


      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );


      grabOffset=
        found.position
          .clone()
          .sub(target);


      return;

    }

  }


  /* ==========================================
     RELEASE
  ========================================== */

  if(grabbing){

    grabbing=false;

    if(activeObject){

      /*
        NO GRAVITY.
        Momentum is optional.
      */

      activeObject.userData.velocity=
        grabVelocity
          .clone()
          .multiplyScalar(.015);

    }

    previousFinger=null;

    grabVelocity.set(
      0,0,0
    );

  }


  reticle.style.display=
    "none";

});


/* =========================================================
   PHYSICS
   NO GRAVITY
========================================================= */

function physics(){

  const dt=.016;

  scene.traverse(
    obj=>{

      if(
        !obj.userData ||
        !obj.userData.velocity
      ){

        return;

      }

      if(
        obj===activeObject &&
        grabbing
      ){

        return;

      }

      /*
        IMPORTANT:
        No gravity.
      */

      obj.position.add(
        obj.userData.velocity
          .clone()
          .multiplyScalar(dt)
      );


      /*
        Gentle damping.
      */

      obj.userData.velocity.multiplyScalar(
        .96
      );

      obj.rotation.x+=
        obj.userData.angularVelocity
        ?.x||0;

      obj.rotation.y+=
        obj.userData.angularVelocity
        ?.y||0;

      obj.rotation.z+=
        obj.userData.angularVelocity
        ?.z||0;

    }
  );

}


/* =========================================================
   VOICE ASSISTANT
========================================================= */

const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;

let recognition=null;

let listening=false;


if(SpeechRecognition){

  recognition=
    new SpeechRecognition();

  recognition.lang="en-US";

  recognition.continuous=true;

  recognition.interimResults=false;

  recognition.maxAlternatives=1;


  recognition.onstart=()=>{

    listening=true;

    indicator.classList.add(
      "listening"
    );

  };


  recognition.onend=()=>{

    listening=false;

    indicator.classList.remove(
      "listening"
    );

    /*
      Keep listening unless JARVIS
      is speaking.
    */

    if(
      !window.speechSynthesis.speaking
    ){

      setTimeout(
        startListening,
        300
      );

    }

  };


  recognition.onerror=
    event=>{

      console.log(
        "Voice error:",
        event.error
      );

    };


  recognition.onresult=
    event=>{

      const result=
        event.results[
          event.results.length-1
        ];

      if(!result.isFinal)
        return;

      const text=
        result[0]
          .transcript
          .trim();

      console.log(
        "USER:",
        text
      );

      processCommand(
        text
      );

    };

}


/* =========================================================
   START LISTENING
========================================================= */

function startListening(){

  if(
    !recognition ||
    listening
  ){

    return;

  }

  try{

    recognition.start();

  }

  catch(error){

    console.log(error);

  }

}


/* =========================================================
   JARVIS VOICE
========================================================= */

function speak(text){

  console.log(
    "JARVIS:",
    text
  );

  if(
    !window.speechSynthesis
  ){

    return;

  }


  if(recognition){

    try{
      recognition.stop();
    }
    catch(e){}

  }


  indicator.classList.remove(
    "listening"
  );

  indicator.classList.add(
    "speaking"
  );


  const utterance=
    new SpeechSynthesisUtterance(
      text
    );


  utterance.rate=.95;

  utterance.pitch=.75;

  utterance.volume=1;


  /*
    Prefer a natural English voice.
  */

  const voices=
    speechSynthesis.getVoices();


  const preferred=
    voices.find(
      voice =>
        /en/i.test(
          voice.lang
        ) &&
        /male|daniel|alex|google/i.test(
          voice.name
        )
    );


  if(preferred){

    utterance.voice=
      preferred;

  }


  utterance.onend=()=>{

    indicator.classList.remove(
      "speaking"
    );

    startListening();

  };


  speechSynthesis.cancel();

  speechSynthesis.speak(
    utterance
  );

}


/* =========================================================
   JARVIS COMMAND SYSTEM
========================================================= */

async function processCommand(
  command
){

  const text=
    command.toLowerCase().trim();


  /* ==========================================
     LOCAL COMMANDS
  ========================================== */

  if(
    text.includes("create a cube")||
    text==="cube"||
    text.includes("make a cube")
  ){

    createOriginalCube();

    speak(
      "Cube created."
    );

    return;

  }


  if(
    text.includes("create an engine")||
    text.includes("make an engine")||
    text.includes("build an engine")
  ){

    createEngine();

    speak(
      "I created an engine assembly. You can manipulate the individual components."
    );

    return;

  }


  if(
    text.includes("take it apart")||
    text.includes("disassemble")||
    text.includes("separate the parts")
  ){

    disassemble();

    return;

  }


  if(
    text.includes("put it back together")||
    text.includes("reassemble")
  ){

    reassemble();

    return;

  }


  if(
    text.includes("remove this part")||
    text.includes("remove the part")
  ){

    removeActivePart();

    return;

  }


  if(
    text.includes("switch camera")
  ){

    switchCamera();

    speak(
      "Camera switched."
    );

    return;

  }


  if(
    text.includes("clear everything")||
    text.includes("delete everything")
  ){

    clearScene();

    speak(
      "Workspace cleared."
    );

    return;

  }


  /*
    Ask the AI backend.
  */

  await askJarvisAI(
    command
  );

}


/* =========================================================
   AI BACKEND
========================================================= */

/*
  THIS is where the real JARVIS intelligence goes.

  Your server should expose:

       POST /api/jarvis

  Request:

       {
         "command":"build me a turbocharger"
       }

  Example response:

       {
         "reply":"I created a turbocharger assembly.",
         "model":{
           "type":"assembly",
           "name":"Turbocharger",
           "parts":[
             {
               "name":"Housing",
               "shape":"cylinder",
               "position":[0,0,0],
               "scale":[1,1,1]
             }
           ]
         }
       }

  The server can search the web, use an AI model,
  process CAD/model information, and return
  structured model data.
*/

async function askJarvisAI(
  command
){

  showStatus(
    "THINKING"
  );


  try{

    const response=
      await fetch(
        "/api/jarvis",
        {

          method:"POST",

          headers:{
            "Content-Type":
              "application/json"
          },

          body:
            JSON.stringify({
              command
            })

        }
      );


    if(!response.ok){

      throw new Error(
        "JARVIS API unavailable"
      );

    }


    const data=
      await response.json();


    if(data.reply){

      speak(
        data.reply
      );

    }


    if(data.model){

      buildAIModel(
        data.model
      );

    }

  }

  catch(error){

    console.error(error);

    /*
      The browser still works without
      the AI backend.
    */

    speak(
      "I can control the workspace locally, but my external AI connection is not configured yet."
    );

  }

  hideStatus();

}


/* =========================================================
   BUILD MODEL FROM AI DATA
========================================================= */

function buildAIModel(
  model
){

  if(
    !model ||
    !model.parts
  ){

    return;

  }


  const parts=[];


  model.parts.forEach(
    data=>{

      let geometry;


      switch(
        data.shape
      ){

        case "sphere":

          geometry=
            new THREE.SphereGeometry(
              .5,
              32,
              32
            );

          break;


        case "cylinder":

          geometry=
            new THREE.CylinderGeometry(
              .5,
              .5,
              1,
              32
            );

          break;


        case "cone":

          geometry=
            new THREE.ConeGeometry(
              .5,
              1,
              32
            );

          break;


        case "torus":

          geometry=
            new THREE.TorusGeometry(
              .5,
              .15,
              16,
              40
            );

          break;


        default:

          geometry=
            new THREE.BoxGeometry(
              1,
              1,
              1
            );

      }


      const part=
        createPart(
          geometry,
          data.name||
          "PART"
        );


      if(data.position){

        part.position.set(
          data.position[0]||0,
          data.position[1]||0,
          data.position[2]||0
        );

      }


      if(data.rotation){

        part.rotation.set(
          data.rotation[0]||0,
          data.rotation[1]||0,
          data.rotation[2]||0
        );

      }


      if(data.scale){

        part.scale.set(
          data.scale[0]||1,
          data.scale[1]||1,
          data.scale[2]||1
        );

      }


      parts.push(part);

    }
  );


  createModel(
    model.name||
    "JARVIS MODEL",
    parts
  );

}


/* =========================================================
   REAL GLB/GLTF MODEL LOADER
========================================================= */

/*
  JARVIS can also return:

  {
    "modelUrl":
    "https://example.com/model.glb"
  }

  Then call:

       loadRealModel(modelUrl)

  A production backend should proxy/validate
  external model URLs to avoid CORS problems.
*/

async function loadRealModel(
  url
){

  try{

    const loader=
      new THREE.GLTFLoader();

    /*
      GLTFLoader is normally imported
      as a Three.js addon.

      This function is intentionally
      left available for the backend.
    */

    const gltf=
      await loader.loadAsync(
        url
      );

    scene.add(
      gltf.scene
    );

    activeObject=
      gltf.scene;

    speak(
      "Model loaded."
    );

  }

  catch(error){

    console.error(error);

    speak(
      "I could not load that model."
    );

  }

}


/* =========================================================
   CLEAR
========================================================= */

function clearScene(){

  while(
    scene.children.length>2
  ){

    const object=
      scene.children[
        scene.children.length-1
      ];

    scene.remove(
      object
    );

  }

  models.length=0;

  activeObject=null;

  selectedPart=null;

}


/* =========================================================
   STATUS
========================================================= */

function showStatus(
  text
){

  status.textContent=
    text;

  status.classList.add(
    "visible"
  );

}


function hideStatus(){

  status.classList.remove(
    "visible"
  );

}


/* =========================================================
   ANIMATION
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );

  physics();

  renderer.render(
    scene,
    camera3D
  );

}

animate();


/* =========================================================
   TRACKING LOOP
========================================================= */

async function trackingLoop(){

  if(
    cameraReady &&
    video.readyState>=2 &&
    !processing
  ){

    processing=true;

    try{

      await hands.send({
        image:video
      });

    }

    catch(error){

      console.log(error);

    }

    processing=false;

  }

  requestAnimationFrame(
    trackingLoop
  );

}


/* =========================================================
   STARTUP
========================================================= */

async function boot(){

  await startCamera();

  trackingLoop();

}


/* =========================================================
   INITIALIZE BUTTON
========================================================= */

startButton.onclick=
async()=>{

  startButton.classList.add(
    "hidden"
  );

  await boot();

  /*
    Browser requires a user interaction
    before microphone access/speech may work.
  */

  startListening();

  speak(
    "JARVIS online."
  );

};


/* =========================================================
   AUTOMATIC START
========================================================= */

boot();
