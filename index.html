<!DOCTYPE html>
<html>
<head>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

html,body{

<body>

<video
  id="camera"
  autoplay
  playsinline>
</video>

<canvas id="output"></canvas>

<div id="hud">

<b>JARVIS AR</b>

<div id="status">
Starting camera...
</div>

<div id="hands">
Hands: 0
</div>

<div id="mode">
Mode: STANDBY
</div>

<div id="cameraMode">
Camera: BACK
</div>

</div>

<button id="cameraButton">
SWITCH TO FRONT
</button>

<div id="grabRing"></div>

<div id="centerDot"></div>

<div id="cube-container">

<div id="cube">

<div class="face front"></div>
<div class="face back"></div>
<div class="face right"></div>
<div class="face left"></div>
<div class="face top"></div>
<div class="face bottom"></div>

</div>

</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("output");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const handsText =
document.getElementById("hands");

const modeText =
document.getElementById("mode");

const cameraModeText =
document.getElementById("cameraMode");

const cameraButton =
document.getElementById("cameraButton");

const cubeContainer =
document.getElementById("cube-container");

const cube =
document.getElementById("cube");

const centerDot =
document.getElementById("centerDot");

const grabRing =
document.getElementById("grabRing");


/* =====================================================
   CAMERA STATE
===================================================== */

let savedCamera =
localStorage.getItem("jarvisCamera");


/*
  BACK is the default.
*/

let usingFrontCamera =
savedCamera === "front";


let currentStream =
null;


let cameraController =
null;


let switchingCamera =
false;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

  canvas.width =
  window.innerWidth;

  canvas.height =
  window.innerHeight;

}

resizeCanvas();


window.addEventListener(
"resize",
resizeCanvas
);


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(point){

  const vw =
  video.videoWidth;

  const vh =
  video.videoHeight;

  const sw =
  window.innerWidth;

  const sh =
  window.innerHeight;


  if(!vw || !vh){

    return{
      x:sw/2,
      y:sh/2
    };

  }


  const videoRatio =
  vw/vh;

  const screenRatio =
  sw/sh;


  let width;
  let height;

  let offsetX=0;
  let offsetY=0;


  if(
    screenRatio >
    videoRatio
  ){

    width=sw;

    height=
    sw/videoRatio;

    offsetY=
    (sh-height)/2;

  }

  else{

    height=sh;

    width=
    sh*videoRatio;

    offsetX=
    (sw-width)/2;

  }


  let x =
  point.x*width+
  offsetX;


  let y =
  point.y*height+
  offsetY;


  /*
    Mirror ONLY the front camera.
  */

  if(usingFrontCamera){

    x =
    sw-x;

  }


  return{
    x:x,
    y:y
  };

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
new Hands({

  locateFile:(file)=>{

    return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

  }

});


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


/* =====================================================
   CUBE STATE
===================================================== */

let cubeExists=false;

let cubeX =
window.innerWidth/2;

let cubeY =
window.innerHeight/2;

let rotX=-20;

let rotY=30;

let rotZ=0;

let cubeScale=1;


/* =====================================================
   GRAB STATE
===================================================== */

let grabbed=false;

let grabX=0;
let grabY=0;

let grabOffsetX=0;
let grabOffsetY=0;


/* =====================================================
   TWO HAND STATE
===================================================== */

let twoHandMode=false;

let twoStartDistance=0;

let twoStartScale=1;

let twoStartAngle=0;

let twoStartRotZ=0;

let twoStartAverageY=0;

let twoStartRotX=0;


/* =====================================================
   PINCH
===================================================== */

function pinchDistance(hand){

  const thumb =
  hand[4];

  const index =
  hand[8];


  return Math.hypot(
    thumb.x-index.x,
    thumb.y-index.y
  );

}


function isPinching(hand){

  return pinchDistance(hand)<.055;

}


/* =====================================================
   UPDATE CUBE
===================================================== */

function updateCube(){

  cubeContainer.style.left =
  cubeX+"px";

  cubeContainer.style.top =
  cubeY+"px";


  cube.style.transform =
  `
  scale(${cubeScale})
  rotateX(${rotX}deg)
  rotateY(${rotY}deg)
  rotateZ(${rotZ}deg)
  `;


  cubeContainer.style.display =
  "block";


  centerDot.style.display =
  "block";


  centerDot.style.left =
  cubeX+"px";

  centerDot.style.top =
  cubeY+"px";

}


/* =====================================================
   RING
===================================================== */

function showRing(x,y){

  grabRing.style.display =
  "block";

  grabRing.style.left =
  x+"px";

  grabRing.style.top =
  y+"px";

}


function hideRing(){

  grabRing.style.display =
  "none";

}


/* =====================================================
   PINCHING HANDS
===================================================== */

function getPinchingHands(
detected
){

  const list=[];


  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      list.push(i);

    }

  }


  return list;

}


/* =====================================================
   CLOSEST HAND
===================================================== */

function closestPinchingHand(
detected,
pinching
){

  let best=-1;

  let bestDistance=
  Infinity;


  for(
    const index
    of pinching
  ){

    const fingertip =
    screenPosition(
      detected[index][8]
    );


    const d =
    Math.hypot(

      fingertip.x-cubeX,

      fingertip.y-cubeY

    );


    if(
      d<bestDistance
    ){

      bestDistance=d;

      best=index;

    }

  }


  return{
    index:best,
    distance:bestDistance
  };

}


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults(
(results)=>{

  if(switchingCamera){
    return;
  }


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detected =
  results.multiHandLandmarks || [];


  handsText.textContent =
  "Hands: "+
  detected.length;


  /* ===============================================
     DRAW HANDS
  =============================================== */

  for(
    const hand of detected
  ){

    const points =
    hand.map(
      screenPosition
    );


    ctx.strokeStyle =
    "#00eaff";

    ctx.lineWidth=2.5;


    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a =
      points[
        connection[0]
      ];

      const b =
      points[
        connection[1]
      ];


      ctx.beginPath();

      ctx.moveTo(
        a.x,
        a.y
      );

      ctx.lineTo(
        b.x,
        b.y
      );

      ctx.stroke();

    }


    ctx.fillStyle =
    "#00eaff";


    for(
      const point
      of points
    ){

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        4,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  const pinching =
  getPinchingHands(
    detected
  );


  /* ===============================================
     TWO HAND
  =============================================== */

  if(
    cubeExists &&
    pinching.length===2
  ){

    const p1 =
    screenPosition(
      detected[
        pinching[0]
      ][8]
    );


    const p2 =
    screenPosition(
      detected[
        pinching[1]
      ][8]
    );


    const dx =
    p2.x-p1.x;

    const dy =
    p2.y-p1.y;


    const distance =
    Math.hypot(
      dx,
      dy
    );


    const angle =
    Math.atan2(
      dy,
      dx
    );


    const centerX =
    (p1.x+p2.x)/2;

    const centerY =
    (p1.y+p2.y)/2;


    if(!twoHandMode){

      twoHandMode=true;

      grabbed=true;


      twoStartDistance =
      Math.max(
        distance,
        10
      );


      twoStartScale =
      cubeScale;


      twoStartAngle =
      angle;


      twoStartRotZ =
      rotZ;


      twoStartAverageY =
      centerY;


      twoStartRotX =
      rotX;

    }


    /* SCALE */

    let targetScale =
    twoStartScale*
    (
      distance/
      twoStartDistance
    );


    targetScale =
    Math.max(
      .4,
      Math.min(
        3.5,
        targetScale
      )
    );


    cubeScale +=
    (
      targetScale-
      cubeScale
    )*.25;


    /* ROTATION */

    let angleChange =
    (
      angle-
      twoStartAngle
    )*
    180/Math.PI;


    while(
      angleChange>180
    ){

      angleChange-=360;

    }


    while(
      angleChange<-180
    ){

      angleChange+=360;

    }


    rotZ +=
    (
      twoStartRotZ+
      angleChange-
      rotZ
    )*.25;


    /* FORWARD / BACKWARD TILT */

    const vertical =
    centerY-
    twoStartAverageY;


    let targetRotX =
    twoStartRotX+
    vertical*.8;


    targetRotX =
    Math.max(
      -80,
      Math.min(
        80,
        targetRotX
      )
    );


    rotX +=
    (
      targetRotX-
      rotX
    )*.25;


    /* MOVE */

    cubeX =
    centerX;

    cubeY =
    centerY;


    modeText.textContent =
    "Mode: TWO HAND";

    status.textContent =
    "MOVE • TWIST • TILT • RESIZE";


    updateCube();

    return;

  }


  twoHandMode=false;


  /* ===============================================
     CURRENT GRAB
  =============================================== */

  if(grabbed){

    let bestHand=-1;

    let bestDistance=
    Infinity;


    for(
      let i=0;
      i<detected.length;
      i++
    ){

      if(
        !isPinching(
          detected[i]
        )
      ){

        continue;

      }


      const fingertip =
      screenPosition(
        detected[i][8]
      );


      const d =
      Math.hypot(

        fingertip.x-grabX,

        fingertip.y-grabY

      );


      if(
        d<bestDistance
      ){

        bestDistance=d;

        bestHand=i;

      }

    }


    if(
      bestHand>=0 &&
      bestDistance<180
    ){

      const fingertip =
      screenPosition(
        detected[bestHand][8]
      );


      cubeX =
      fingertip.x+
      grabOffsetX;


      cubeY =
      fingertip.y+
      grabOffsetY;


      grabX =
      fingertip.x;

      grabY =
      fingertip.y;


      showRing(
        fingertip.x,
        fingertip.y
      );


      modeText.textContent =
      "Mode: GRABBED";

      status.textContent =
      "CUBE IN HAND 🤏";


      updateCube();

      return;

    }


    /* RELEASE */

    grabbed=false;

    hideRing();


    modeText.textContent =
    "Mode: PLACED";

    status.textContent =
    "CUBE RELEASED";


    return;

  }


  /* ===============================================
     GRAB EXISTING CUBE
  =============================================== */

  if(
    cubeExists &&
    pinching.length>0
  ){

    const result =
    closestPinchingHand(
      detected,
      pinching
    );


    if(
      result.index>=0 &&
      result.distance<
      110*cubeScale
    ){

      const fingertip =
      screenPosition(
        detected[
          result.index
        ][8]
      );


      grabbed=true;


      grabX =
      fingertip.x;

      grabY =
      fingertip.y;


      grabOffsetX =
      cubeX-
      fingertip.x;


      grabOffsetY =
      cubeY-
      fingertip.y;


      showRing(
        fingertip.x,
        fingertip.y
      );


      modeText.textContent =
      "Mode: GRABBED";

      status.textContent =
      "CUBE GRABBED 🤏";


      updateCube();

      return;

    }

  }


  /* ===============================================
     CREATE CUBE
  =============================================== */

  if(
    !cubeExists &&
    pinching.length>0
  ){

    const index =
    pinching[0];


    const fingertip =
    screenPosition(
      detected[index][8]
    );


    cubeX =
    fingertip.x;

    cubeY =
    fingertip.y;


    cubeScale=1;

    rotX=-20;

    rotY=30;

    rotZ=0;


    cubeExists=true;

    grabbed=true;


    grabX =
    fingertip.x;

    grabY =
    fingertip.y;


    grabOffsetX=0;

    grabOffsetY=0;


    showRing(
      fingertip.x,
      fingertip.y
    );


    modeText.textContent =
    "Mode: GRABBED";

    status.textContent =
    "CUBE CREATED 🤏";


    updateCube();

    return;

  }


  /* ===============================================
     RESTING
  =============================================== */

  if(cubeExists){

    updateCube();

    modeText.textContent =
    "Mode: PLACED";

    status.textContent =
    "PINCH THE CUBE TO GRAB";

  }

  else{

    status.textContent =
    detected.length
    ?
    "PINCH TO CREATE CUBE"
    :
    "SHOW YOUR HANDS";

  }

});


/* =====================================================
   GET CAMERA DEVICES
===================================================== */

async function getCameraDevices(){

  try{

    const devices =
    await navigator.mediaDevices
    .enumerateDevices();


    return devices.filter(
      device =>
      device.kind ===
      "videoinput"
    );

  }

  catch(error){

    console.error(
      "Could not enumerate cameras:",
      error
    );

    return [];

  }

}


/* =====================================================
   FIND BEST CAMERA
===================================================== */

function findCamera(
devices,
front
){

  if(!devices.length){

    return null;

  }


  const keywords =
  front
  ?
  [
    "front",
    "facetime",
    "user"
  ]
  :
  [
    "back",
    "rear",
    "environment",
    "wide",
    "ultra"
  ];


  for(
    const keyword
    of keywords
  ){

    const found =
    devices.find(
      device =>
      device.label
      .toLowerCase()
      .includes(keyword)
    );


    if(found){

      return found;

    }

  }


  /*
    If no label is available,
    let facingMode handle it.
  */

  return null;

}


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera(){

  if(switchingCamera){

    return;

  }


  switchingCamera=true;


  try{

    status.textContent =
    "Requesting camera...";


    /* STOP OLD STREAM */

    if(currentStream){

      currentStream
      .getTracks()
      .forEach(
        track =>
        track.stop()
      );

      currentStream=null;

    }


    /* STOP MEDIAPIPE CAMERA */

    if(cameraController){

      try{

        cameraController.stop();

      }

      catch(e){}

      cameraController=null;

    }


    /*
      First request permission.

      This is important on iOS because
      camera labels may be hidden until
      permission has been granted.
    */

    let devices =
    await getCameraDevices();


    let selectedCamera =
    findCamera(
      devices,
      usingFrontCamera
    );


    let constraints;


    /*
      If we know the exact camera,
      use its deviceId.
    */

    if(selectedCamera){

      constraints={

        video:{

          deviceId:{
            exact:
            selectedCamera.deviceId
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }

        },

        audio:false

      };

    }

    else{

      /*
        Fallback for iOS browsers that
        don't expose useful camera labels.
      */

      constraints={

        video:{

          facingMode:{
            ideal:
            usingFrontCamera
            ?
            "user"
            :
            "environment"
          },

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }

        },

        audio:false

      };

    }


    const stream =
    await navigator.mediaDevices
    .getUserMedia(
      constraints
    );


    currentStream =
    stream;


    video.srcObject =
    stream;


    /*
      Camera orientation.

      BACK = never mirror.
      FRONT = mirror.
    */

    video.classList.remove(
      "front-camera",
      "back-camera"
    );


    if(usingFrontCamera){

      video.classList.add(
        "front-camera"
      );

    }

    else{

      video.classList.add(
        "back-camera"
      );

    }


    await video.play();


    /*
      Check the actual camera
      selected by the browser.
    */

    const track =
    stream.getVideoTracks()[0];


    const settings =
    track.getSettings();


    console.log(
      "Camera settings:",
      settings
    );


    cameraModeText.textContent =
    usingFrontCamera
    ?
    "Camera: FRONT"
    :
    "Camera: BACK";


    cameraButton.textContent =
    usingFrontCamera
    ?
    "SWITCH TO BACK"
    :
    "SWITCH TO FRONT";


    status.textContent =
    "Starting hand tracking...";


    /*
      Start MediaPipe.
    */

    cameraController =
    new Camera(
      video,
      {

        onFrame:
        async()=>{

          if(
            !switchingCamera
          ){

            await hands.send({
              image:video
            });

          }

        },

        width:1280,

        height:720

      }
    );


    cameraController.start();


    /*
      Give the camera a moment
      before allowing tracking.
    */

    await new Promise(
      resolve =>
      setTimeout(
        resolve,
        400
      )
    );


  }

  catch(error){

    console.error(
      "Camera error:",
      error
    );


    status.textContent =
    "Camera error: "+
    error.message;

  }


  switchingCamera=false;

}


/* =====================================================
   SWITCH CAMERA
===================================================== */

cameraButton.addEventListener(
"click",
async()=>{

  if(switchingCamera){

    return;

  }


  /*
    Change state FIRST.
  */

  usingFrontCamera =
  !usingFrontCamera;


  /*
    Save choice immediately.
  */

  localStorage.setItem(
    "jarvisCamera",

    usingFrontCamera
    ?
    "front"
    :
    "back"
  );


  await startCamera();

});


/* =====================================================
   START
===================================================== */

startCamera();

</script>

</body>
</html>
