<script>

/* =========================================================
   CORE ELEMENTS
========================================================= */

const video =
  document.getElementById("camera");

const handCanvas =
  document.getElementById("handCanvas");

const handCtx =
  handCanvas.getContext("2d");

const threeCanvas =
  document.getElementById("threeCanvas");

const reticle =
  document.getElementById("reticle");

const indicator =
  document.getElementById("jarvisIndicator");

const messageBox =
  document.getElementById("jarvisMessage");

const startButton =
  document.getElementById("startButton");


/* =========================================================
   CAMERA
========================================================= */

let usingFrontCamera = true;
let currentStream = null;
let cameraReady = false;

async function startCamera(){

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(track => track.stop());

  }

  try{

    currentStream =
      await navigator.mediaDevices.getUserMedia({

        video:{
          facingMode:
            usingFrontCamera
            ? "user"
            : "environment",

          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30}

        },

        audio:false

      });

    video.srcObject =
      currentStream;

    video.classList.remove(
      "front",
      "back"
    );

    video.classList.add(
      usingFrontCamera
      ? "front"
      : "back"
    );

    await video.play();

    cameraReady=true;

  }

  catch(error){

    console.error(error);

    jarvisSpeak(
      "I cannot access the camera."
    );

  }

}


/* =========================================================
   THREE.JS
========================================================= */

const renderer =
  new THREE.WebGLRenderer({

    canvas:threeCanvas,
    alpha:true,
    antialias:true

  });

renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);

renderer.setSize(
  innerWidth,
  innerHeight
);


const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(

    55,

    innerWidth / innerHeight,

    .1,
    100

  );

camera.position.z=8;


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.7
  )
);

const light =
  new THREE.PointLight(
    0x00eaff,
    4,
    25
  );

light.position.set(
  0,
  2,
  5
);

scene.add(light);


/* =========================================================
   MODEL SYSTEM
========================================================= */

const objects=[];

let activeObject=null;


/*
  IMPORTANT:
  No gravity is applied anywhere.
*/

function createMaterial(){

  return new THREE.MeshStandardMaterial({

    color:0x00dff5,

    emissive:0x003d45,

    emissiveIntensity:1.5,

    metalness:.65,

    roughness:.25,

    transparent:true,

    opacity:.9

  });

}


/* =========================================================
   MODEL CREATION
========================================================= */

function createCube(){

  const geometry =
    new THREE.BoxGeometry(
      1.4,
      1.4,
      1.4
    );

  const cube =
    new THREE.Mesh(
      geometry,
      createMaterial()
    );

  cube.userData.name="Cube";

  cube.userData.type="part";

  cube.position.set(
    0,
    0,
    0
  );

  scene.add(cube);

  objects.push(cube);

  activeObject=cube;

  return cube;

}


function createSphere(){

  const geometry =
    new THREE.SphereGeometry(
      .8,
      32,
      32
    );

  const sphere =
    new THREE.Mesh(
      geometry,
      createMaterial()
    );

  sphere.userData.name="Sphere";

  sphere.userData.type="part";

  scene.add(sphere);

  objects.push(sphere);

  activeObject=sphere;

  return sphere;

}


function createCylinder(){

  const geometry =
    new THREE.CylinderGeometry(
      .65,
      .65,
      1.5,
      32
    );

  const cylinder =
    new THREE.Mesh(
      geometry,
      createMaterial()
    );

  cylinder.userData.name="Cylinder";

  cylinder.userData.type="part";

  scene.add(cylinder);

  objects.push(cylinder);

  activeObject=cylinder;

  return cylinder;

}


function createPyramid(){

  const geometry =
    new THREE.ConeGeometry(
      .9,
      1.6,
      4
    );

  const pyramid =
    new THREE.Mesh(
      geometry,
      createMaterial()
    );

  pyramid.userData.name="Pyramid";

  pyramid.userData.type="part";

  scene.add(pyramid);

  objects.push(pyramid);

  activeObject=pyramid;

  return pyramid;

}


/* =========================================================
   SIMPLE MODEL BUILDER

  );

  );

    0
  );

  const leftLeg =
    createCube();

  leftLeg.scale.set(
    .4,
    1.2,
    .4
  );

  leftLeg.position.set(
    -.5,

    0
  );

    "Left Leg";


  const rightLeg =

  rightLeg.scale.set(
    .4,

  );

function buildCar(){

  clearModels();

  const body =
    createCube();

  body.scale.set(
    2.5,
    .5,
    1.1
  );

  body.userData.name=
    "Car Body";


  const cabin =
    createCube();

  cabin.scale.set(
    1.25,
    .55,
    .9
  );

  cabin.position.y=.75;

  cabin.userData.name=
    "Cabin";


  const wheelPositions=[
    [-1.5,-.55,.95],
    [1.5,-.55,.95],
    [-1.5,-.55,-.95],
    [1.5,-.55,-.95]
  ];


  wheelPositions.forEach(
    (p,i)=>{

      const wheel =
        new THREE.Mesh(

          new THREE.CylinderGeometry(
            .45,
            .45,
            .28,
            32
          ),

          createMaterial()

        );

      wheel.rotation.z=
        Math.PI/2;

      wheel.position.set(
        p[0],
        p[1],
        p[2]
      );

      wheel.userData.name=
        "Wheel "+(i+1);

      wheel.userData.type=
        "part";

      scene.add(wheel);

      objects.push(wheel);

    }
  );


  activeObject=body;

  jarvisSpeak(

  );

}


/* =========================================================
   CLEAR
========================================================= */

function clearModels(){

  objects.forEach(
    obj=>{
      scene.remove(obj);

      if(obj.geometry)
        obj.geometry.dispose();

      if(obj.material)
        obj.material.dispose();
    }
  );

  objects.length=0;

  activeObject=null;

}


/* =========================================================
   ORIGINAL CUBE COMMAND
========================================================= */

function makeCube(){

  const cube =
    createCube();

  cube.position.set(
    0,
    0,
    0
  );

  jarvisSpeak(
    "Cube created."
  );

}


/* =========================================================
   SCREEN POSITION
========================================================= */

function screenPosition(point){

  const vw=video.videoWidth;
  const vh=video.videoHeight;

  const sw=innerWidth;
  const sh=innerHeight;

  if(!vw || !vh){

    return{
      x:sw/2,
      y:sh/2
    };

  }

  const vr=vw/vh;
  const sr=sw/sh;

  let width;
  let height;
  let ox=0;
  let oy=0;

  if(sr>vr){

    width=sw;
    height=sw/vr;
    oy=(sh-height)/2;

  }else{

    height=sh;
    width=sh*vr;
    ox=(sw-width)/2;

  }

  let x=
    point.x*width+ox;

  let y=
    point.y*height+oy;

  if(usingFrontCamera)
    x=sw-x;

  return{x,y};

}


/* =========================================================
   HAND TRACKING
========================================================= */

const hands =
  new Hands({

    locateFile:file =>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });

hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


function distance2D(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


function isPinching(hand){

  return distance2D(
    hand[4],
    hand[8]
  ) < .055;

}


function handToWorld(x,y){

  const nx=
    x/innerWidth*2-1;

  const ny=
    -(y/innerHeight*2-1);


  const vector=
    new THREE.Vector3(
      nx,
      ny,
      0
    );

  vector.unproject(camera);

  const direction=
    vector
      .sub(camera.position)
      .normalize();


  return camera.position
    .clone()
    .add(
      direction.multiplyScalar(6)
    );

}


function worldToScreen(position){

  const vector=
    position
      .clone()
      .project(camera);

  return{

    x:
      (vector.x+1)/2*
      innerWidth,

    y:
      (-vector.y+1)/2*
      innerHeight

  };

}


/* =========================================================
   OBJECT SELECTION
========================================================= */

function findObject(position){

  let closest=null;

  let best=Infinity;


  objects.forEach(obj=>{

    const screen=
      worldToScreen(
        obj.position
      );

    const d=
      distance2D(
        position,
        screen
      );

    if(d<best){

      best=d;
      closest=obj;

    }

  });


  return best<140
    ? closest
    : null;

}


/* =========================================================
   GRAB STATE
========================================================= */

let grabbing=false;

let grabOffset=
  new THREE.Vector3();

let previousFinger=null;

let grabVelocity=
  new THREE.Vector3();


/* =========================================================
   TWO HAND STATE
========================================================= */

let twoHand=false;

let startDistance=1;

let startScale=1;

let startAngle=0;

let startRotation=0;


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(results=>{

  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );


  const detected=
    results.multiHandLandmarks || [];


  /* DRAW HANDS */

  detected.forEach(hand=>{

    const points=
      hand.map(screenPosition);


    handCtx.strokeStyle=
      "rgba(0,234,255,.8)";

    handCtx.lineWidth=2;


    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a=
        points[connection[0]];

      const b=
        points[connection[1]];


      handCtx.beginPath();

      handCtx.moveTo(
        a.x,
        a.y
      );

      handCtx.lineTo(
        b.x,
        b.y
      );

      handCtx.stroke();

    }


    handCtx.fillStyle=
      "#00eaff";


    points.forEach(p=>{

      handCtx.beginPath();

      handCtx.arc(
        p.x,
        p.y,
        3,
        0,
        Math.PI*2
      );

      handCtx.fill();

    });

  });


  const pinching=[];


  detected.forEach(
    (hand,i)=>{

      if(isPinching(hand))
        pinching.push(i);

    }
  );


  /* =======================================================
     TWO HAND MANIPULATION
  ======================================================= */

  if(
    pinching.length===2 &&
    activeObject
  ){

    const p1=
      screenPosition(
        detected[pinching[0]][8]
      );

    const p2=
      screenPosition(
        detected[pinching[1]][8]
      );


    const d=
      distance2D(p1,p2);

    const angle=
      Math.atan2(
        p2.y-p1.y,
        p2.x-p1.x
      );


    const centerX=
      (p1.x+p2.x)/2;

    const centerY=
      (p1.y+p2.y)/2;


    if(!twoHand){

      twoHand=true;

      startDistance=
        Math.max(d,10);

      startScale=
        activeObject.scale.x;

      startAngle=angle;

      startRotation=
        activeObject.rotation.z;

    }


    let scale=
      startScale*
      d/
      startDistance;


    scale=
      Math.max(
        .15,
        Math.min(8,scale)
      );


    activeObject.scale.setScalar(
      scale
    );


    activeObject.rotation.z=
      startRotation+
      (angle-startAngle);


    activeObject.position.lerp(
      handToWorld(
        centerX,
        centerY
      ),
      .7
    );


    return;

  }


  twoHand=false;


  /* =======================================================
     SINGLE PINCH
  ======================================================= */

  if(pinching.length){

    const hand=
      detected[
        pinching[0]
      ];

    const fingertip=
      screenPosition(
        hand[8]
      );


    reticle.style.display=
      "block";

    reticle.style.left=
      fingertip.x+"px";

    reticle.style.top=
      fingertip.y+"px";


    /* CONTINUE GRAB */

    if(
      grabbing &&
      activeObject
    ){

      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );


      target.add(
        grabOffset
      );


      activeObject.position.lerp(
        target,
        .75
      );


      if(previousFinger){

        grabVelocity.set(

          fingertip.x-
          previousFinger.x,

          previousFinger.y-
          fingertip.y,

          0

        );

      }


      previousFinger=
        fingertip;


      return;

    }


    /* FIND PART */

    const found=
      findObject(
        fingertip
      );


    if(found){

      activeObject=
        found;

      grabbing=true;

      previousFinger=
        fingertip;


      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );


      grabOffset=
        activeObject.position
          .clone()
          .sub(target);


      jarvisSpeak(
        "Selected "+activeObject.userData.name
      );


      return;

    }

  }


  /* RELEASE */

  if(grabbing){

    grabbing=false;

    previousFinger=null;

    /*
      NO GRAVITY.
      Released parts simply stay where
      you placed them.
    */

    if(activeObject){

      activeObject.position.x +=
        grabVelocity.x*.003;

      activeObject.position.y +=
        grabVelocity.y*.003;

    }

    grabVelocity.set(0,0,0);

  }


  reticle.style.display="none";

});


/* =========================================================
   RESIZE
========================================================= */

function resize(){

  handCanvas.width=
    innerWidth;

  handCanvas.height=
    innerHeight;


  camera.aspect=
    innerWidth/innerHeight;

  camera.updateProjectionMatrix();


  renderer.setSize(
    innerWidth,
    innerHeight
  );

}

window.addEventListener(
  "resize",
  resize
);

resize();


/* =========================================================
   VOICE ASSISTANT
========================================================= */

let recognition=null;

let listening=false;


/*
  Browser speech recognition.
*/

const SpeechRecognition =
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


if(SpeechRecognition){

  recognition=
    new SpeechRecognition();

  recognition.continuous=true;

  recognition.interimResults=false;

  recognition.lang="en-US";


  recognition.onstart=()=>{

    listening=true;

    indicator.classList.add(
      "listening"
    );

  };


  recognition.onend=()=>{

    listening=false;

    indicator.classList.remove(
      "listening"
    );


    /*
      Keep listening while JARVIS
      is running.
    */

    if(window.jarvisRunning){

      setTimeout(
        ()=>{
          try{
            recognition.start();
          }catch(e){}
        },
        300
      );

    }

  };


  recognition.onerror=
    error=>{

      console.log(
        "Voice error:",
        error
      );

    };


  recognition.onresult=
    event=>{

      const result=
        event.results[
          event.results.length-1
        ][0].transcript
        .trim();


      console.log(
        "User:",
        result
      );


      processCommand(result);

    };

}


/* =========================================================
   JARVIS SPEECH
========================================================= */

function jarvisSpeak(text){

  messageBox.textContent=
    "JARVIS: "+text;

  messageBox.classList.add(
    "show"
  );


  if(
    "speechSynthesis"
    in window
  ){

    speechSynthesis.cancel();


    const utterance=
      new SpeechSynthesisUtterance(
        text
      );


    utterance.rate=.95;

    utterance.pitch=.85;

    utterance.volume=1;


    utterance.onstart=()=>{

      indicator.classList.add(
        "speaking"
      );

    };


    utterance.onend=()=>{

      indicator.classList.remove(
        "speaking"
      );

    };


    speechSynthesis.speak(
      utterance
    );

  }


  clearTimeout(
    window.jarvisMessageTimer
  );


  window.jarvisMessageTimer=
    setTimeout(
      ()=>{
        messageBox.classList.remove(
          "show"
        );
      },
      6000
    );

}


/* =========================================================
   COMMAND ENGINE
========================================================= */

function processCommand(command){

  const text=
    command.toLowerCase();


  /* CUBE */

  if(
    text.includes("make a cube") ||
    text.includes("create a cube") ||
    text.includes("build a cube")
  ){

    makeCube();

    return;

  }


  /* SPHERE */

  if(
    text.includes("make a sphere") ||
    text.includes("create a sphere")
  ){

    createSphere();

    jarvisSpeak(
      "Sphere created."
    );

    return;

  }


  /* CYLINDER */

  if(
    text.includes("make a cylinder") ||
    text.includes("create a cylinder")
  ){

    createCylinder();

    jarvisSpeak(
      "Cylinder created."
    );

    return;

  }


  /* PYRAMID */

  if(
    text.includes("make a pyramid") ||
    text.includes("create a pyramid")
  ){

    createPyramid();

    jarvisSpeak(
      "Pyramid created."
    );

    return;

  }


  /* ROBOT */

  if(
    text.includes("make a robot") ||
    text.includes("build a robot") ||
    text.includes("create a robot")
  ){

    buildRobot();

    return;

  }


  /* CAR */

  if(
    text.includes("make a car") ||
    text.includes("build a car") ||
    text.includes("create a car")
  ){

    buildCar();

    return;

  }


  /* DELETE */

  if(
    text.includes("delete everything") ||
    text.includes("clear everything") ||
    text.includes("remove everything")
  ){

    clearModels();

    jarvisSpeak(
      "All models removed."
    );

    return;

  }


  /* DELETE ACTIVE */

  if(
    text.includes("delete this") ||
    text.includes("remove this") ||
    text.includes("delete selected")
  ){

    if(activeObject){

      const index=
        objects.indexOf(
          activeObject
        );

      if(index>=0)
        objects.splice(index,1);


      scene.remove(
        activeObject
      );


      activeObject=null;

      jarvisSpeak(
        "Selected component removed."
      );

    }else{

      jarvisSpeak(
        "Nothing is selected."
      );

    }

    return;

  }


  /* RESET */

  if(
    text.includes("reset model") ||
    text.includes("reset")
  ){

    if(activeObject){

      activeObject.position.set(
        0,0,0
      );

      activeObject.rotation.set(
        0,0,0
      );

      activeObject.scale.setScalar(
        1
      );

      jarvisSpeak(
        "Selected component reset."
      );

    }

    return;

  }


  /* INSPECT */

  if(
    text.includes("inspect") ||
    text.includes("what is this")
  ){

    if(activeObject){

      jarvisSpeak(
        "Selected component is "+
        activeObject.userData.name+
        ". You can pinch it and move it independently."
      );

    }else{

      jarvisSpeak(
        "Select a component with a pinch."
      );

    }

    return;

  }


  /* HELP */

  if(
    text.includes("what can you do") ||
    text.includes("help")
  ){

    jarvisSpeak(
      "I can create models, select individual parts, move them, scale them, rotate them, remove them, and help you inspect a design."
    );

    return;

  }


  /*
    WEB MODEL REQUEST
  */

  if(
    text.includes("find a model") ||
    text.includes("find this model") ||
    text.includes("look up")
  ){

    const query=
      command
        .replace(/find a model/ig,"")
        .replace(/find this model/ig,"")
        .replace(/look up/ig,"")
        .trim();


    jarvisSpeak(
      "I can search the web for information about "+
      query+
      ", but importing an actual downloadable 3D model requires a compatible model source."
    );


    webModelSearch(query);

    return;

  }


  /* GENERAL RESPONSE */

  jarvisSpeak(
    "I heard you say: "+command+
    ". Try asking me to build a cube, robot, car, sphere, or cylinder."
  );

}


/* =========================================================
   WEB MODEL SEARCH
========================================================= */

async function webModelSearch(query){

  if(!query)
    return;


  /*
    Opens a web search in another tab.
    This does not pretend that a random
    webpage is a valid 3D model file.
  */

  const url=
    "https://www.google.com/search?q="+
    encodeURIComponent(
      query+
      " 3D model GLB GLTF"
    );


  window.open(
    url,
    "_blank"
  );

}


/* =========================================================
   VOICE START
========================================================= */

function startVoice(){

  if(!recognition){

    jarvisSpeak(
      "Voice recognition is not supported by this browser. Try Chrome."
    );

    return;

  }


  try{

    recognition.start();

  }catch(e){}

}


/* =========================================================
   MAIN LOOP
========================================================= */

let processing=false;

async function trackingLoop(){

  if(
    cameraReady &&
    video.readyState>=2 &&
    !processing
  ){

    processing=true;

    try{

      await hands.send({
        image:video
      });

    }catch(error){

      console.log(error);

    }

    processing=false;

  }


  requestAnimationFrame(
    trackingLoop
  );

}


/* =========================================================
   RENDER LOOP
========================================================= */

function animate(){

  requestAnimationFrame(
    animate
  );


  /*
    NO GRAVITY.
    Objects remain exactly where
    you leave them.
  */


  objects.forEach(obj=>{

    if(
      obj.material &&
      obj.material.emissive
    ){

      obj.material.emissiveIntensity=
        obj===activeObject
        ?
        2.5
        :
        1.0;

    }

  });


  renderer.render(
    scene,
    camera
  );

}


/* =========================================================
   INITIALIZE
========================================================= */

window.jarvisRunning=false;


startButton.onclick=
async ()=>{

  startButton.classList.add(
    "hidden"
  );

  window.jarvisRunning=true;


  await startCamera();


  startVoice();


  trackingLoop();

  animate();


  jarvisSpeak(
    "JARVIS online. I am listening."
  );

};


/* =========================================================
   OPTIONAL KEYBOARD VOICE CONTROL
========================================================= */

window.addEventListener(
  "keydown",
  event=>{

    /*
      Hold SPACE to manually
      activate voice recognition.
    */

    if(
      event.code==="Space" &&
      !listening &&
      window.jarvisRunning
    ){

      startVoice();

    }

  }
);
