<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

  <!-- MediaPipe -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    /* =========================
       CAMERA
    ========================= */

    #camera {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      object-fit: cover;

      transform: scaleX(-1);

      z-index: 1;
    }


    /* =========================
       HAND DRAWING
    ========================= */

    #output {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      pointer-events: none;

      z-index: 2;
    }


    /* =========================
       JARVIS HUD
    ========================= */

    #hud {
      position: fixed;

      top: 15px;
      left: 15px;

      color: white;

      background: rgba(0,0,0,0.72);

      padding: 12px 15px;

      border-radius: 10px;

      z-index: 30;

      font-size: 16px;

      line-height: 1.5;
    }


    /* =========================
       CUBE CONTAINER
       The container has NO size.
       Its exact center is the
       fingertip position.
    ========================= */

    #cube-container {

      position: fixed;

      left: 0;
      top: 0;

      width: 0;
      height: 0;

      display: none;

      z-index: 10;

      pointer-events: none;

      perspective: 700px;

      transform-style: preserve-3d;
    }


    /* =========================
       3D CUBE
    ========================= */

    #cube {

      position: absolute;

      left: -45px;
      top: -45px;

      width: 90px;
      height: 90px;

      transform-style: preserve-3d;

      animation:
        rotateCube 2.5s linear infinite;
    }


    .face {

      position: absolute;

      width: 90px;
      height: 90px;

      box-sizing: border-box;

      border: 3px solid cyan;

      background:
        rgba(0,220,255,0.20);

      box-shadow:
        inset 0 0 18px cyan,
        0 0 15px cyan;
    }


    .front {
      transform:
        translateZ(45px);
    }


    .back {
      transform:
        rotateY(180deg)
        translateZ(45px);
    }


    .right {
      transform:
        rotateY(90deg)
        translateZ(45px);
    }


    .left {
      transform:
        rotateY(-90deg)
        translateZ(45px);
    }


    .top {
      transform:
        rotateX(90deg)
        translateZ(45px);
    }


    .bottom {
      transform:
        rotateX(-90deg)
        translateZ(45px);
    }


    @keyframes rotateCube {

      0% {
        transform:
          rotateX(0deg)
          rotateY(0deg);
      }

      100% {
        transform:
          rotateX(360deg)
          rotateY(360deg);
      }

    }

  </style>
</head>


<body>


<!-- CAMERA -->

<video
  id="camera"
  autoplay
  playsinline>
</video>


<!-- HAND LANDMARKS -->

<canvas id="output"></canvas>


<!-- HUD -->

<div id="hud">

  <b>JARVIS AR</b>

  <div id="status">
    Starting camera...
  </div>

  <div id="hands">
    Hands: 0
  </div>

</div>


<!-- 3D CUBE -->

<div id="cube-container">

  <div id="cube">

    <div class="face front"></div>

    <div class="face back"></div>

    <div class="face right"></div>

    <div class="face left"></div>

    <div class="face top"></div>

    <div class="face bottom"></div>

  </div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsDisplay =
  document.getElementById("hands");

const cubeContainer =
  document.getElementById("cube-container");


/* =====================================================
   CANVAS SIZE
===================================================== */

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}


resizeCanvas();


window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   CAMERA COORDINATES
===================================================== */

function screenPosition(point) {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if (!vw || !vh) {

    return {
      x: sw / 2,
      y: sh / 2
    };

  }


  const videoRatio =
    vw / vh;

  const screenRatio =
    sw / sh;


  let displayWidth;
  let displayHeight;

  let offsetX = 0;
  let offsetY = 0;


  /*
    This matches:
    object-fit: cover
  */

  if (screenRatio > videoRatio) {

    displayWidth =
      sw;

    displayHeight =
      sw / videoRatio;

    offsetY =
      (sh - displayHeight) / 2;

  }

  else {

    displayHeight =
      sh;

    displayWidth =
      sh * videoRatio;

    offsetX =
      (sw - displayWidth) / 2;

  }


  let x =
    point.x *
    displayWidth +
    offsetX;


  let y =
    point.y *
    displayHeight +
    offsetY;


  /*
    The camera image is mirrored.
    Mirror the landmark horizontally
    to match it.
  */

  x =
    sw - x;


  return {
    x: x,
    y: y
  };

}


/* =====================================================
   MEDIAPIPE HANDS
===================================================== */

const hands =
  new Hands({

    locateFile: (file) => {

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  /*
    Detect BOTH hands.
  */

  maxNumHands: 2,


  /*
    0 is faster and better
    for a Chromebook.
  */

  modelComplexity: 0,


  /*
    Lower threshold makes
    second-hand detection easier.
  */

  minDetectionConfidence: 0.50,

  minTrackingConfidence: 0.50

});


/* =====================================================
   CUBE SMOOTHING
===================================================== */

let cubeX =
  window.innerWidth / 2;

let cubeY =
  window.innerHeight / 2;


/*
  Higher = follows faster.
*/

const smoothing = 0.65;


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults((results) => {


  /* CLEAR OLD DRAWING */

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  /*
    Get every detected hand.
  */

  const detectedHands =
    results.multiHandLandmarks || [];


  /*
    Show number of hands.
  */

  handsDisplay.textContent =
    "Hands: " +
    detectedHands.length;


  /* =================================================
     NO HANDS
  ================================================= */

  if (
    detectedHands.length === 0
  ) {

    status.textContent =
      "Show your hands";

    cubeContainer.style.display =
      "none";

    return;

  }


  /* =================================================
     TRACKING
  ================================================= */

  status.textContent =
    "HAND TRACKING ACTIVE ✓";


  /*
    This will contain whichever
    hand is currently pinching.
  */

  let pinchingHand =
    null;


  /* =================================================
     PROCESS EVERY HAND
  ================================================= */

  for (
    let handIndex = 0;
    handIndex < detectedHands.length;
    handIndex++
  ) {


    const hand =
      detectedHands[handIndex];


    /*
      Convert every landmark
      to screen coordinates.
    */

    const points =
      hand.map(
        screenPosition
      );


    /* ===============================================
       DRAW CONNECTIONS
    =============================================== */

    ctx.strokeStyle =
      "cyan";

    ctx.lineWidth = 3;


    for (
      const connection
      of HAND_CONNECTIONS
    ) {

      const start =
        points[
          connection[0]
        ];


      const end =
        points[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        start.x,
        start.y
      );

      ctx.lineTo(
        end.x,
        end.y
      );

      ctx.stroke();

    }


    /* ===============================================
       DRAW FINGER DOTS
    =============================================== */

    ctx.fillStyle =
      "cyan";


    for (
      const point
      of points
    ) {

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        5,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    /* ===============================================
       PINCH DETECTION
    =============================================== */

    const thumb =
      hand[4];


    const index =
      hand[8];


    /*
      Distance between thumb
      and index fingertip.
    */

    const distance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    /*
      If this hand is pinching,
      make it the cube controller.
    */

    if (
      distance < 0.065
    ) {

      pinchingHand =
        hand;

    }

  }


  /* =================================================
     CUBE CONTROL
  ================================================= */

  if (pinchingHand) {


    status.textContent =
      "PINCH — CUBE GRABBED 🤏";


    /*
      Index fingertip.
    */

    const index =
      pinchingHand[8];


    /*
      Convert fingertip
      to exact screen position.
    */

    const target =
      screenPosition(
        index
      );


    /*
      Smooth movement.
    */

    cubeX +=
      (target.x - cubeX) *
      smoothing;


    cubeY +=
      (target.y - cubeY) *
      smoothing;


    /*
      Put the ZERO-SIZE container
      directly at the fingertip.
    */

    cubeContainer.style.left =
      cubeX + "px";


    cubeContainer.style.top =
      cubeY + "px";


    cubeContainer.style.display =
      "block";


  }

  else {

    cubeContainer.style.display =
      "none";

  }

});


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {


    status.textContent =
      "Requesting camera...";


    /*
      Start camera.
    */

    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: "user",

          /*
            720p is enough for
            hand tracking and
            easier on Chromebook.
          */

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    /*
      MediaPipe camera loop.
    */

    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },


          width: 1280,

          height: 720

        }
      );


    camera.start();


  }

  catch (error) {


    console.error(error);


    status.textContent =
      "Camera error: " +
      error.message;

  }

}


/* =====================================================
   START EVERYTHING
===================================================== */

startCamera();

</script>

</body>
</html>
