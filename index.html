<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 1;
    }

    #output {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,0.72);
      padding: 12px 15px;
      border-radius: 10px;
      z-index: 30;
      font-size: 16px;
      line-height: 1.5;
    }

    #cube-container {
      position: fixed;
      left: 0;
      top: 0;
      width: 0;
      height: 0;
      display: none;
      z-index: 10;
      pointer-events: none;
      perspective: 700px;
      transform-style: preserve-3d;
    }

    #cube {
      position: absolute;
      left: -45px;
      top: -45px;
      width: 90px;
      height: 90px;
      transform-style: preserve-3d;
      animation: rotateCube 2.5s linear infinite;
    }

    .face {
      position: absolute;
      width: 90px;
      height: 90px;
      box-sizing: border-box;
      border: 3px solid cyan;
      background: rgba(0,220,255,0.20);
      box-shadow:
        inset 0 0 18px cyan,
        0 0 15px cyan;
    }

    .front {
      transform: translateZ(45px);
    }

    .back {
      transform: rotateY(180deg) translateZ(45px);
    }

    .right {
      transform: rotateY(90deg) translateZ(45px);
    }

    .left {
      transform: rotateY(-90deg) translateZ(45px);
    }

    .top {
      transform: rotateX(90deg) translateZ(45px);
    }

    .bottom {
      transform: rotateX(-90deg) translateZ(45px);
    }

    @keyframes rotateCube {
      from {
        transform: rotateX(0deg) rotateY(0deg);
      }

      to {
        transform: rotateX(360deg) rotateY(360deg);
      }
    }
  </style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>

<div id="hud">
  <b>JARVIS AR</b>

  <div id="status">
    Starting camera...
  </div>

  <div id="hands">
    Hands: 0
  </div>
</div>

<div id="cube-container">

  <div id="cube">

    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>

  </div>

</div>

<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsDisplay =
  document.getElementById("hands");

const cubeContainer =
  document.getElementById("cube-container");


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================================
   CAMERA POSITION
===================================================== */

function screenPosition(point) {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if (!vw || !vh) {

    return {
      x: sw / 2,
      y: sh / 2
    };

  }


  const videoRatio =
    vw / vh;

  const screenRatio =
    sw / sh;


  let displayWidth;
  let displayHeight;

  let offsetX = 0;
  let offsetY = 0;


  if (
    screenRatio >
    videoRatio
  ) {

    displayWidth =
      sw;

    displayHeight =
      sw / videoRatio;

    offsetY =
      (sh - displayHeight) / 2;

  } else {

    displayHeight =
      sh;

    displayWidth =
      sh * videoRatio;

    offsetX =
      (sw - displayWidth) / 2;

  }


  let x =
    point.x *
    displayWidth +
    offsetX;

  let y =
    point.y *
    displayHeight +
    offsetY;


  /*
    Mirror coordinates to match
    the mirrored camera.
  */

  x =
    sw - x;


  return {
    x: x,
    y: y
  };

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
  new Hands({

    locateFile: (file) => {

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 0,

  minDetectionConfidence: 0.50,

  minTrackingConfidence: 0.50

});


/* =====================================================
   CUBE STATE
===================================================== */

let cubeX =
  window.innerWidth / 2;

let cubeY =
  window.innerHeight / 2;


/*
  Has the cube been placed
  on the screen yet?
*/

let cubePlaced =
  false;


/*
  Is the cube currently grabbed?
*/

let grabbed =
  false;


/*
  Which hand grabbed it?
*/

let grabbingHandIndex =
  -1;


/*
  Used to prevent accidental
  repeated grabbing.
*/

let wasPinching =
  false;


/*
  Size of the cube in pixels.
*/

const cubeSize =
  90;


/*
  Distance from cube center
  required to grab it.

  This is roughly the cube's
  radius plus some tolerance.
*/

const grabDistance =
  70;


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults((results) => {

  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detectedHands =
    results.multiHandLandmarks || [];


  handsDisplay.textContent =
    "Hands: " +
    detectedHands.length;


  /*
    Find pinching hands.
  */

  let pinchingHands = [];


  /* =================================================
     DRAW BOTH HANDS
  ================================================= */

  for (
    let i = 0;
    i < detectedHands.length;
    i++
  ) {

    const hand =
      detectedHands[i];


    const points =
      hand.map(screenPosition);


    /* =========================
       LINES
    ========================= */

    ctx.strokeStyle =
      "cyan";

    ctx.lineWidth =
      3;


    for (
      const connection
      of HAND_CONNECTIONS
    ) {

      const start =
        points[
          connection[0]
        ];

      const end =
        points[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        start.x,
        start.y
      );

      ctx.lineTo(
        end.x,
        end.y
      );

      ctx.stroke();

    }


    /* =========================
       DOTS
    ========================= */

    ctx.fillStyle =
      "cyan";


    for (
      const point
      of points
    ) {

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        5,
        0,
        Math.PI * 2
      );

      ctx.fill();

    }


    /* =========================
       PINCH
    ========================= */

    const thumb =
      hand[4];

    const index =
      hand[8];


    const distance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    if (
      distance < 0.065
    ) {

      pinchingHands.push(i);

    }

  }


  /* =================================================
     FIND HAND THAT SHOULD CONTROL CUBE
  ================================================= */

  if (
    !grabbed &&
    cubePlaced &&
    pinchingHands.length > 0
  ) {

    /*
      Look for a pinching hand
      whose fingertip is actually
      close to the cube.
    */

    for (
      const handIndex
      of pinchingHands
    ) {

      const hand =
        detectedHands[
          handIndex
        ];


      const fingertip =
        screenPosition(
          hand[8]
        );


      const distanceToCube =
        Math.hypot(
          fingertip.x - cubeX,
          fingertip.y - cubeY
        );


      if (
        distanceToCube <=
        grabDistance
      ) {

        grabbed =
          true;

        grabbingHandIndex =
          handIndex;

        wasPinching =
          true;

        status.textContent =
          "CUBE GRABBED 🤏";

        break;

      }

    }

  }


  /* =================================================
     FIRST EVER GRAB
  ================================================= */

  if (
    !cubePlaced &&
    pinchingHands.length > 0
  ) {

    /*
      On the very first pinch,
      create the cube at the pinch.
    */

    const hand =
      detectedHands[
        pinchingHands[0]
      ];


    const fingertip =
      screenPosition(
        hand[8]
      );


    cubeX =
      fingertip.x;

    cubeY =
      fingertip.y;


    cubePlaced =
      true;

    grabbed =
      true;

    grabbingHandIndex =
      pinchingHands[0];

    wasPinching =
      true;


    cubeContainer.style.left =
      cubeX + "px";

    cubeContainer.style.top =
      cubeY + "px";

    cubeContainer.style.display =
      "block";


    status.textContent =
      "CUBE GRABBED 🤏";

  }


  /* =================================================
     MOVE GRABBED CUBE
  ================================================= */

  if (
    grabbed
  ) {

    /*
      Make sure the controlling hand
      still exists.
    */

    if (
      grabbingHandIndex >=
      detectedHands.length
    ) {

      grabbed =
        false;

      grabbingHandIndex =
        -1;

      wasPinching =
        false;

      cubeContainer.style.display =
        "block";

      status.textContent =
        "CUBE DROPPED ✓";

      return;

    }


    const hand =
      detectedHands[
        grabbingHandIndex
      ];


    const thumb =
      hand[4];

    const index =
      hand[8];


    const pinchDistance =
      Math.hypot(
        thumb.x - index.x,
        thumb.y - index.y
      );


    /* =========================
       STILL PINCHING
    ========================= */

    if (
      pinchDistance < 0.075
    ) {

      wasPinching =
        true;


      const fingertip =
        screenPosition(
          index
        );


      /*
        Cube follows fingertip
        directly.
      */

      cubeX =
        fingertip.x;

      cubeY =
        fingertip.y;


      cubeContainer.style.left =
        cubeX + "px";

      cubeContainer.style.top =
        cubeY + "px";

      cubeContainer.style.display =
        "block";


      status.textContent =
        "CUBE GRABBED 🤏";

    }


    /* =========================
       RELEASE
    ========================= */

    else if (
      wasPinching
    ) {

      grabbed =
        false;

      grabbingHandIndex =
        -1;

      wasPinching =
        false;


      /*
        IMPORTANT:
        Keep cube visible.
      */

      cubeContainer.style.left =
        cubeX + "px";

      cubeContainer.style.top =
        cubeY + "px";

      cubeContainer.style.display =
        "block";


      status.textContent =
        "CUBE DROPPED ✓";

    }

  }


  /* =================================================
     CUBE DISPLAY
  ================================================= */

  if (
    cubePlaced
  ) {

    cubeContainer.style.display =
      "block";

  }


  /* =================================================
     NORMAL STATUS
  ================================================= */

  if (
    !grabbed &&
    detectedHands.length > 0
  ) {

    status.textContent =
      cubePlaced
        ? "PINCH THE CUBE TO GRAB IT"
        : "PINCH TO CREATE CUBE";

  }

});


/* =====================================================
   START CAMERA
===================================================== */

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera...";


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          },

          frameRate: {
            ideal: 30,
            max: 30
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },

          width: 1280,

          height: 720

        }
      );


    camera.start();


  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Camera error: " +
      error.message;

  }

}


/* =====================================================
   START
===================================================== */

startCamera();

</script>

</body>
</html>
