<script>

/* =========================================================
   JARVIS AR ENGINEERING SYSTEM
========================================================= */


/* =========================================================
   ELEMENTS
========================================================= */

const video =
    document.getElementById(
        "camera"
    );

const handCanvas =
    document.getElementById(
        "handCanvas"
    );

const handCtx =
    handCanvas.getContext(
        "2d"
    );

const threeCanvas =
    document.getElementById(
        "threeCanvas"
    );

const jarvisCore =
    document.getElementById(
        "jarvisCore"
    );

const partLabel =
    document.getElementById(
        "partLabel"
    );

const reticle =
    document.getElementById(
        "reticle"
    );


/* =========================================================
   CAMERA STATE
========================================================= */

let usingFrontCamera = true;

let currentStream = null;

let cameraReady = false;

let processing = false;


/* =========================================================
   START CAMERA
========================================================= */

async function startCamera(){

    cameraReady=false;


    if(currentStream){

        currentStream
            .getTracks()
            .forEach(
                track =>
                    track.stop()
            );

    }


    try{

        currentStream =
            await navigator
                .mediaDevices
                .getUserMedia({

                    video:{

                        facingMode:
                            usingFrontCamera
                            ?
                            "user"
                            :
                            "environment",

                        width:{
                            ideal:1280
                        },

                        height:{
                            ideal:720
                        },

                        frameRate:{
                            ideal:30
                        }

                    },

                    audio:false

                });


        video.srcObject =
            currentStream;


        video.classList.remove(
            "front",
            "back"
        );


        video.classList.add(

            usingFrontCamera
            ?
            "front"
            :
            "back"

        );


        await video.play();


        cameraReady=true;


    }

    catch(error){

        console.error(error);

        jarvisSpeak(
            "Camera access is unavailable."
        );

    }

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    handCanvas.width =
        window.innerWidth;

    handCanvas.height =
        window.innerHeight;


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    camera.aspect =
        window.innerWidth /
        window.innerHeight;


    camera.updateProjectionMatrix();

}


window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   SCREEN POSITION
========================================================= */

function screenPosition(point){

    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;

    const sw =
        window.innerWidth;

    const sh =
        window.innerHeight;


    if(!vw || !vh){

        return{

            x:sw/2,

            y:sh/2

        };

    }


    const videoRatio =
        vw/vh;

    const screenRatio =
        sw/sh;


    let width;
    let height;

    let offsetX=0;
    let offsetY=0;


    if(
        screenRatio >
        videoRatio
    ){

        width=sw;

        height=
            sw/videoRatio;

        offsetY=
            (sh-height)/2;

    }

    else{

        height=sh;

        width=
            sh*videoRatio;

        offsetX=
            (sw-width)/2;

    }


    let x =
        point.x*width+
        offsetX;

    let y =
        point.y*height+
        offsetY;


    if(usingFrontCamera){

        x =
            sw-x;

    }


    return{

        x,
        y

    };

}


/* =========================================================
   MEDIAPIPE
========================================================= */

const hands =
    new Hands({

        locateFile:
            file =>
                `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

    });


hands.setOptions({

    maxNumHands:2,

    modelComplexity:1,

    minDetectionConfidence:.65,

    minTrackingConfidence:.65

});


/* =========================================================
   THREE.JS
========================================================= */

const renderer =
    new THREE.WebGLRenderer({

        canvas:threeCanvas,

        alpha:true,

        antialias:true

    });


renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,

    )
);


renderer.setSize(
    window.innerWidth,
    window.innerHeight
);


const scene =
    new THREE.Scene();


const camera =
    new THREE.PerspectiveCamera(

        55,

        window.innerWidth /
        window.innerHeight,

        .1,

        100

    );


camera.position.z=8;


/* =========================================================
   LIGHTING
========================================================= */

scene.add(
    new THREE.AmbientLight(
        0xffffff,
        1.8
    )
);


const mainLight =

    );


mainLight.position.set(
    0,

);


scene.add(

/* =========================================================
   SECOND LIGHT
========================================================= */

const blueLight =
    new THREE.PointLight(

    );


blueLight.position.set(
    -4,
    1,

);


scene.add(
    blueLight

/* =========================================================
   MODEL STORAGE
========================================================= */

const objects=[];

let activeObject=null;


/* =========================================================
   PART COLORS
========================================================= */

function normalMaterial(){

    return new THREE.MeshStandardMaterial({

        color:0x9aa5aa,

        metalness:.72,

        roughness:.3

    });

}


function activeMaterial(){

    return new THREE.MeshStandardMaterial({

        color:0x00dfff,

        emissive:0x005566,

        emissiveIntensity:.7,

        metalness:.65,

        roughness:.25

    });

}


/* =========================================================
   CREATE PART
========================================================= */

function createPart(
    name,
    geometry,
    position,
    rotation={x:0,y:0,z:0}
){

    const mesh =
        new THREE.Mesh(

            geometry,

            normalMaterial()

        );


    mesh.position.copy(
        position
    );


    mesh.rotation.set(

        rotation.x,
        rotation.y,
        rotation.z

    );


    mesh.userData = {

        name:name,

        type:"mechanical component",

        attached:true,

        originalPosition:
            position.clone(),

        originalRotation:
            new THREE.Euler(
                rotation.x,
                rotation.y,
                rotation.z
            ),

        velocity:
            new THREE.Vector3(),

        angularVelocity:
            new THREE.Vector3(),

        detached:false,

        description:"Mechanical component"

    };


    scene.add(mesh);

    objects.push(mesh);


    return mesh;

}


/* =========================================================
   SELECT OBJECT
========================================================= */

function selectObject(obj){

    if(activeObject){

        activeObject.material =
            normalMaterial();

    }


    activeObject=obj;


    if(activeObject){

        activeObject.material =
            activeMaterial();


        showPartLabel(
            activeObject.userData.name
        );

    }

}


/* =========================================================
   PART LABEL
========================================================= */

function showPartLabel(text){

    partLabel.textContent =
        text.toUpperCase();

    partLabel.classList.add(
        "visible"
    );

}


function hidePartLabel(){

    partLabel.classList.remove(
        "visible"
    );

}


/* =========================================================
   CLEAR EVERYTHING
========================================================= */

function clearModel(){

    for(
        const obj of objects
    ){

        scene.remove(obj);

        if(obj.geometry)
            obj.geometry.dispose();

        if(obj.material)
            obj.material.dispose();

    }


    objects.length=0;

    activeObject=null;

    hidePartLabel();

}


/* =========================================================
   ENGINE MODEL
========================================================= */

        }

    /*

    */

    createPart(

        ),

        )

    );


    /*

    */

    createPart(

/* =========================================================
   BASIC PARTS
========================================================= */

function createCube(){

    clearModel();


    createPart(

        "cube",

        new THREE.BoxGeometry(

        ),

    );

}


function createCylinder(){

}


function createGear(){

    clearModel();


    const group =
        new THREE.Group();


    const gear =
        new THREE.CylinderGeometry(
            .9,

        );

        new THREE.Mesh(
            gear,

        );

/* =========================================================
   WORLD POSITION
========================================================= */

function handToWorld(
    x,
    y
){

    const nx =
        x /
        window.innerWidth *
        2 -
        1;


    const ny =
        -(

            y /
            window.innerHeight *
            2 -
            1

        );


    const vector =
        new THREE.Vector3(
            nx,
            ny,
            0
        );


    vector.unproject(
        camera
    );


    const direction =
        vector
            .sub(camera.position)
            .normalize();


    return camera.position
        .clone()
        .add(
            direction.multiplyScalar(6)
        );

}


/* =========================================================
   WORLD TO SCREEN
========================================================= */

function worldToScreen(
    position
){

    const vector =
        position
            .clone()
            .project(camera);


    return{

        x:
            (vector.x+1) /
            2 *
            window.innerWidth,

        y:
            (-vector.y+1) /
            2 *
            window.innerHeight

    };

}


/* =========================================================
   DISTANCE
========================================================= */

function distance2D(a,b){

    return Math.hypot(

        a.x-b.x,

        a.y-b.y

    );

}


/* =========================================================
   PINCH DETECTION
========================================================= */

function isPinching(hand){

    return (

        distance2D(
            hand[4],
            hand[8]
        )

        <

        .055

    );

}


/* =========================================================
   FIND PART
========================================================= */

function findObject(position){

    let closest=null;

    let closestDistance=
        Infinity;


    for(
        const obj of objects
    ){

        const screen =
            worldToScreen(
                obj.position
            );


        const distance =
            distance2D(
                position,
                screen
            );


        if(
            distance <
            closestDistance
        ){

            closestDistance=
                distance;

            closest=obj;

        }

    }


    if(
        closestDistance<130
    ){

        return closest;

    }


    return null;

}


/* =========================================================
   GRAB STATE
========================================================= */

let grabbing=false;

let grabOffset =
    new THREE.Vector3();

let previousFinger=null;

let grabVelocity =
    new THREE.Vector3();


/* =========================================================
   TWO HAND STATE
========================================================= */

let twoHand=false;

let twoStartDistance=1;

let twoStartScale=1;

let twoStartAngle=0;

let twoStartRotation=0;


/* =========================================================
   HAND RESULTS
========================================================= */

hands.onResults(
results => {

    if(!cameraReady)
        return;


    handCtx.clearRect(

        0,
        0,

        handCanvas.width,
        handCanvas.height

    );


    const detected =
        results.multiHandLandmarks || [];


    const pinching=[];


    for(
        let i=0;
        i<detected.length;
        i++
    ){

        if(
            isPinching(
                detected[i]
            )
        ){

            pinching.push(i);

        }

    }


    /* =====================================================
       TWO HAND MANIPULATION
    ===================================================== */

    if(
        pinching.length===2 &&
        activeObject
    ){

        const p1 =
            screenPosition(
                detected[
                    pinching[0]
                ][8]
            );


        const p2 =
            screenPosition(
                detected[
                    pinching[1]
                ][8]
            );


        const distance =
            distance2D(
                p1,
                p2
            );


        const angle =
            Math.atan2(

                p2.y-p1.y,

                p2.x-p1.x

            );


        const centerX =
            (p1.x+p2.x)/2;


        const centerY =
            (p1.y+p2.y)/2;


        if(!twoHand){

            twoHand=true;


            twoStartDistance =
                Math.max(
                    distance,
                    10
                );


            twoStartScale =
                activeObject.scale.x;


            twoStartAngle =
                angle;


            twoStartRotation =
                activeObject.rotation.z;

        }


        /*
            SCALE
        */

        const scale =
            THREE.MathUtils.clamp(

                twoStartScale *
                distance /
                twoStartDistance,

                .15,

                7

            );


        activeObject.scale.setScalar(
            scale
        );


        /*
            ROTATE
        */

        activeObject.rotation.z =
            twoStartRotation +
            (
                angle -
                twoStartAngle
            );


        /*
            MOVE
        */

        activeObject.position.copy(

            handToWorld(
                centerX,
                centerY
            )

        );


        return;

    }


    twoHand=false;


    /* =====================================================
       SINGLE HAND
    ===================================================== */

    if(
        pinching.length>0
    ){

        const index =
            pinching[0];


        const finger =
            screenPosition(

                detected[index][8]

            );


        reticle.style.display =
            "block";


        reticle.style.left =
            finger.x+"px";


        reticle.style.top =
            finger.y+"px";


        /* =================================================
           CONTINUE GRAB
        ================================================= */

        if(
            grabbing &&
            activeObject
        ){

            const target =
                handToWorld(

                    finger.x,
                    finger.y

                );


            target.add(
                grabOffset
            );


            activeObject.position.lerp(

                target,

                .72

            );


            if(previousFinger){

                grabVelocity.set(

                    finger.x-
                    previousFinger.x,

                    previousFinger.y-
                    finger.y,

                    0

                );

            }


            previousFinger =
                finger;


            /*
                DETACH WHEN PULLED
                FAR ENOUGH FROM
                ORIGINAL ASSEMBLY
            */

            if(

                activeObject.userData
                    .attached &&

                activeObject.position
                    .distanceTo(

                        activeObject
                            .userData
                            .originalPosition

                    ) > 1.25

            ){

                detachPart(
                    activeObject
                );

            }


            return;

        }


        /* =================================================
           SELECT PART
        ================================================= */

        const found =
            findObject(
                finger
            );


        if(found){

            selectObject(
                found
            );


            grabbing=true;


            const target =
                handToWorld(

                    finger.x,
                    finger.y

                );


            grabOffset =
                found.position
                    .clone()
                    .sub(
                        target
                    );


            previousFinger =
                finger;


            return;

        }

    }


    /* =====================================================
       RELEASE
    ===================================================== */

    if(grabbing){

        grabbing=false;

        previousFinger=null;


        if(activeObject){

            activeObject.userData.velocity =
                grabVelocity
                    .clone()
                    .multiplyScalar(.006);

        }


        grabVelocity.set(
            0,
            0,
            0
        );

    }


    reticle.style.display =
        "none";

});


/* =========================================================
   DETACH PART
========================================================= */

function detachPart(obj){

    if(!obj)
        return;


    obj.userData.attached=false;

    obj.userData.detached=true;


    jarvisSpeak(

        `${obj.userData.name} removed.`

    );

}


/* =========================================================
   REATTACH PART
========================================================= */

function reattachPart(obj){

    if(!obj)
        return;


    obj.position.copy(

        obj.userData
            .originalPosition

    );


    const rotation =
        obj.userData
            .originalRotation;


    obj.rotation.set(

        rotation.x,
        rotation.y,
        rotation.z

    );


    obj.scale.set(
        1,
        1,
        1
    );


    obj.userData.attached=true;

    obj.userData.detached=false;


    jarvisSpeak(

        `${obj.userData.name} reattached.`

    );

}


/* =========================================================
   INSPECT PART
========================================================= */

function inspectPart(){

    if(!activeObject){

        jarvisSpeak(
            "Select a component first."
        );

        return;

    }


    const name =
        activeObject.userData.name;


    const status =
        activeObject.userData.attached
        ?
        "attached to the assembly"
        :
        "detached from the assembly";


    jarvisSpeak(

        `${name}. ` +
        `This component is currently ${status}. ` +
        `You can move, rotate, resize, or reattach it.`

    );

}


/* =========================================================
   SHOW PARTS
========================================================= */

function listParts(){

    if(objects.length===0){

        jarvisSpeak(
            "There are no components in the workspace."
        );

        return;

    }


    const names =
        objects.map(

            object =>
                object.userData.name

        );


    jarvisSpeak(

        "Current components are " +
        names.join(", ") +
        "."

    );

}


/* =========================================================
   RESET ASSEMBLY
========================================================= */

function resetAssembly(){

    for(
        const obj of objects
    ){

        if(
            !obj.userData.originalPosition
        )
            continue;


        obj.position.copy(

            obj.userData
                .originalPosition

        );


        if(
            obj.userData.originalRotation
        ){

            const r =
                obj.userData
                    .originalRotation;


            obj.rotation.set(

                r.x,
                r.y,
                r.z

            );

        }


        obj.scale.set(
            1,
            1,
            1
        );


        obj.userData.attached=true;

        obj.userData.detached=false;

    }


    jarvisSpeak(
        "Assembly restored."
    );

}

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


let recognition=null;

let listening=false;


if(SpeechRecognition){

    recognition =
        new SpeechRecognition();


    recognition.continuous=true;

    recognition.interimResults=false;

    recognition.lang="en-US";


    recognition.onstart=()=>{

        listening=true;

        jarvisCore.classList.add(
            "listening"
        );

    };


    recognition.onend=()=>{

        listening=false;

        jarvisCore.classList.remove(

    };


    recognition.onerror=
        error=>{

            console.log(
                "Voice error:",
                error
            );

        };


    recognition.onresult=
        event=>{

            const result =
                event.results[
                    event.results.length-1
                ][0].transcript;


            processVoiceCommand(
                result.toLowerCase()
            );

        };

}


/* =========================================================
   JARVIS SPEECH
========================================================= */

function jarvisSpeak(text){

    console.log(
        "JARVIS:",
        text
    );


    if(
        !("speechSynthesis" in window)
    )
        return;


    speechSynthesis.cancel();


    const utterance =
        new SpeechSynthesisUtterance(
            text
        );


    utterance.rate=.92;

    utterance.pitch=.82;

    utterance.volume=1;


    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   START VOICE
========================================================= */

function startListening(){

    if(!recognition){

        jarvisSpeak(

            "Voice recognition is not supported in this browser."

        );

        return;

    }


    try{

        recognition.start();

    }

    catch(error){

        console.log(error);

    }

}

()=>{

/* =========================================================

========================================================= */

function processVoiceCommand(command){

    console.log(
        "COMMAND:",
        command
    );


    /*
        REMOVE "JARVIS"
    */

    command =
        command
            .replace(
                /\bjarvis\b/g,
                ""
            )
            .trim();


    /* =====================================================
       BUILD
    ===================================================== */

    if(

        command.includes(
            "build an engine"
        ) ||

        command.includes(
            "build engine"
        ) ||

        command.includes(
            "create an engine"
        ) ||

        command.includes(
            "create engine"
        )

    ){

        createEngine();

        return;

    }


    /* =====================================================
       CUBE
    ===================================================== */

    if(
        command.includes(
            "create cube"
        )
    ){

        createCube();

        return;

    }


    /* =====================================================
       CYLINDER
    ===================================================== */

    if(
        command.includes(
            "create cylinder"
        )
    ){

        createCylinder();

        return;

    }


    /* =====================================================
       GEAR
    ===================================================== */

    if(
        command.includes(
            "create gear"
        )
    ){

        createGear();

        return;

    }


    /* =====================================================
       CLEAR
    ===================================================== */

    if(

        command.includes(
            "clear model"
        ) ||

        command.includes(
            "delete model"
        ) ||

        command.includes(
            "clear everything"
        )

    ){

        clearModel();

        jarvisSpeak(
            "Workspace cleared."
        );

        return;

    }


    /* =====================================================
       INSPECT
    ===================================================== */

    if(

        command.includes(
            "inspect"
        ) ||

        command.includes(
            "what is this"
        ) ||

        command.includes(
            "identify this"
        ) ||

        command.includes(
            "tell me about this"
        )

    ){

        inspectPart();

        return;

    }


    /* =====================================================
       LIST
    ===================================================== */

    if(

        command.includes(
            "list the parts"
        ) ||

        command.includes(
            "list parts"
        ) ||

        command.includes(
            "what parts are there"
        )

    ){

        listParts();

        return;

    }


    /* =====================================================
       REATTACH
    ===================================================== */

    if(

        command.includes(
            "put it back"
        ) ||

        command.includes(
            "reattach"
        ) ||

        command.includes(
            "attach it"
        )

    ){

        if(activeObject){

            reattachPart(
                activeObject
            );

        }

        else{

            jarvisSpeak(
                "Select a component first."
            );

        }

        return;

    }


    /* =====================================================
       RESET
    ===================================================== */

    if(
        command.includes(
            "reset"
        )
    ){

        resetAssembly();

        return;

    }


    /* =====================================================
       CAMERA
    ===================================================== */

    if(
        command.includes(
            "switch camera"
        )
    ){

        usingFrontCamera =
            !usingFrontCamera;

        startCamera();

        return;

    }


    /* =====================================================
       HELP
    ===================================================== */

    if(
        command.includes(
            "what can you do"
        ) ||

        command.includes(
            "help"
        )

    ){

        jarvisSpeak(

            "I can build and disassemble models, select individual components, remove parts, inspect them, move them, rotate them, resize them, and answer questions."

        );

        return;

    }


    /* =====================================================
       GENERAL QUESTION
    ===================================================== */

    askJARVIS(
        command
    );

}

/* =========================================================
   PHYSICS
========================================================= */

/*

    IMPORTANT:

    THERE IS NO GRAVITY.

    Components do NOT fall.

    They stay where the user places them.

    A small amount of velocity is retained
    after releasing a part, but it quickly
    stops.

*/

function physics(){

    for(
        const obj of objects
    ){

        if(
            obj === activeObject &&
            grabbing
        ){

            continue;

        }


        if(
            !obj.userData.velocity
        )
            continue;


        obj.position.add(
            obj.userData.velocity
        );


        /*
            NO GRAVITY.

            Only damping.
        */

        obj.userData.velocity
            .multiplyScalar(
                .88
            );


        if(
            obj.userData.velocity
                .length()
                <
                .0005
        ){

            obj.userData.velocity.set(
                0,
                0,
                0
            );

        }

    }

}
