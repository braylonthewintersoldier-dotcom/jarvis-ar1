<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
>

<title>JARVIS 3D ENGINEERING</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>

<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/OBJLoader.js"></script>

<style>

html,
body{

  margin:0;

  width:100%;
  height:100%;

  overflow:hidden;

  background:#000;

  font-family:
    Arial,
    Helvetica,
    sans-serif;

}

/* CAMERA */

#camera{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  object-fit:cover;

  z-index:1;

}

#camera.front{

  transform:scaleX(-1);

}

#camera.back{

  transform:scaleX(1);

}


/* THREE */

#threeCanvas{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  z-index:5;

  pointer-events:none;

}


/* HANDS */

#handCanvas{

  position:fixed;

  inset:0;

  width:100%;
  height:100%;

  z-index:10;

  pointer-events:none;

}


/* INVISIBLE FILE INPUT */

#modelInput{

  display:none;

}


/* JARVIS STATUS */

#jarvisStatus{

  position:fixed;

  left:50%;

  bottom:28px;

  transform:translateX(-50%);

  z-index:100;

  color:rgba(255,255,255,.75);

  font-size:12px;

  letter-spacing:2px;

  text-align:center;

  pointer-events:none;

  text-shadow:
    0 0 12px rgba(0,220,255,.8);

}


/* VOICE INDICATOR */

#voiceIndicator{

  position:fixed;

  left:50%;

  top:50%;

  transform:
    translate(-50%,-50%)
    scale(.8);

  width:70px;
  height:70px;

  border-radius:50%;

  border:
    1px solid
    rgba(0,220,255,.8);

  opacity:0;

  z-index:90;

  pointer-events:none;

  box-shadow:
    0 0 30px rgba(0,220,255,.5),
    inset 0 0 20px rgba(0,220,255,.2);

  transition:
    opacity .2s,
    transform .2s;

}

#voiceIndicator.active{

  opacity:1;

  transform:
    translate(-50%,-50%)
    scale(1.15);

  animation:
    voicePulse 1s infinite;

}


@keyframes voicePulse{

  0%{

    box-shadow:
      0 0 15px rgba(0,220,255,.4);

  }

  50%{

    box-shadow:
      0 0 50px rgba(0,220,255,.9);

  }

  100%{

    box-shadow:
      0 0 15px rgba(0,220,255,.4);

  }

}


/* SELECTED PART */

#selectionRing{

  position:fixed;

  width:45px;
  height:45px;

  border:
    1px solid
    rgba(0,220,255,.9);

  border-radius:50%;

  z-index:30;

  display:none;

  pointer-events:none;

  box-shadow:
    0 0 20px rgba(0,220,255,.7);

}


/* JARVIS TEXT */

#jarvisMessage{

  position:fixed;

  left:50%;

  top:25%;

  transform:translateX(-50%);

  max-width:600px;

  padding:12px 20px;

  color:rgba(255,255,255,.85);

  font-size:14px;

  text-align:center;

  letter-spacing:.5px;

  opacity:0;

  z-index:100;

  pointer-events:none;

  text-shadow:
    0 0 12px rgba(0,220,255,.8);

  transition:opacity .3s;

}

#jarvisMessage.show{

  opacity:1;

}


/* DESKTOP HELP */

#help{

  position:fixed;

  right:18px;

  bottom:18px;

  z-index:100;

  color:rgba(255,255,255,.35);

  font-size:10px;

  text-align:right;

  line-height:1.7;

  pointer-events:none;

}

</style>

</head>


<body>


<video
  id="camera"
  autoplay
  muted
  playsinline>
</video>


<canvas id="handCanvas"></canvas>

<canvas id="threeCanvas"></canvas>


<input
  id="modelInput"
  type="file"
  accept=".glb,.gltf,.obj"
>


<div id="voiceIndicator"></div>

<div id="selectionRing"></div>

<div id="jarvisMessage"></div>

<div id="jarvisStatus">
  JARVIS INITIALIZING
</div>

<div id="help">

  SAY "JARVIS" TO ACTIVATE<br>
  PINCH TO GRAB • TWO HANDS TO ROTATE / SCALE<br>
  "JARVIS LOAD MODEL" TO IMPORT A MODEL

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
  document.getElementById("camera");

const handCanvas =
  document.getElementById("handCanvas");

const handCtx =
  handCanvas.getContext("2d");

const threeCanvas =
  document.getElementById("threeCanvas");

const jarvisStatus =
  document.getElementById("jarvisStatus");

const jarvisMessage =
  document.getElementById("jarvisMessage");

const voiceIndicator =
  document.getElementById("voiceIndicator");

const selectionRing =
  document.getElementById("selectionRing");

const modelInput =
  document.getElementById("modelInput");


/* =====================================================
   CAMERA
===================================================== */

let usingFrontCamera = true;

let currentStream = null;

let cameraReady = false;

let processing = false;


async function startCamera(){

  cameraReady=false;

  if(currentStream){

    currentStream
      .getTracks()
      .forEach(
        track =>
        track.stop()
      );

  }


  try{

    const stream =
      await navigator
      .mediaDevices
      .getUserMedia({

        video:{

          facingMode:
            usingFrontCamera
            ?
            "user"
            :
            "environment",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }

        },

        audio:false

      });


    currentStream=stream;

    video.srcObject=stream;


    video.classList.remove(
      "front",
      "back"
    );


    video.classList.add(
      usingFrontCamera
      ?
      "front"
      :
      "back"
    );


    await video.play();


    cameraReady=true;


    jarvisStatus.textContent =
      "JARVIS ONLINE";

  }

  catch(error){

    console.error(error);

    jarvisStatus.textContent =
      "CAMERA ACCESS REQUIRED";

  }

}


/* =====================================================
   RESIZE
===================================================== */

function resize(){

  handCanvas.width=
    window.innerWidth;

  handCanvas.height=
    window.innerHeight;

}

resize();

window.addEventListener(
  "resize",
  resize
);


/* =====================================================
   THREE
===================================================== */

const renderer =
  new THREE.WebGLRenderer({

    canvas:threeCanvas,

    alpha:true,

    antialias:true

  });


renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);


renderer.setSize(
  window.innerWidth,
  window.innerHeight
);


const scene =
  new THREE.Scene();


const camera =
  new THREE.PerspectiveCamera(

    55,

    window.innerWidth /
    window.innerHeight,

    .1,

    100

  );


camera.position.z=8;


/* =====================================================
   LIGHTING
===================================================== */

scene.add(
  new THREE.AmbientLight(
    0xffffff,
    2
  )
);


const keyLight =
  new THREE.DirectionalLight(
    0xffffff,
    2
  );


keyLight.position.set(
  4,
  6,
  8
);


scene.add(keyLight);


const rimLight =
  new THREE.PointLight(
    0x00d9ff,
    4,
    20
  );


rimLight.position.set(
  -3,
  2,
  5
);


scene.add(rimLight);


/* =====================================================
   MODEL SYSTEM
===================================================== */

const modelRoot =
  new THREE.Group();


scene.add(modelRoot);


const parts=[];

let activePart=null;

let grabbing=false;

let grabOffset =
  new THREE.Vector3();

let previousFinger=null;


/* =====================================================
   MATERIAL
===================================================== */

function createMaterial(){

  return new THREE.MeshStandardMaterial({

    color:0x9fa8b5,

    metalness:.7,

    roughness:.3,

    transparent:true,

    opacity:.92

  });

}


/* =====================================================
   ADD PART
===================================================== */

function registerPart(
  object,
  name
){

  object.userData.isPart=true;

  object.userData.partName =
    name ||
    object.name ||
    "Component";


  object.userData.originalPosition =
    object.position.clone();


  object.userData.originalRotation =
    object.rotation.clone();


  object.userData.detached=false;


  parts.push(object);

}


/* =====================================================
   EXAMPLE ENGINE
===================================================== */

function createExampleAssembly(){

  clearModel();


  const engine =
    new THREE.Group();


  engine.name =
    "Example Engine";


  modelRoot.add(engine);


  /* BLOCK */

  const block =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        2.8,
        1.8,
        1.7
      ),

      createMaterial()

    );


  block.position.set(
    0,
    0,
    0
  );


  block.userData.partName =
    "Engine Block";


  engine.add(block);

  registerPart(
    block,
    "Engine Block"
  );


  /* CYLINDERS */

  for(
    let i=0;
    i<4;
    i++
  ){

    const cylinder =
      new THREE.Mesh(

        new THREE.CylinderGeometry(
          .3,
          .3,
          1.8,
          24
        ),

        createMaterial()

      );


    cylinder.rotation.z=
      Math.PI/2;


    cylinder.position.set(

      -.9+
      i*.6,

      .2,

      0

    );


    engine.add(
      cylinder
    );


    registerPart(
      cylinder,
      "Cylinder "+(i+1)
    );

  }


  /* CRANKSHAFT */

  const crank =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .18,
        .18,
        3,
        24
      ),

      createMaterial()

    );


  crank.rotation.z=
    Math.PI/2;


  crank.position.y=
    -.8;


  engine.add(crank);


  registerPart(
    crank,
    "Crankshaft"
  );


  /* HEAD */

  const head =
    new THREE.Mesh(

      new THREE.BoxGeometry(
        2.5,
        .5,
        1.5
      ),

      createMaterial()

    );


  head.position.y=
    1.05;


  engine.add(head);


  registerPart(
    head,
    "Cylinder Head"
  );


  /* FLYWHEEL */

  const flywheel =
    new THREE.Mesh(

      new THREE.CylinderGeometry(
        .75,
        .75,
        .25,
        40
      ),

      createMaterial()

    );


  flywheel.rotation.z=
    Math.PI/2;


  flywheel.position.x=
    1.65;


  engine.add(
    flywheel
  );


  registerPart(
    flywheel,
    "Flywheel"
  );


  modelRoot.position.set(
    0,
    0,
    -2
  );


  say(
    "Example mechanical assembly loaded."
  );

}


/* =====================================================
   CLEAR MODEL
===================================================== */

function clearModel(){

  while(
    modelRoot.children.length
  ){

    modelRoot.remove(
      modelRoot.children[0]
    );

  }


  parts.length=0;

  activePart=null;

}


/* =====================================================
   LOAD GLB / GLTF
===================================================== */

function loadGLTF(
  file
){

  const loader =
    new THREE.GLTFLoader();


  const url =
    URL.createObjectURL(file);


  loader.load(

    url,

    gltf=>{

      clearModel();


      const loaded =
        gltf.scene;


      modelRoot.add(
        loaded
      );


      loaded.traverse(
        object=>{

          if(
            object.isMesh
          ){

            object.material =
              object.material ||
              createMaterial();


            registerPart(
              object,
              object.name
            );

          }

        }
      );


      centerModel();


      say(
        "Model loaded. I found "+
        parts.length+
        " separate components."
      );


      URL.revokeObjectURL(
        url
      );

    },

    undefined,

    error=>{

      console.error(error);

      say(
        "I could not load that model."
      );

    }

  );

}


/* =====================================================
   LOAD OBJ
===================================================== */

function loadOBJ(
  file
){

  const loader =
    new THREE.OBJLoader();


  const url =
    URL.createObjectURL(file);


  loader.load(

    url,

    object=>{

      clearModel();


      modelRoot.add(
        object
      );


      object.traverse(
        child=>{

          if(
            child.isMesh
          ){

            if(
              !child.material
            ){

              child.material =
                createMaterial();

            }


            registerPart(
              child,
              child.name
            );

          }

        }
      );


      centerModel();


      say(
        "OBJ model loaded with "+
        parts.length+
        " components."
      );


      URL.revokeObjectURL(
        url
      );

    },

    undefined,

    error=>{

      console.error(error);

      say(
        "The OBJ model could not be loaded."
      );

    }

  );

}


/* =====================================================
   CENTER MODEL
===================================================== */

function centerModel(){

  const box =
    new THREE.Box3()
      .setFromObject(
        modelRoot
      );


  const center =
    box.getCenter(
      new THREE.Vector3()
    );


  modelRoot.position.sub(
    center
  );


  modelRoot.position.z=
    -2;

}


/* =====================================================
   FILE INPUT
===================================================== */

modelInput.addEventListener(
  "change",
  ()=>{

    const file =
      modelInput.files[0];


    if(!file)
      return;


    if(
      file.name
        .toLowerCase()
        .endsWith(".obj")
    ){

      loadOBJ(file);

    }

    else{

      loadGLTF(file);

    }

  }
);


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(
  point
){

  const vw=
    video.videoWidth;

  const vh=
    video.videoHeight;


  const sw=
    window.innerWidth;

  const sh=
    window.innerHeight;


  if(!vw || !vh){

    return{

      x:sw/2,

      y:sh/2

    };

  }


  const ratio=
    vw/vh;

  const screenRatio=
    sw/sh;


  let width;

  let height;

  let offsetX=0;

  let offsetY=0;


  if(
    screenRatio>ratio
  ){

    width=sw;

    height=
      sw/ratio;

    offsetY=
      (sh-height)/2;

  }

  else{

    height=sh;

    width=
      sh*ratio;

    offsetX=
      (sw-width)/2;

  }


  let x=
    point.x*width+
    offsetX;


  let y=
    point.y*height+
    offsetY;


  if(usingFrontCamera){

    x=
      sw-x;

  }


  return{
    x,
    y
  };

}


/* =====================================================
   WORLD POSITION
===================================================== */

function handToWorld(
  x,
  y
){

  const nx=
    (x/
    window.innerWidth)*2-1;


  const ny=
    -(y/
    window.innerHeight)*2+1;


  const vector=
    new THREE.Vector3(
      nx,
      ny,
      0
    );


  vector.unproject(
    camera
  );


  const direction=
    vector
      .sub(camera.position)
      .normalize();


  return camera.position
    .clone()
    .add(
      direction.multiplyScalar(6)
    );

}


/* =====================================================
   DISTANCE
===================================================== */

function distance2D(
  a,
  b
){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =====================================================
   PINCH
===================================================== */

function isPinching(
  hand
){

  return(
    distance2D(
      hand[4],
      hand[8]
    )<.055
  );

}


/* =====================================================
   FIND PART
===================================================== */

function findPart(
  position
){

  let closest=null;

  let distance=Infinity;


  for(
    const part of parts
  ){

    if(
      !part.visible
    )
      continue;


    const screen=
      worldToScreen(
        part
          .getWorldPosition(
            new THREE.Vector3()
          )
      );


    const d=
      distance2D(
        position,
        screen
      );


    if(
      d<distance
    ){

      distance=d;

      closest=part;

    }

  }


  if(
    distance<150
  ){

    return closest;

  }


  return null;

}


/* =====================================================
   WORLD TO SCREEN
===================================================== */

function worldToScreen(
  position
){

  const vector=
    position
      .clone()
      .project(camera);


  return{

    x:
      (vector.x+1)/2*
      window.innerWidth,

    y:
      (-vector.y+1)/2*
      window.innerHeight

  };

}


/* =====================================================
   SELECT PART
===================================================== */

function selectPart(
  part
){

  if(
    activePart &&
    activePart!==part
  ){

    restoreMaterial(
      activePart
    );

  }


  activePart=part;


  if(!part)
    return;


  highlightMaterial(
    part
  );


  say(
    part.userData.partName+
    " selected."
  );

}


/* =====================================================
   HIGHLIGHT
===================================================== */

function highlightMaterial(
  object
){

  object.traverse(
    child=>{

      if(
        child.isMesh &&
        child.material
      ){

        child.userData.originalEmissive=
          child.material.emissive
          ?
          child.material.emissive.clone()
          :
          new THREE.Color(0,0,0);


        if(
          child.material.emissive
        ){

          child.material.emissive.set(
            0x0088aa
          );

        }

      }

    }
  );

}


/* =====================================================
   RESTORE
===================================================== */

function restoreMaterial(
  object
){

  object.traverse(
    child=>{

      if(
        child.isMesh &&
        child.material &&
        child.material.emissive
      ){

        if(
          child.userData
            .originalEmissive
        ){

          child.material.emissive.copy(
            child.userData
              .originalEmissive
          );

        }

      }

    }
  );

}


/* =====================================================
   DETACH PART
===================================================== */

function detachPart(
  part
){

  if(!part)
    return;


  part.userData.detached=true;


  say(
    part.userData.partName+
    " detached. You can inspect it independently."
  );

}


/* =====================================================
   REATTACH
===================================================== */

function reattachPart(
  part
){

  if(!part)
    return;


  part.position.copy(
    part.userData.originalPosition
  );


  part.rotation.copy(
    part.userData.originalRotation
  );


  part.userData.detached=false;


  say(
    part.userData.partName+
    " returned to its original position."
  );

}


/* =====================================================
   EXPLODE MODEL
===================================================== */

function explodeModel(){

  if(!parts.length)
    return;


  const center=
    new THREE.Vector3();


  for(
    const part of parts
  ){

    center.add(
      part.position
    );

  }


  center.divideScalar(
    parts.length
  );


  for(
    const part of parts
  ){

    const direction=
      part.position
        .clone()
        .sub(center);


    if(
      direction.length()<.1
    ){

      direction.set(
        Math.random()-.5,
        Math.random()-.5,
        Math.random()-.5
      );

    }


    direction.normalize();


    part.position.add(
      direction.multiplyScalar(2)
    );


    part.userData.detached=true;

  }


  say(
    "Exploded view activated."
  );

}


/* =====================================================
   RESET MODEL
===================================================== */

function resetModel(){

  for(
    const part of parts
  ){

    part.position.copy(
      part.userData.originalPosition
    );


    part.rotation.copy(
      part.userData.originalRotation
    );


    part.scale.set(
      1,
      1,
      1
    );


    part.userData.detached=false;

  }


  modelRoot.rotation.set(
    0,
    0,
    0
  );


  say(
    "Assembly restored."
  );

}


/* =====================================================
   TWO HAND MANIPULATION
===================================================== */

let twoHand=false;

let twoStartDistance=1;

let twoStartScale=1;

let twoStartAngle=0;

let twoStartRotation=0;


function twoHandManipulation(
  p1,
  p2
){

  if(!activePart)
    return;


  const distance=
    distance2D(
      p1,
      p2
    );


  const angle=
    Math.atan2(
      p2.y-p1.y,
      p2.x-p1.x
    );


  const centerX=
    (p1.x+p2.x)/2;


  const centerY=
    (p1.y+p2.y)/2;


  if(!twoHand){

    twoHand=true;


    twoStartDistance=
      Math.max(
        distance,
        10
      );


    twoStartScale=
      activePart.scale.x;


    twoStartAngle=
      angle;


    twoStartRotation=
      activePart.rotation.z;

  }


  let scale=
    twoStartScale*
    distance/
    twoStartDistance;


  scale=
    Math.max(
      .15,
      Math.min(
        8,
        scale
      )
    );


  activePart.scale.setScalar(
    scale
  );


  activePart.rotation.z=
    twoStartRotation+
    (
      angle-
      twoStartAngle
    );


  activePart.position.copy(
    handToWorld(
      centerX,
      centerY
    )
  );

}


/* =====================================================
   HAND TRACKING
===================================================== */

const hands=
  new Hands({

    locateFile:
    file=>
    `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:1,

  minDetectionConfidence:.65,

  minTrackingConfidence:.65

});


hands.onResults(
results=>{

  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );


  const detected=
    results.multiHandLandmarks || [];


  const pinching=[];


  for(
    let i=0;
    i<detected.length;
    i++
  ){

    if(
      isPinching(
        detected[i]
      )
    ){

      pinching.push(i);

    }

  }


  /* TWO HANDS */

  if(
    pinching.length===2
  ){

    const p1=
      screenPosition(
        detected[
          pinching[0]
        ][8]
      );


    const p2=
      screenPosition(
        detected[
          pinching[1]
        ][8]
      );


    if(!activePart){

      const center={
        x:(p1.x+p2.x)/2,
        y:(p1.y+p2.y)/2
      };


      const found=
        findPart(center);


      if(found){

        selectPart(found);

      }

    }


    twoHandManipulation(
      p1,
      p2
    );


    return;

  }


  twoHand=false;


  /* ONE HAND */

  if(
    pinching.length>0
  ){

    const index=
      pinching[0];


    const fingertip=
      screenPosition(
        detected[index][8]
      );


    selectionRing.style.display=
      "block";


    selectionRing.style.left=
      fingertip.x+"px";


    selectionRing.style.top=
      fingertip.y+"px";


    /* CONTINUE GRAB */

    if(
      grabbing &&
      activePart
    ){

      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );


      target.add(
        grabOffset
      );


      activePart.position.lerp(
        target,
        .8
      );


      previousFinger=
        fingertip;


      return;

    }


    /* FIND PART */

    const found=
      findPart(
        fingertip
      );


    if(found){

      selectPart(found);


      grabbing=true;


      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );


      grabOffset=
        activePart.position
          .clone()
          .sub(target);


      detachPart(
        activePart
      );


      return;

    }

  }


  /* RELEASE */

  if(grabbing){

    grabbing=false;

    previousFinger=null;


    if(activePart){

      say(
        activePart.userData.partName+
        " released."
      );

    }

  }


  selectionRing.style.display=
    "none";

});


/* =====================================================
   VOICE ASSISTANT
===================================================== */

const SpeechRecognition=
  window.SpeechRecognition ||
  window.webkitSpeechRecognition;


let recognition=null;

let listening=false;


if(SpeechRecognition){

  recognition=
    new SpeechRecognition();


  recognition.continuous=true;

  recognition.interimResults=false;

  recognition.lang="en-US";


  recognition.onstart=
  ()=>{

    listening=true;

    voiceIndicator
      .classList
      .add("active");

  };


  recognition.onend=
  ()=>{

    listening=false;

    voiceIndicator
      .classList
      .remove("active");


    if(
      window.jarvisVoiceEnabled
    ){

      try{

        recognition.start();

      }

      catch(e){}

    }

  };


  recognition.onerror=
  error=>{

    console.log(
      "Voice:",
      error
    );

  };


  recognition.onresult=
  event=>{

    const result=
      event.results[
        event.results.length-1
      ][0]
      .transcript
      .toLowerCase()
      .trim();


    console.log(
      "Voice command:",
      result
    );


    processVoiceCommand(
      result
    );

  };

}


window.jarvisVoiceEnabled=true;


/* =====================================================
   VOICE COMMANDS
===================================================== */

function processVoiceCommand(
command
){

  if(
    command.includes("jarvis")
  ){

    const cleaned=
      command
        .replace(
          "jarvis",
          ""
        )
        .trim();


    if(cleaned){

      executeCommand(
        cleaned
      );

    }

    else{

      say(
        "Yes. How can I help?"
      );

    }

  }

}


/* =====================================================
   COMMAND ENGINE
===================================================== */

function executeCommand(
command
){

  console.log(
    "JARVIS:",
    command
  );


  /* LOAD MODEL */

  if(
    command.includes(
      "load model"
    ) ||
    command.includes(
      "open model"
    ) ||
    command.includes(
      "import model"
    )
  ){

    modelInput.click();

    return;

  }


  /* EXAMPLE */

  if(
    command.includes(
      "example"
    ) ||
    command.includes(
      "engine"
    )
  ){

    createExampleAssembly();

    return;

  }


  /* EXPLODE */

  if(
    command.includes(
      "explode"
    ) ||
    command.includes(
      "take apart"
    ) ||
    command.includes(
      "disassemble"
    )
  ){

    explodeModel();

    return;

  }


  /* RESET */

  if(
    command.includes(
      "reset"
    ) ||
    command.includes(
      "reassemble"
    ) ||
    command.includes(
      "put it back"
    )
  ){

    resetModel();

    return;

  }


  /* DETACH */

  if(
    command.includes(
      "detach"
    ) ||
    command.includes(
      "remove"
    ) ||
    command.includes(
      "pull off"
    )
  ){

    if(activePart){

      detachPart(
        activePart
      );

    }

    else{

      say(
        "Select a component first."
      );

    }

    return;

  }


  /* REATTACH */

  if(
    command.includes(
      "attach"
    ) ||
    command.includes(
      "reattach"
    )
  ){

    if(activePart){

      reattachPart(
        activePart
      );

    }

    return;

  }


  /* SELECT */

  if(
    command.includes(
      "select"
    )
  ){

    const words=
      command.split(" ");


    const target=
      words
        .slice(
          words.indexOf("select")+1
        )
        .join(" ");


    const found=
      parts.find(
        part=>
          part.userData
            .partName
            .toLowerCase()
            .includes(
              target
            )
      );


    if(found){

      selectPart(
        found
      );

    }

    else{

      say(
        "I cannot find that component."
      );

    }

    return;

  }


  /* INSPECT */

  if(
    command.includes(
      "inspect"
    ) ||
    command.includes(
      "what is this"
    )
  ){

    if(activePart){

      const box=
        new THREE.Box3()
          .setFromObject(
            activePart
          );


      const size=
        box.getSize(
          new THREE.Vector3()
        );


      say(
        activePart
          .userData
          .partName+
        ". Dimensions approximately "+
        size.x.toFixed(2)+
        " by "+
        size.y.toFixed(2)+
        " by "+
        size.z.toFixed(2)+
        " scene units."
      );

    }

    else{

      say(
        "Select a component and I will inspect it."
      );

    }

    return;

  }


  /* ROTATE */

  if(
    command.includes(
      "rotate"
    )
  ){

    if(activePart){

      activePart.rotation.y+=
        Math.PI/2;

      say(
        "Rotated "+
        activePart
          .userData
          .partName
      );

    }

    return;

  }


  /* HELP */

  if(
    command.includes(
      "help"
    ) ||
    command.includes(
      "what can you do"
    )
  ){

    say(
      "I can load 3D models, identify components, detach parts, inspect parts, create exploded views, rotate and scale components, and reassemble the model."
    );

    return;

  }


  /* DEFAULT */

  say(
    "I heard you say: "+
    command+
    ". I do not have an engineering answer for that command yet."
  );

}


/* =====================================================
   JARVIS SPEECH
===================================================== */

function say(
text
){

  jarvisMessage.textContent=
    text;


  jarvisMessage
    .classList
    .add("show");


  jarvisStatus.textContent=
    "JARVIS • "+text;


  setTimeout(
    ()=>{
      jarvisMessage
        .classList
        .remove("show");

      jarvisStatus.textContent=
        "JARVIS ONLINE";

    },
    5000
  );


  if(
    "speechSynthesis"
    in window
  ){

    speechSynthesis.cancel();


    const utterance=
      new SpeechSynthesisUtterance(
        text
      );


    utterance.rate=.95;

    utterance.pitch=.9;

    utterance.volume=1;


    speechSynthesis.speak(
      utterance
    );

  }

}


/* =====================================================
   KEYBOARD COMMANDS
===================================================== */

window.addEventListener(
  "keydown",
  event=>{

    if(
      event.key.toLowerCase()==="v"
    ){

      if(
        recognition
      ){

        try{

          recognition.start();

        }

        catch(e){}

      }

    }


    if(
      event.key.toLowerCase()==="e"
    ){

      explodeModel();

    }


    if(
      event.key.toLowerCase()==="r"
    ){

      resetModel();

    }

  }
);

/* =====================================================

===================================================== */

function animate(){

  requestAnimationFrame(
    animate
  );


  physics();


  if(activePart){

    const position=
      worldToScreen(
        activePart
          .getWorldPosition(
            new THREE.Vector3()
          )
      );


    selectionRing.style.left=
      position.x+"px";


    selectionRing.style.top=
      position.y+"px";

  }


  renderer.render(
    scene,
    camera
  );

}


animate();


/* =====================================================
   MEDIAPIPE LOOP
===================================================== */

async function trackingLoop(){

  if(

    cameraReady &&

    video.readyState>=2 &&

    !processing

  ){

    processing=true;


    try{

      await hands.send({

        image:video

      });

    }

    catch(error){

      console.log(error);

    }


    processing=false;

  }


  requestAnimationFrame(
    trackingLoop
  );

}


/* =====================================================
   RESIZE THREE
===================================================== */

window.addEventListener(
  "resize",
  ()=>{

    camera.aspect=
      window.innerWidth/
      window.innerHeight;


    camera.updateProjectionMatrix();


    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );

  }
);


/* =====================================================
   BOOT
===================================================== */

async function boot(){

  jarvisStatus.textContent=
    "JARVIS BOOTING";


  createExampleAssembly();


  await startCamera();


  trackingLoop();


  setTimeout(
    ()=>{

      say(
        "JARVIS online. Your engineering workspace is ready."
      );


      if(recognition){

        try{

          recognition.start();

        }

        catch(e){}

      }

    },
    1500
  );

}


boot();
