<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  z-index:1;
}

#output{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:2;
  pointer-events:none;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:50;
  color:#00eaff;
  background:rgba(0,10,20,.75);
  border:1px solid rgba(0,220,255,.6);
  border-radius:10px;
  padding:14px 18px;
  box-shadow:
    0 0 15px rgba(0,220,255,.3),
    inset 0 0 15px rgba(0,220,255,.1);
  font-size:15px;
  line-height:1.6;
}

#title{
  font-size:20px;
  font-weight:bold;
  letter-spacing:2px;
}

#status{
  color:white;
}

#hands{
  color:#00eaff;
}


/* =====================================
   HOLOGRAM STAGE
===================================== */

#holo{
  position:fixed;
  left:0;
  top:0;

  width:0;
  height:0;

  display:none;

  z-index:20;

  perspective:900px;
  transform-style:preserve-3d;

  pointer-events:none;
}


/* =====================================
   HOLOGRAM OBJECT
===================================== */

#object{
  position:absolute;

  left:-55px;
  top:-55px;

  width:110px;
  height:110px;

  transform-style:preserve-3d;

  animation:
    hologramFloat 2.5s ease-in-out infinite;

  filter:
    drop-shadow(0 0 12px cyan);
}


/* =====================================
   CUBE
===================================== */

.face{
  position:absolute;

  width:110px;
  height:110px;

  box-sizing:border-box;

  border:2px solid #00eaff;

  background:
    rgba(0,220,255,.12);

  box-shadow:
    inset 0 0 25px rgba(0,230,255,.7),
    0 0 18px rgba(0,230,255,.8);

  backface-visibility:visible;
}

.front{
  transform:translateZ(55px);
}

.back{
  transform:
    rotateY(180deg)
    translateZ(55px);
}

.right{
  transform:
    rotateY(90deg)
    translateZ(55px);
}

.left{
  transform:
    rotateY(-90deg)
    translateZ(55px);
}

.top{
  transform:
    rotateX(90deg)
    translateZ(55px);
}

.bottom{
  transform:
    rotateX(-90deg)
    translateZ(55px);
}


/* =====================================
   HOLOGRAM RINGS
===================================== */

.ring{
  position:absolute;

  left:50%;
  top:50%;

  width:180px;
  height:180px;

  margin-left:-90px;
  margin-top:-90px;

  border:
    2px solid rgba(0,230,255,.65);

  border-radius:50%;

  box-shadow:
    0 0 12px rgba(0,230,255,.7);

  transform-style:preserve-3d;
}

.ring1{
  transform:
    rotateX(75deg);
}

.ring2{
  transform:
    rotateY(75deg);
}

.ring3{
  width:230px;
  height:230px;

  margin-left:-115px;
  margin-top:-115px;

  transform:
    rotateX(90deg);
}


/* =====================================
   FLOATING ANIMATION
===================================== */

@keyframes hologramFloat{

  0%{
    transform:
      translateY(0px);
  }

  50%{
    transform:
      translateY(-7px);
  }

  100%{
    transform:
      translateY(0px);
  }

}


/* =====================================
   TARGET MARKER
===================================== */

#target{
  position:fixed;

  width:22px;
  height:22px;

  margin-left:-11px;
  margin-top:-11px;

  border:
    2px solid cyan;

  border-radius:50%;

  display:none;

  z-index:25;

  pointer-events:none;

  box-shadow:
    0 0 12px cyan;
}

</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>


<div id="hud">

  <div id="title">
    JARVIS AR
  </div>

  <div id="status">
    Starting camera...
  </div>

  <div id="hands">
    Hands: 0
  </div>

  <div id="mode">
    Mode: STANDBY
  </div>

</div>


<div id="target"></div>


<!-- =====================================
     HOLOGRAM
===================================== -->

<div id="holo">

  <div id="object">

    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>

    <div class="ring ring1"></div>
    <div class="ring ring2"></div>
    <div class="ring ring3"></div>

  </div>

</div>


<script>

/* =====================================
   ELEMENTS
===================================== */

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsDisplay =
  document.getElementById("hands");

const modeDisplay =
  document.getElementById("mode");

const holo =
  document.getElementById("holo");

const object =
  document.getElementById("object");

const target =
  document.getElementById("target");


/* =====================================
   CANVAS
===================================== */

function resizeCanvas(){

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =====================================
   CAMERA → SCREEN
===================================== */

function screenPosition(point){

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if(!vw || !vh){

    return {
      x:sw/2,
      y:sh/2
    };

  }


  const videoRatio =
    vw/vh;

  const screenRatio =
    sw/sh;


  let displayWidth;
  let displayHeight;

  let offsetX=0;
  let offsetY=0;


  if(screenRatio > videoRatio){

    displayWidth =
      sw;

    displayHeight =
      sw/videoRatio;

    offsetY =
      (sh-displayHeight)/2;

  }else{

    displayHeight =
      sh;

    displayWidth =
      sh*videoRatio;

    offsetX =
      (sw-displayWidth)/2;

  }


  let x =
    point.x *
    displayWidth +
    offsetX;

  let y =
    point.y *
    displayHeight +
    offsetY;


  x =
    sw-x;


  return {
    x:x,
    y:y
  };

}


/* =====================================
   MEDIAPIPE
===================================== */

const hands =
  new Hands({

    locateFile:(file)=>{

      return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

    }

  });


hands.setOptions({

  maxNumHands:2,

  modelComplexity:0,

  minDetectionConfidence:.5,

  minTrackingConfidence:.5

});


/* =====================================
   OBJECT STATE
===================================== */

let objectX =
  window.innerWidth/2;

let objectY =
  window.innerHeight/2;

let objectScale =
  1;

let objectRotationX =
  0;

let objectRotationY =
  0;

let objectRotationZ =
  0;


let placed =
  false;

let grabbed =
  false;

let grabHand =
  -1;

let previousPinch =
  false;


/* =====================================
   TWO-HAND STATE
===================================== */

let twoHandActive =
  false;

let startingDistance =
  0;

let startingScale =
  1;

let startingAngle =
  0;

let startingRotationZ =
  0;


/* =====================================
   APPLY OBJECT TRANSFORM
===================================== */

function updateObject(){

  holo.style.left =
    objectX+"px";

  holo.style.top =
    objectY+"px";


  object.style.transform =
    `
    scale(${objectScale})
    rotateX(${objectRotationX}deg)
    rotateY(${objectRotationY}deg)
    rotateZ(${objectRotationZ}deg)
    `;

}


/* =====================================
   DISTANCE
===================================== */

function distance(a,b){

  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );

}


/* =====================================
   ANGLE
===================================== */

function angle(a,b){

  return Math.atan2(
    b.y-a.y,
    b.x-a.x
  );

}


/* =====================================
   HAND RESULTS
===================================== */

hands.onResults((results)=>{


  ctx.clearRect(
    0,
    0,
    canvas.width,
    canvas.height
  );


  const detectedHands =
    results.multiHandLandmarks || [];


  handsDisplay.textContent =
    "Hands: "+
    detectedHands.length;


  /* ===================================
     DRAW HANDS
  =================================== */

  for(
    const hand of detectedHands
  ){

    const points =
      hand.map(screenPosition);


    ctx.strokeStyle =
      "cyan";

    ctx.lineWidth =
      3;


    for(
      const connection
      of HAND_CONNECTIONS
    ){

      const a =
        points[
          connection[0]
        ];

      const b =
        points[
          connection[1]
        ];


      ctx.beginPath();

      ctx.moveTo(
        a.x,
        a.y
      );

      ctx.lineTo(
        b.x,
        b.y
      );

      ctx.stroke();

    }


    ctx.fillStyle =
      "cyan";


    for(
      const point
      of points
    ){

      ctx.beginPath();

      ctx.arc(
        point.x,
        point.y,
        5,
        0,
        Math.PI*2
      );

      ctx.fill();

    }

  }


  /* ===================================
     FIND PINCHING HANDS
  =================================== */

  let pinching=[];


  for(
    let i=0;
    i<detectedHands.length;
    i++
  ){

    const hand =
      detectedHands[i];


    const thumb =
      hand[4];

    const index =
      hand[8];


    const d =
      Math.hypot(
        thumb.x-index.x,
        thumb.y-index.y
      );


    if(d<.065){

      pinching.push(i);

    }

  }


  /* ===================================
     TWO HAND MODE
  =================================== */

  if(
    pinching.length>=2
  ){

    const hand1 =
      detectedHands[
        pinching[0]
      ];

    const hand2 =
      detectedHands[
        pinching[1]
      ];


    const p1 =
      screenPosition(
        hand1[8]
      );

    const p2 =
      screenPosition(
        hand2[8]
      );


    const currentDistance =
      distance(p1,p2);


    const currentAngle =
      angle(p1,p2);


    /* START TWO HAND CONTROL */

    if(!twoHandActive){

      twoHandActive =
        true;

      startingDistance =
        currentDistance;

      startingScale =
        objectScale;

      startingAngle =
        currentAngle;

      startingRotationZ =
        objectRotationZ;

    }


    /* SCALE */

    if(
      startingDistance>1
    ){

      objectScale =
        startingScale *
        (
          currentDistance /
          startingDistance
        );

    }


    /*
      Keep scale reasonable.
    */

    objectScale =
      Math.max(
        .45,
        Math.min(
          3,
          objectScale
        )
      );


    /* ROTATE */

    const angleChange =
      currentAngle -
      startingAngle;


    objectRotationZ =
      startingRotationZ +
      angleChange *
      180 /
      Math.PI;


    /*
      Two fingertips midpoint
      moves the object.
    */

    objectX =
      (p1.x+p2.x)/2;

    objectY =
      (p1.y+p2.y)/2;


    placed =
      true;

    grabbed =
      true;

    holo.style.display =
      "block";


    modeDisplay.textContent =
      "Mode: TWO-HAND HOLOGRAM";


    status.textContent =
      "SCALE + ROTATE";


    updateObject();


    return;

  }


  /* ===================================
     END TWO HAND MODE
  =================================== */

  if(
    twoHandActive
  ){

    twoHandActive =
      false;

  }


  /* ===================================
     EXISTING GRAB
  =================================== */

  if(
    grabbed &&
    grabHand>=0 &&
    grabHand<detectedHands.length
  ){

    const hand =
      detectedHands[
        grabHand
      ];


    const thumb =
      hand[4];

    const index =
      hand[8];


    const pinchDistance =
      Math.hypot(
        thumb.x-index.x,
        thumb.y-index.y
      );


    /* STILL PINCHING */

    if(
      pinchDistance<.075
    ){

      const fingertip =
        screenPosition(index);


      objectX =
        fingertip.x;

      objectY =
        fingertip.y;


      holo.style.display =
        "block";


      placed =
        true;


      modeDisplay.textContent =
        "Mode: GRABBED";


      status.textContent =
        "HOLOGRAM CONTROL";


      updateObject();


      target.style.display =
        "block";

      target.style.left =
        objectX+"px";

      target.style.top =
        objectY+"px";


      return;

    }


    /* RELEASE */

    grabbed =
      false;

    grabHand =
      -1;

    previousPinch =
      false;


    target.style.display =
      "none";


    modeDisplay.textContent =
      "Mode: PLACED";


    status.textContent =
      "HOLOGRAM LOCKED";


    holo.style.display =
      "block";


    return;

  }


  /* ===================================
     FIND NEW GRAB
  =================================== */

  if(
    placed &&
    pinching.length>0
  ){

    for(
      const handIndex
      of pinching
    ){

      const hand =
        detectedHands[
          handIndex
        ];


      const fingertip =
        screenPosition(
          hand[8]
        );


      const d =
        Math.hypot(
          fingertip.x-objectX,
          fingertip.y-objectY
        );


      /*
        Only grab if the fingertip
        is actually near the object.
      */

      if(
        d<
        70*objectScale
      ){

        grabbed =
          true;

        grabHand =
          handIndex;

        previousPinch =
          true;


        status.textContent =
          "HOLOGRAM GRABBED 🤏";

        modeDisplay.textContent =
          "Mode: GRABBED";


        target.style.display =
          "block";


        break;

      }

    }

  }


  /* ===================================
     FIRST CREATION
  =================================== */

  if(
    !placed &&
    pinching.length>0
  ){

    const hand =
      detectedHands[
        pinching[0]
      ];


    const fingertip =
      screenPosition(
        hand[8]
      );


    objectX =
      fingertip.x;

    objectY =
      fingertip.y;


    objectScale =
      1;


    placed =
      true;

    grabbed =
      true;

    grabHand =
      pinching[0];

    previousPinch =
      true;


    holo.style.display =
      "block";


    modeDisplay.textContent =
      "Mode: CREATED";


    status.textContent =
      "HOLOGRAM CREATED";


    updateObject();

  }


  /* ===================================
     NORMAL STATE
  =================================== */

  if(
    placed &&
    !grabbed
  ){

    holo.style.display =
      "block";


    modeDisplay.textContent =
      "Mode: PLACED";


    status.textContent =
      "PINCH THE HOLOGRAM TO GRAB";

  }


  if(
    !placed
  ){

    modeDisplay.textContent =
      "Mode: STANDBY";


    status.textContent =
      detectedHands.length
      ? "PINCH TO CREATE HOLOGRAM"
      : "SHOW YOUR HANDS";

  }

});


/* =====================================
   CAMERA
===================================== */

async function startCamera(){

  try{

    status.textContent =
      "Requesting camera...";


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video:{

          facingMode:"user",

          width:{
            ideal:1280
          },

          height:{
            ideal:720
          },

          frameRate:{
            ideal:30,
            max:30
          }

        },

        audio:false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    const camera =
      new Camera(
        video,
        {

          onFrame:
            async()=>{
              await hands.send({
                image:video
              });
            },

          width:1280,

          height:720

        }
      );


    camera.start();


  }catch(error){

    console.error(error);

    status.textContent =
      "Camera error: "+
      error.message;

  }

}


/* =====================================
   START
===================================== */

startCamera();

</script>

</body>
</html>
```
