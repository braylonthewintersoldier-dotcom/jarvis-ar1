let cameraReady = false;
let processing = false;


async function startCamera(){

    if(currentStream){

        currentStream
            .getTracks()
            .forEach(track => track.stop());

    }

    try{

        currentStream =
            await navigator.mediaDevices.getUserMedia({

                video:{
                    facingMode:
                        usingFrontCamera
                        ? "user"
                        : "environment",

                    width:{
                        ideal:1280
                    },

                    height:{
                        ideal:720
                    },

                    frameRate:{
                        ideal:30
                    }
                },

                audio:false

            });


        video.srcObject =
            currentStream;


        video.classList.remove(
            "front",
            "back"
        );


        video.classList.add(
            usingFrontCamera
            ? "front"
            : "back"
        );


        await video.play();


        cameraReady=true;


        jarvisSpeak(
            "Camera online."
        );

    }

    catch(error){

        console.error(error);

        jarvisSpeak(
            "I cannot access the camera."
        );

    }

}

/* =========================================================
   SCREEN POSITION
========================================================= */

function screenPosition(point){

    const vw =
        video.videoWidth;

    const vh =
        video.videoHeight;

    const sw =
        window.innerWidth;

    const sh =
        window.innerHeight;


    if(!vw || !vh){

        return{
            x:sw/2,
            y:sh/2
        };

    }


    const videoRatio =
        vw / vh;

    const screenRatio =
        sw / sh;


    let width;
    let height;

    let offsetX=0;
    let offsetY=0;


    if(screenRatio > videoRatio){

        width=sw;

        height=
            sw/videoRatio;

        offsetY=
            (sh-height)/2;

    }

    else{

        height=sh;

        width=
            sh*videoRatio;

        offsetX=
            (sw-width)/2;

    }


    let x =
        point.x*width+
        offsetX;

    let y =
        point.y*height+
        offsetY;


    if(usingFrontCamera){

        x =
            sw-x;

    }


    return{
        x,
        y
    };

}

function createPart(

    geometry,
    position
){

    const mesh =

    );


    mesh.userData.name =

    mesh.userData.originalPosition =
        position.clone();

    mesh.userData.attached=true;

    mesh.userData.type="mechanical part";


    scene.add(mesh);

    objects.push(mesh);


    return mesh;

}

/* =========================================================
   CLEAR MODEL
========================================================= */

function clearModel(){

    for(
        const obj of objects
    ){

        scene.remove(obj);

        if(obj.geometry)
            obj.geometry.dispose();

        if(obj.material)
            obj.material.dispose();

    }


    objects.length=0;

    activeObject=null;

}

/* =========================================================
   WORLD POSITION
========================================================= */

function handToWorld(
    x,
    y
){

    const nx =
        x /
        window.innerWidth *
        2 -
        1;


    const ny =
        -(y /
        window.innerHeight *
        2 -
        1);


    const vector =
        new THREE.Vector3(
            nx,
            ny,
            0
        );


    vector.unproject(
        camera
    );


    const direction =
        vector
            .sub(camera.position)
            .normalize();


    return camera.position
        .clone()
        .add(
            direction.multiplyScalar(6)
        );

}


/* =========================================================
   SCREEN PROJECTION
========================================================= */

function worldToScreen(
    position
){

    const vector =
        position
            .clone()
            .project(camera);


    return{

        x:
            (vector.x+1) /
            2 *
            window.innerWidth,

        y:
            (-vector.y+1) /
            2 *
            window.innerHeight

    };

}


/* =========================================================
   DISTANCE
========================================================= */

function distance2D(a,b){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    );

}


/* =========================================================
   PINCH
========================================================= */

function isPinching(hand){

    return distance2D(
        hand[4],
        hand[8]
    ) < .055;

}


/* =========================================================
   FIND PART
========================================================= */

function findObject(position){

    let closest=null;

    let closestDistance=
        Infinity;


    for(
        const obj of objects
    ){

        const screen =
            worldToScreen(
                obj.position
            );


        const distance =
            distance2D(
                position,
                screen
            );


        if(
            distance <
            closestDistance
        ){

            closestDistance =
                distance;

            closest=obj;

        }

    }


    if(
        closestDistance<140
    ){

        return closest;

    }


    return null;

}


/* =========================================================
   SELECT PART
========================================================= */

function selectObject(obj){

    if(activeObject){

        activeObject.material =
            partMaterial();

    }


    activeObject=obj;


    if(activeObject){

        activeObject.material =
            selectedMaterial();

    }

}


/* =========================================================
   PULL PART OFF MODEL
========================================================= */

function detachPart(obj){

    if(!obj)
        return;


    obj.userData.attached=false;


    jarvisSpeak(
        `${obj.userData.name} detached.`
    );

}


/* =========================================================
   REATTACH PART
========================================================= */

function reattachPart(obj){

    if(!obj)
        return;


    obj.position.copy(
        obj.userData.originalPosition
    );


    obj.rotation.set(
        0,
        0,
        0
    );


    obj.scale.set(
        1,
        1,
        1
    );


    obj.userData.attached=true;


    jarvisSpeak(
        `${obj.userData.name} reattached.`
    );

}


/* =========================================================
   HAND TRACKING
========================================================= */

hands.onResults(
results => {

    if(!cameraReady)
        return;


    handCtx.clearRect(
        0,
        0,
        handCanvas.width,
        handCanvas.height
    );


    const detected =
        results.multiHandLandmarks || [];


    /*
        We intentionally don't draw the hands.
        This keeps the experience clean.
    */


    const pinching=[];


    for(
        let i=0;
        i<detected.length;
        i++
    ){

        if(
            isPinching(
                detected[i]
            )
        ){

            pinching.push(i);

        }

    }


    /* =====================================================
       TWO HAND MANIPULATION
    ===================================================== */

    if(
        pinching.length===2 &&
        activeObject
    ){

        const p1 =
            screenPosition(
                detected[
                    pinching[0]
                ][8]
            );


        const p2 =
            screenPosition(
                detected[
                    pinching[1]
                ][8]
            );


        const distance =
            distance2D(
                p1,
                p2
            );


        const centerX =
            (p1.x+p2.x)/2;


        const centerY =
            (p1.y+p2.y)/2;


        const angle =
            Math.atan2(
                p2.y-p1.y,
                p2.x-p1.x
            );


        if(!twoHand){

            twoHand=true;

            activeObject.userData.startDistance =
                Math.max(distance,10);

            activeObject.userData.startScale =
                activeObject.scale.x;

            activeObject.userData.startAngle =
                angle;

            activeObject.userData.startRotation =
                activeObject.rotation.z;

        }


        const scale =
            THREE.MathUtils.clamp(

                activeObject.userData.startScale *
                distance /
                activeObject.userData.startDistance,

                .15,
                8

            );


        activeObject.scale.setScalar(
            scale
        );


        activeObject.rotation.z =
            activeObject.userData.startRotation +
            (
                angle -
                activeObject.userData.startAngle
            );


        activeObject.position.copy(
            handToWorld(
                centerX,
                centerY
            )
        );


        return;

    }


    twoHand=false;


    /* =====================================================
       SINGLE HAND
    ===================================================== */

    if(
        pinching.length>0
    ){

        const hand =
            detected[
                pinching[0]
            ];


        const finger =
            screenPosition(
                hand[8]
            );


        /*
            CONTINUE GRABBING
        */

        if(
            grabbing &&
            activeObject
        ){

            const target =
                handToWorld(
                    finger.x,
                    finger.y
                );


            target.add(
                grabOffset
            );


            activeObject.position.lerp(
                target,
                .75
            );


            if(previousFinger){

                grabVelocity.set(

                    finger.x -
                    previousFinger.x,

                    previousFinger.y -
                    finger.y,

                    0

                );

            }


            previousFinger =
                finger;


            /*
                If the part is pulled far enough
                from its original position,
                it becomes detached.
            */

            const distanceFromOriginal =
                activeObject.position.distanceTo(
                    activeObject.userData.originalPosition
                );


            if(
                distanceFromOriginal >
                1.5 &&
                activeObject.userData.attached
            ){

                detachPart(
                    activeObject
                );

            }


            return;

        }


        /*
            FIND PART
        */

        const found =
            findObject(
                finger
            );


        if(found){

            selectObject(found);

            grabbing=true;

            const target =
                handToWorld(
                    finger.x,
                    finger.y
                );


            grabOffset =
                found.position
                    .clone()
                    .sub(target);


            previousFinger =
                finger;


            return;

        }

    }


    /* =====================================================
       RELEASE
    ===================================================== */

    if(grabbing){

        grabbing=false;

        previousFinger=null;

        if(activeObject){

            activeObject.userData.velocity =
                new THREE.Vector3(
                    grabVelocity.x*.01,
                    grabVelocity.y*.01,
                    0
                );

        }

    }

});


/* =========================================================
   PHYSICS
========================================================= */

/*
    IMPORTANT:

    THERE IS NO GRAVITY.

    Parts stay exactly where the user leaves them.
*/

function physics(){

    for(
        const obj of objects
    ){

        if(!obj.userData.velocity)
            continue;


        if(
            obj===activeObject &&
            grabbing
        ){

            continue;

        }


        obj.position.add(
            obj.userData.velocity
        );


        /*
            Strong damping.
            No gravity.
        */

        obj.userData.velocity.multiplyScalar(
            .90
        );


        if(
            obj.userData.velocity.length()<.001
        ){

            obj.userData.velocity.set(
                0,0,0
            );

        }

    }

}

        const result =
            event.results[
                event.results.length-1
            ][0].transcript;


        processCommand(
            result.toLowerCase()
        );

    };

}


/* =========================================================
   JARVIS SPEECH
========================================================= */

function jarvisSpeak(text){

    console.log(
        "JARVIS:",
        text
    );


    if(
        !("speechSynthesis" in window)
    )
        return;


    speechSynthesis.cancel();


    const speech =
        new SpeechSynthesisUtterance(
            text
        );


    speech.rate=.95;

    speech.pitch=.85;

    speech.volume=1;


    speechSynthesis.speak(
        speech
    );

}

/* =========================================================
   AI COMMAND PROCESSOR
========================================================= */

function processCommand(command){

    console.log(
        "USER:",
        command
    );


    /*
        MODEL CREATION
    */

    if(
        command.includes("create engine") ||
        command.includes("build engine") ||
        command.includes("make engine")
    ){

        createEngine();

        return;

    }


    if(
        command.includes("create cube")
    ){

        createCube();

        jarvisSpeak(
            "Cube created."
        );

        return;

    }


    if(
        command.includes("create sphere")
    ){

        createSphere();

        jarvisSpeak(
            "Sphere created."
        );

        return;

    }


    /*
        CLEAR
    */

    if(
        command.includes("clear model") ||
        command.includes("delete model") ||
        command.includes("remove model")
    ){

        clearModel();

        jarvisSpeak(
            "Model cleared."
        );

        return;

    }


    /*
        REATTACH
    */

    if(
        command.includes("put it back") ||
        command.includes("reattach") ||
        command.includes("attach it")
    ){

        if(activeObject){

            reattachPart(
                activeObject
            );

        }

        else{

            jarvisSpeak(
                "No part is currently selected."
            );

        }

        return;

    }


    /*
        REMOVE SELECTED PART
    */

    if(
        command.includes("remove this") ||
        command.includes("detach this") ||
        command.includes("take this off")
    ){

        if(activeObject){

            detachPart(
                activeObject
            );

        }

        else{

            jarvisSpeak(
                "Select a part first."
            );

        }

        return;

    }


    /*
        INSPECTION
    */

    if(
        command.includes("inspect") ||
        command.includes("what is this") ||
        command.includes("identify this")
    ){

        inspectActivePart();

        return;

    }


    /*
        LIST PARTS
    */

    if(
        command.includes("list parts") ||
        command.includes("what parts")
    ){

        listParts();

        return;

    }


    /*
        RESET
    */

    if(
        command.includes("reset")
    ){

        for(
            const obj of objects
        ){

            obj.position.copy(
                obj.userData.originalPosition
            );

            obj.rotation.set(
                0,0,0
            );

            obj.scale.set(
                1,1,1
            );

            obj.userData.attached=true;

        }


        jarvisSpeak(
            "Assembly reset."
        );

        return;

    }


    /*
        CAMERA
    */

    if(
        command.includes("switch camera")
    ){

        usingFrontCamera =
            !usingFrontCamera;

        startCamera();

        return;

    }


    /*
        GENERAL RESPONSE
    */

    jarvisSpeak(
        "I heard you. I can create models, identify parts, manipulate assemblies, detach components, reattach components, and answer engineering questions."
    );

}


/* =========================================================
   INSPECT PART
========================================================= */

function inspectActivePart(){

    if(!activeObject){

        jarvisSpeak(
            "Please select a part first."
        );

        return;

    }


    const name =
        activeObject.userData.name;


    const attached =
        activeObject.userData.attached;


    jarvisSpeak(

        `${name}. ` +
        (
            attached
            ? "The part is currently attached to the assembly."
            : "The part is currently detached and available for independent inspection."
        )

    );

}


/* =========================================================
   LIST PARTS
========================================================= */

function listParts(){

    if(objects.length===0){

        jarvisSpeak(
            "There are currently no parts in the workspace."
        );

        return;

    }


    const names =
        objects.map(
            obj =>
                obj.userData.name
        );


    jarvisSpeak(
        "The model contains " +
        names.join(", ") +
        "."
    );

}
