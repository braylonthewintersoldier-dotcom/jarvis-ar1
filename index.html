<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>JARVIS AR</title>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
<style>
html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,Helvetica,sans-serif;
}
#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}
#camera.front{
  transform:scaleX(-1);
}
#camera.back{
  transform:scaleX(1);
}
#threeCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:5;
  pointer-events:none;
}
#handCanvas{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  z-index:10;
  pointer-events:none;
}
#jarvisStatus{
  position:fixed;
  top:18px;
  left:50%;
  transform:translateX(-50%);
  z-index:100;
  padding:8px 18px;
  background:rgba(0,8,15,.65);
  border:1px solid rgba(0,234,255,.5);
  border-radius:20px;
  color:#00eaff;
  font-size:12px;
  letter-spacing:2px;
  backdrop-filter:blur(10px);
}
#listenDot{
  display:inline-block;
  width:8px;
  height:8px;
  margin-right:8px;
  border-radius:50%;
  background:#444;
}
#listenDot.listening{
  background:#00ffcc;
  box-shadow:
    0 0 8px #00ffcc,
    0 0 20px #00eaff;
  animation:pulse 1s infinite;
}
@keyframes pulse{
  0%,100%{
    transform:scale(.8);
    opacity:.5;
  }
  50%{
    transform:scale(1.2);
    opacity:1;
  }
}
#voiceText{
  position:fixed;
  left:50%;
  bottom:24px;
  transform:translateX(-50%);
  z-index:100;
  max-width:80%;
  padding:9px 18px;
  background:rgba(0,8,15,.65);
  border:1px solid rgba(0,234,255,.35);
  border-radius:20px;
  color:#00eaff;
  font-size:13px;
  text-align:center;
  backdrop-filter:blur(10px);
}
#cameraButton{
  position:fixed;
  right:18px;
  top:18px;
  z-index:110;
  padding:10px 15px;
  border:1px solid rgba(0,234,255,.6);
  border-radius:8px;
  background:rgba(0,8,15,.75);
  color:#00eaff;
  cursor:pointer;
}
#reticle{
  position:fixed;
  width:34px;
  height:34px;
  margin-left:-17px;
  margin-top:-17px;
  border:2px solid #00eaff;
  border-radius:50%;
  z-index:30;
  display:none;
  pointer-events:none;
  box-shadow:
    0 0 10px #00eaff,
    0 0 25px #00eaff;
}
#vignette{
  position:fixed;
  inset:0;
  z-index:18;
  pointer-events:none;
  box-shadow:
    inset 0 0 160px rgba(0,0,0,.7);
}
</style>
</head>
<body>
<video id="camera" autoplay muted playsinline></video>
<canvas id="handCanvas"></canvas>
<canvas id="threeCanvas"></canvas>
<div id="jarvisStatus">
  <span id="listenDot"></span>
  <span id="statusText">JARVIS READY</span>
</div>
<button id="cameraButton">
  SWITCH CAMERA
</button>
<div id="reticle"></div>
<div id="voiceText">
  Say "JARVIS"
</div>
<div id="vignette"></div>
<script>
/* =====================================================
   ELEMENTS
===================================================== */
const video =
  document.getElementById("camera");
const handCanvas =
  document.getElementById("handCanvas");
const handCtx =
  handCanvas.getContext("2d");
const threeCanvas =
  document.getElementById("threeCanvas");
const statusText =
  document.getElementById("statusText");
const listenDot =
  document.getElementById("listenDot");
const voiceText =
  document.getElementById("voiceText");
const reticle =
  document.getElementById("reticle");
const cameraButton =
  document.getElementById("cameraButton");
/* =====================================================
   CAMERA
===================================================== */
let usingFrontCamera=true;
let currentStream=null;
let cameraReady=false;
let processing=false;
async function startCamera(){
  cameraReady=false;
  if(currentStream){
    currentStream
      .getTracks()
      .forEach(
        track=>track.stop()
      );
  }
  try{
    const stream =
      await navigator.mediaDevices.getUserMedia({
        video:{
          facingMode:
            usingFrontCamera
            ?"user"
            :"environment",
          width:{ideal:1280},
          height:{ideal:720},
          frameRate:{ideal:30,max:30}
        },
        audio:false
      });
    currentStream=stream;
    video.srcObject=stream;
    video.classList.remove(
      "front",
      "back"
    );
    video.classList.add(
      usingFrontCamera
      ?"front"
      :"back"
    );
    await video.play();
    cameraReady=true;
    statusText.textContent=
      "JARVIS READY";
  }
  catch(error){
    console.error(error);
    statusText.textContent=
      "CAMERA ERROR";
  }
}
cameraButton.onclick=async()=>{
  usingFrontCamera=
    !usingFrontCamera;
  await startCamera();
};
/* =====================================================
   RESIZE
===================================================== */
function resize(){
  handCanvas.width=
    window.innerWidth;
  handCanvas.height=
    window.innerHeight;
}
resize();
window.addEventListener(
  "resize",
  resize
);
/* =====================================================
   SCREEN POSITION
===================================================== */
function screenPosition(point){
  const vw=video.videoWidth;
  const vh=video.videoHeight;
  const sw=window.innerWidth;
  const sh=window.innerHeight;
  if(!vw || !vh){
    return{
      x:sw/2,
      y:sh/2
    };
  }
  const videoRatio=vw/vh;
  const screenRatio=sw/sh;
  let width;
  let height;
  let offsetX=0;
  let offsetY=0;
  if(screenRatio>videoRatio){
    width=sw;
    height=sw/videoRatio;
    offsetY=(sh-height)/2;
  }
  else{
    height=sh;
    width=sh*videoRatio;
    offsetX=(sw-width)/2;
  }
  let x=
    point.x*width+
    offsetX;
  let y=
    point.y*height+
    offsetY;
  if(usingFrontCamera)
    x=sw-x;
  return{x,y};
}
/* =====================================================
   MEDIAPIPE
===================================================== */
const hands=
  new Hands({
    locateFile:
      file=>
      `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
hands.setOptions({
  maxNumHands:2,
  modelComplexity:1,
  minDetectionConfidence:.65,
  minTrackingConfidence:.65
});
/* =====================================================
   THREE
===================================================== */
const renderer=
  new THREE.WebGLRenderer({
    canvas:threeCanvas,
    alpha:true,
    antialias:true
  });
renderer.setPixelRatio(
  Math.min(
    window.devicePixelRatio,
    2
  )
);
renderer.setSize(
  window.innerWidth,
  window.innerHeight
);
const scene=
  new THREE.Scene();
const camera=
  new THREE.PerspectiveCamera(
    55,
    window.innerWidth/
    window.innerHeight,
    .1,
    100
  );
camera.position.z=8;
scene.add(
  new THREE.AmbientLight(
    0xffffff,
    1.5
  )
);
const pointLight=
  new THREE.PointLight(
    0x00eaff,
    5,
    20
  );
pointLight.position.set(
  0,
  2,
  4
);
scene.add(pointLight);
/* =====================================================
   OBJECTS
===================================================== */
const objects=[];
let activeObject=null;
/* =====================================================
   ORIGINAL CUBE SYSTEM
===================================================== */
const shapeNames=[
  "CUBE",
  "SPHERE",
  "PYRAMID",
  "TORUS",
  "CYLINDER",
  "STAR"
];
let nextShape=0;
/* =====================================================
   NEON MATERIAL
===================================================== */
function hologramMaterial(){
  const colors=[
    0x00eaff,
    0x00ffff,
    0x008cff,
    0xff00ff,
    0x7a00ff,
    0x00ffcc
  ];
  const color=
    colors[
      Math.floor(
        Math.random()*colors.length
      )
    ];
  return new THREE.MeshStandardMaterial({
    color:color,
    emissive:color,
    emissiveIntensity:2.5,
    transparent:true,
    opacity:.82,
    wireframe:true,
    metalness:.15,
    roughness:.25
  });
}
/* =====================================================
   CREATE ORIGINAL SHAPES
===================================================== */
function createShape(type){
  let geometry;
  if(type==="CUBE"){
    geometry=
      new THREE.BoxGeometry(
        1.4,1.4,1.4
      );
  }
  else if(type==="SPHERE"){
    geometry=
      new THREE.SphereGeometry(
        .8,32,32
      );
  }
  else if(type==="PYRAMID"){
    geometry=
      new THREE.ConeGeometry(
        .9,1.6,4
      );
  }
  else if(type==="TORUS"){
    geometry=
      new THREE.TorusGeometry(
        .65,.22,20,48
      );
  }
  else if(type==="CYLINDER"){
    geometry=
      new THREE.CylinderGeometry(
        .65,.65,1.5,32
      );
  }
  else{
    geometry=
      new THREE.IcosahedronGeometry(
        .9,1
      );
  }
  const mesh=
    new THREE.Mesh(
      geometry,
      hologramMaterial()
    );
  mesh.userData.type=type;
  /*
     NO GRAVITY.
  */
  mesh.userData.generated=false;
  scene.add(mesh);
  objects.push(mesh);
  activeObject=mesh;
  return mesh;
}
/* =====================================================
   LOAD REAL GENERATED MODEL
===================================================== */
const loader=
  new THREE.GLTFLoader();
function loadRealModel(url,prompt){
  statusText.textContent=
    "LOADING MODEL";
  voiceText.textContent=
    "JARVIS: Loading "+prompt;
  loader.load(
    url,
    gltf=>{
      const model=
        gltf.scene;
      /*
         Scale model to a useful AR size.
      */
      const box=
        new THREE.Box3()
          .setFromObject(model);
      const size=
        new THREE.Vector3();
      box.getSize(size);
      const largest=
        Math.max(
          size.x,
          size.y,
          size.z
        );
      if(largest>0){
        const targetSize=3;
        const scale=
          targetSize/largest;
        model.scale.setScalar(
          scale
        );
      }
      model.position.set(
        0,
        0,
        0
      );
      model.userData.type=
        prompt;
      model.userData.generated=
        true;
      scene.add(model);
      objects.push(model);
      activeObject=model;
      statusText.textContent=
        "MODEL READY";
      voiceText.textContent=
        "JARVIS: Model ready.";
    },
    progress=>{
      if(progress.total){
        const percent=
          Math.round(
            progress.loaded/
            progress.total*
            100
          );
        voiceText.textContent=
          "JARVIS: Loading "+percent+"%";
      }
    },
    error=>{
      console.error(error);
      statusText.textContent=
        "MODEL ERROR";
      voiceText.textContent=
        "JARVIS: I couldn't load that model.";
    }
  );
}
/* =====================================================
   GENERATE REAL MODEL
===================================================== */
async function generateModel(prompt){
  statusText.textContent=
    "GENERATING MODEL";
  voiceText.textContent=
    "JARVIS: Generating "+prompt;
  try{
    const response=
      await fetch(
        "/api/generate",
        {
          method:"POST",
          headers:{
            "Content-Type":
              "application/json"
          },
          body:JSON.stringify({
            prompt:prompt
          })
        }
      );
    const data=
      await response.json();
    if(!response.ok){
      throw new Error(
        data.error||
        "Generation failed"
      );
    }
    /*
       Backend waits for Meshy
       and returns the GLB URL.
    */
    loadRealModel(
      data.glb,
      prompt
    );
  }
  catch(error){
    console.error(error);
    statusText.textContent=
      "GENERATION ERROR";
    voiceText.textContent=
      "JARVIS: "+error.message;
    speak(
      "I wasn't able to generate that model."
    );
  }
}
/* =====================================================
   HAND → WORLD
===================================================== */
function handToWorld(x,y){
  const nx=
    (x/window.innerWidth)*2-1;
  const ny=
    -(y/window.innerHeight)*2+1;
  const vector=
    new THREE.Vector3(
      nx,ny,0
    );
  vector.unproject(camera);
  const direction=
    vector
      .sub(camera.position)
      .normalize();
  return camera.position
    .clone()
    .add(
      direction.multiplyScalar(6)
    );
}
/* =====================================================
   DISTANCE
===================================================== */
function distance2D(a,b){
  return Math.hypot(
    a.x-b.x,
    a.y-b.y
  );
}
/* =====================================================
   PINCH
===================================================== */
function isPinching(hand){
  return(
    distance2D(
      hand[4],
      hand[8]
    )<.055
  );
}
/* =====================================================
   WORLD → SCREEN
===================================================== */
function worldToScreen(position){
  const vector=
    position
      .clone()
      .project(camera);
  return{
    x:
      (vector.x+1)/2*
      window.innerWidth,
    y:
      (-vector.y+1)/2*
      window.innerHeight
  };
}
/* =====================================================
   FIND OBJECT
===================================================== */
function findObject(position){
  let closest=null;
  let closestDistance=Infinity;
  for(const obj of objects){
    const screen=
      worldToScreen(
        obj.position
      );
    const d=
      distance2D(
        position,
        screen
      );
    if(d<closestDistance){
      closestDistance=d;
      closest=obj;
    }
  }
  if(closestDistance<130)
    return closest;
  return null;
}
/* =====================================================
   GRAB VARIABLES
===================================================== */
let grabbing=false;
let grabOffset=
  new THREE.Vector3();
let previousFinger=null;
let grabVelocity=
  new THREE.Vector3();
let twoHand=false;
let twoStartDistance=1;
let twoStartScale=1;
let twoStartAngle=0;
let twoStartRotation=0;
let twoStartTilt=0;
/* =====================================================
   HAND RESULTS
===================================================== */
hands.onResults(results=>{
  if(!cameraReady)return;
  handCtx.clearRect(
    0,
    0,
    handCanvas.width,
    handCanvas.height
  );
  const detected=
    results.multiHandLandmarks||[];
  /*
     HAND VISUALS
  */
  for(const hand of detected){
    const points=
      hand.map(screenPosition);
    handCtx.strokeStyle=
      "#00eaff";
    handCtx.lineWidth=2;
    for(
      const connection
      of HAND_CONNECTIONS
    ){
      const a=
        points[connection[0]];
      const b=
        points[connection[1]];
      handCtx.beginPath();
      handCtx.moveTo(
        a.x,a.y
      );
      handCtx.lineTo(
        b.x,b.y
      );
      handCtx.stroke();
    }
    handCtx.fillStyle=
      "#00eaff";
    for(const p of points){
      handCtx.beginPath();
      handCtx.arc(
        p.x,
        p.y,
        3,
        0,
        Math.PI*2
      );
      handCtx.fill();
    }
  }
  const pinching=[];
  for(
    let i=0;
    i<detected.length;
    i++
  ){
    if(
      isPinching(
        detected[i]
      )
    ){
      pinching.push(i);
    }
  }
  /* =================================================
     TWO HAND
  ================================================= */
  if(pinching.length===2){
    const p1=
      screenPosition(
        detected[pinching[0]][8]
      );
    const p2=
      screenPosition(
        detected[pinching[1]][8]
      );
    const d=
      distance2D(p1,p2);
    const angle=
      Math.atan2(
        p2.y-p1.y,
        p2.x-p1.x
      );
    const centerX=
      (p1.x+p2.x)/2;
    const centerY=
      (p1.y+p2.y)/2;
    if(
      !twoHand &&
      activeObject
    ){
      twoHand=true;
      grabbing=true;
      twoStartDistance=
        Math.max(d,10);
      twoStartScale=
        activeObject.scale.x;
      twoStartAngle=
        angle;
      twoStartRotation=
        activeObject.rotation.z;
      twoStartTilt=
        activeObject.rotation.x;
    }
    if(activeObject){
      let scale=
        twoStartScale*
        d/
        twoStartDistance;
      scale=
        Math.max(
          .25,
          Math.min(
            5,
            scale
          )
        );
      activeObject.scale.setScalar(
        scale
      );
      activeObject.rotation.z=
        twoStartRotation+
        (
          angle-
          twoStartAngle
        );
      activeObject.rotation.x=
        twoStartTilt+
        (
          centerY-
          window.innerHeight/2
        )*.008;
      activeObject.position.copy(
        handToWorld(
          centerX,
          centerY
        )
      );
    }
    return;
  }
  twoHand=false;
  /* =================================================
     SINGLE PINCH
  ================================================= */
  if(pinching.length>0){
    const index=
      pinching[0];
    const fingertip=
      screenPosition(
        detected[index][8]
      );
    reticle.style.display=
      "block";
    reticle.style.left=
      fingertip.x+"px";
    reticle.style.top=
      fingertip.y+"px";
    /*
       CONTINUE MOVING
    */
    if(
      grabbing &&
      activeObject
    ){
      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );
      target.add(
        grabOffset
      );
      activeObject.position.lerp(
        target,
        .75
      );
      if(previousFinger){
        grabVelocity.set(
          fingertip.x-
          previousFinger.x,
          previousFinger.y-
          fingertip.y,
          0
        );
      }
      previousFinger=
        fingertip;
      return;
    }
    /*
       SELECT EXISTING
    */
    const found=
      findObject(
        fingertip
      );
    if(found){
      activeObject=found;
      grabbing=true;
      previousFinger=
        fingertip;
      const target=
        handToWorld(
          fingertip.x,
          fingertip.y
        );
      grabOffset=
        activeObject.position
          .clone()
          .sub(target);
      return;
    }
    /*
       ORIGINAL CUBE / SHAPE
    */
    const type=
      shapeNames[nextShape];
    nextShape=
      (nextShape+1)%
      shapeNames.length;
    activeObject=
      createShape(type);
    activeObject.position.copy(
      handToWorld(
        fingertip.x,
        fingertip.y
      )
    );
    grabbing=true;
    previousFinger=
      fingertip;
    grabOffset.set(0,0,0);
    return;
  }
  /* =================================================
     RELEASE
  ================================================= */
  if(grabbing){
    grabbing=false;
    previousFinger=null;
    grabVelocity.set(
      0,0,0
    );
  }
  reticle.style.display=
    "none";
});
/* =====================================================
   VOICE ASSISTANT
===================================================== */
const SpeechRecognition=
  window.SpeechRecognition||
  window.webkitSpeechRecognition;
let recognition=null;
let jarvisActive=false;
function speak(text){
  if(!("speechSynthesis" in window))
    return;
  speechSynthesis.cancel();
  const utterance=
    new SpeechSynthesisUtterance(
      text
    );
  utterance.rate=.95;
  utterance.pitch=.85;
  speechSynthesis.speak(
    utterance
  );
  voiceText.textContent=
    "JARVIS: "+text;
}
function setupVoice(){
  if(!SpeechRecognition){
    voiceText.textContent=
      "Voice recognition unavailable.";
    return;
  }
  recognition=
    new SpeechRecognition();
  recognition.continuous=true;
  recognition.interimResults=false;
  recognition.lang="en-US";
  recognition.onstart=()=>{
    listenDot.classList.add(
      "listening"
    );
    statusText.textContent=
      "LISTENING";
  };
  recognition.onend=()=>{
    listenDot.classList.remove(
      "listening"
    );
    statusText.textContent=
      "JARVIS READY";
    setTimeout(
      ()=>{
        try{
          recognition.start();
        }catch(e){}
      },
      400
    );
  };
  recognition.onerror=error=>{
    console.log(
      "Voice error:",
      error.error
    );
  };
  recognition.onresult=event=>{
    const result=
      event.results[
        event.results.length-1
      ];
    const text=
      result[0].transcript
        .trim()
        .toLowerCase();
    console.log(
      "JARVIS heard:",
      text
    );
    handleCommand(text);
  };
  try{
    recognition.start();
  }catch(e){}
}
/* =====================================================
   COMMANDS
===================================================== */
function handleCommand(text){
  /*
     WAKE WORD
  */
  if(text.includes("jarvis")){
    jarvisActive=true;
    speak(
      "Yes. How can I help?"
    );
    /*
       Also allow:
       "Jarvis create a car"
    */
    const command=
      text
        .replace("jarvis","")
        .trim();
    if(command)
      handleCommand(command);
    return;
  }
  if(!jarvisActive)
    return;
  /*
     CREATE REAL MODEL
  */
  const createWords=[
    "create",
    "make",
    "build",
    "generate",
    "show me"
  ];
  const wantsModel=
    createWords.some(
      word=>text.includes(word)
    );
  if(wantsModel){
    const cleaned=
      text
        .replace(
          /create|make|build|generate|show me/gi,
          ""
        )
        .trim();
    if(cleaned.length>2){
      speak(
        "I'll generate that model."
      );
      generateModel(
        cleaned+
        ", realistic detailed 3D model, accurate proportions, high detail, physically believable materials"
      );
      return;
    }
  }
  /*
     BASIC CUBE
  */
  if(text.includes("cube")){
    createShape("CUBE");
    speak(
      "Creating a cube."
    );
    return;
  }
  /*
     DELETE
  */
  if(
    text.includes("delete")||
    text.includes("remove it")
  ){
    if(activeObject){
      scene.remove(
        activeObject
      );
      const index=
        objects.indexOf(
          activeObject
        );
      if(index>-1)
        objects.splice(
          index,
          1
        );
      activeObject=null;
      speak(
        "Removed."
      );
    }
    return;
  }
  /*
     CLEAR
  */
  if(
    text.includes("clear everything")||
    text.includes("remove everything")
  ){
    for(
      const object
      of objects
    ){
      scene.remove(
        object
      );
    }
    objects.length=0;
    activeObject=null;
    speak(
      "Everything has been cleared."
    );
    return;
  }
  /*
     HELP
  */
  if(
    text.includes("help")||
    text.includes("what can you do")
  ){
    speak(
      "I can generate 3D models from your instructions and manipulate them with your hands."
    );
    return;
  }
  speak(
    "Tell me what you want me to build."
  );
}
/* =====================================================
   PARTICLES
===================================================== */
const particleGeometry=
  new THREE.BufferGeometry();
const particleCount=500;
const positions=
  new Float32Array(
    particleCount*3
  );
for(
  let i=0;
  i<particleCount;
  i++
){
  positions[i*3]=
    (Math.random()-.5)*16;
  positions[i*3+1]=
    (Math.random()-.5)*10;
  positions[i*3+2]=
    (Math.random()-.5)*8;
}
particleGeometry.setAttribute(
  "position",
  new THREE.BufferAttribute(
    positions,
    3
  )
);
const particleMaterial=
  new THREE.PointsMaterial({
    color:0x00eaff,
    size:.025,
    transparent:true,
    opacity:.45
  });
const particles=
  new THREE.Points(
    particleGeometry,
    particleMaterial
  );
scene.add(particles);
/* =====================================================
   ANIMATION
===================================================== */
function animate(){
  requestAnimationFrame(
    animate
  );
  particles.rotation.y+=
    .0005;
  for(
    const object
    of objects
  ){
    /*
       Preserve generated-model materials.
       Only pulse the original neon meshes.
    */
    if(
      object.material &&
      object.material.emissive
    ){
      object.material.emissiveIntensity=
        object===activeObject
        ?
        2.8+
        Math.sin(
          performance.now()*.004
        )*.8
        :
        2.2;
    }
  }
  renderer.render(
    scene,
    camera
  );
}
animate();
/* =====================================================
   TRACKING LOOP
===================================================== */
async function trackingLoop(){
  if(
    cameraReady &&
    video.readyState>=2 &&
    !processing
  ){
    processing=true;
    try{
      await hands.send({
        image:video
      });
    }
    catch(error){
      console.log(error);
    }
    processing=false;
  }
  requestAnimationFrame(
    trackingLoop
  );
}
/* =====================================================
   THREE RESIZE
===================================================== */
window.addEventListener(
  "resize",
  ()=>{
    camera.aspect=
      window.innerWidth/
      window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(
      window.innerWidth,
      window.innerHeight
    );
  }
);
/* =====================================================
   BOOT
===================================================== */
async function boot(){
  await startCamera();
  setupVoice();
  trackingLoop();
}
boot();
</script>
