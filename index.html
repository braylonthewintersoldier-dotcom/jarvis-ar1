<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

<script type="module">
  import { FilesetResolver, HandLandmarker } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #camera {
      width: 100%;
      height: 100%;
      object-fit: cover;
      position: fixed;
      inset: 0;
    }

    #canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    #hud {
      position: fixed;
      top: 20px;
      left: 20px;
      color: white;
      background: rgba(0,0,0,.55);
      padding: 12px;
      border-radius: 10px;
      z-index: 5;
    }
  </style>
</head>

<body>

  <video id="camera" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <div id="hud">
    <div>JARVIS AR</div>
    <div id="status">Starting hand tracking...</div>
  </div>

  <script>
    const video = document.getElementById("camera");
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const status = document.getElementById("status");

    async function start() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          video: {
            facingMode: "user",
            width: { ideal: 1280 },
            height: { ideal: 720 }
          },
          audio: false
        });

        video.srcObject = stream;

        await new Promise(resolve => {
          video.onloadedmetadata = resolve;
        });

        canvas.width = video.videoWidth;
        canvas.height = video.videoHeight;

        status.textContent = "Camera working — loading hand tracking...";

        const vision = await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
        );

        const handLandmarker = await HandLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
            },
            runningMode: "VIDEO",
            numHands: 2
          }
        );

        status.textContent = "HAND TRACKING ACTIVE ✓";

        function track() {
          ctx.clearRect(0, 0, canvas.width, canvas.height);

          const results = handLandmarker.detectForVideo(
            video,
            performance.now()
          );

          if (results.landmarks) {
            for (const hand of results.landmarks) {

              for (const point of hand) {
                const x = point.x * canvas.width;
                const y = point.y * canvas.height;

                ctx.beginPath();
                ctx.arc(x, y, 7, 0, Math.PI * 2);
                ctx.fillStyle = "#00ffff";
                ctx.fill();
              }
            }
          }

          requestAnimationFrame(track);
        }

        track();

      } catch (error) {
        console.error(error);
        status.textContent = "Error: " + error.message;
      }
    }

    start();
  </script>

</body>
</html>
</script>
