<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  transform:scaleX(-1);
  z-index:1;
}

#output{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:2;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:50;
  color:#00eaff;
  background:rgba(0,0,0,.75);
  border:1px solid #00eaff;
  border-radius:10px;
  padding:12px 16px;
  line-height:1.5;
  font-size:15px;
}

#cube-container{
  position:fixed;
  left:50%;
  top:50%;
  width:0;
  height:0;
  display:none;
  z-index:10;
  perspective:900px;
  transform-style:preserve-3d;
  pointer-events:none;
}

#cube{
  position:absolute;
  width:120px;
  height:120px;
  left:-60px;
  top:-60px;
  transform-style:preserve-3d;
  will-change:transform;
}

.face{
  position:absolute;
  width:120px;
  height:120px;
  box-sizing:border-box;
  border:3px solid #00eaff;
  background:rgba(0,220,255,.18);

  box-shadow:
    inset 0 0 25px rgba(0,240,255,.7),
    0 0 15px rgba(0,240,255,.8);

  backface-visibility:visible;
}

.front{transform:translateZ(60px);}
.back{transform:rotateY(180deg) translateZ(60px);}
.right{transform:rotateY(90deg) translateZ(60px);}
.left{transform:rotateY(-90deg) translateZ(60px);}
.top{transform:rotateX(90deg) translateZ(60px);}
.bottom{transform:rotateX(-90deg) translateZ(60px);}

#centerDot{
  position:fixed;
  width:7px;
  height:7px;
  margin-left:-3.5px;
  margin-top:-3.5px;
  border-radius:50%;
  background:#00eaff;
  box-shadow:0 0 12px #00eaff;
  display:none;
  z-index:15;
}

#grabRing{
  position:fixed;
  width:30px;
  height:30px;
  margin-left:-15px;
  margin-top:-15px;
  border:2px solid #00eaff;
  border-radius:50%;
  display:none;
  z-index:14;
  pointer-events:none;
  box-shadow:0 0 12px #00eaff;
}

</style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>

<div id="hud">

<b>JARVIS AR</b>

<div id="status">Starting camera...</div>

<div id="hands">Hands: 0</div>

<div id="mode">Mode: STANDBY</div>

</div>

<div id="grabRing"></div>

<div id="centerDot"></div>

<div id="cube-container">

<div id="cube">

<div class="face front"></div>
<div class="face back"></div>
<div class="face right"></div>
<div class="face left"></div>
<div class="face top"></div>
<div class="face bottom"></div>

</div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("output");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const handsText =
document.getElementById("hands");

const modeText =
document.getElementById("mode");

const cubeContainer =
document.getElementById("cube-container");

const cube =
document.getElementById("cube");

const centerDot =
document.getElementById("centerDot");

const grabRing =
document.getElementById("grabRing");


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* =====================================================
   SCREEN POSITION
===================================================== */

function screenPosition(point){

const vw =
video.videoWidth;

const vh =
video.videoHeight;

const sw =
window.innerWidth;

const sh =
window.innerHeight;

if(!vw || !vh){

return{
x:sw/2,
y:sh/2
};

}

const videoRatio =
vw/vh;

const screenRatio =
sw/sh;

let width;
let height;

let offsetX=0;
let offsetY=0;

if(screenRatio>videoRatio){

width=sw;

height=
sw/videoRatio;

offsetY=
(sh-height)/2;

}else{

height=sh;

width=
sh*videoRatio;

offsetX=
(sw-width)/2;

}

let x =
point.x*width+
offsetX;

let y =
point.y*height+
offsetY;

x =
sw-x;

return{
x:x,
y:y
};

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
new Hands({

locateFile:(file)=>{

return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});

hands.setOptions({

maxNumHands:2,

modelComplexity:1,

minDetectionConfidence:.60,

minTrackingConfidence:.60

});


/* =====================================================
   CUBE
===================================================== */

let cubeExists=false;

let cubeX=
window.innerWidth/2;

let cubeY=
window.innerHeight/2;

let rotX=-20;

let rotY=30;

let rotZ=0;

let cubeScale=1;


/* =====================================================
   PHYSICS
===================================================== */

let velocityX=0;

let velocityY=0;


/* =====================================================
   GRAB
===================================================== */

let grabbed=false;

let grabbingHand=null;

let grabOffsetX=0;

let grabOffsetY=0;


/* =====================================================
   TWO HAND
===================================================== */

let twoHandMode=false;

let twoHandStartDistance=0;

let twoHandStartScale=1;

let twoHandStartAngle=0;

let twoHandStartRotZ=0;

let twoHandStartY=0;

let twoHandStartRotX=0;


/* =====================================================
   HAND IDENTITY
===================================================== */

function getHandLabel(
results,
index
){

if(
results.multiHandedness &&
results.multiHandedness[index]
){

return results
.multiHandedness[index]
.label;

}

return "Unknown";

}


/* =====================================================
   PINCH
===================================================== */

function isPinching(hand){

const thumb=hand[4];

const index=hand[8];

const d=
Math.hypot(
thumb.x-index.x,
thumb.y-index.y
);

return d<.070;

}


/* =====================================================
   DISTANCE
===================================================== */

function getDistance(a,b){

return Math.hypot(
a.x-b.x,
a.y-b.y
);

}


/* =====================================================
   ANGLE
===================================================== */

function getAngle(a,b){

return Math.atan2(
b.y-a.y,
b.x-a.x
);

}


/* =====================================================
   UPDATE CUBE
===================================================== */

function updateCube(){

cubeContainer.style.left=
cubeX+"px";

cubeContainer.style.top=
cubeY+"px";

cube.style.transform=
`
scale(${cubeScale})
rotateX(${rotX}deg)
rotateY(${rotY}deg)
rotateZ(${rotZ}deg)
`;

cubeContainer.style.display=
"block";

centerDot.style.display=
"block";

centerDot.style.left=
cubeX+"px";

centerDot.style.top=
cubeY+"px";

}


/* =====================================================
   GRAB RING
===================================================== */

function showGrabRing(x,y){

grabRing.style.display=
"block";

grabRing.style.left=
x+"px";

grabRing.style.top=
y+"px";

}

function hideGrabRing(){

grabRing.style.display=
"none";

}


/* =====================================================
   RESULTS
===================================================== */

hands.onResults((results)=>{

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const detected=
results.multiHandLandmarks || [];


handsText.textContent=
"Hands: "+
detected.length;


/* =====================================================
   DRAW HANDS
===================================================== */

for(
let i=0;
i<detected.length;
i++
){

const hand=
detected[i];

const points=
hand.map(screenPosition);


ctx.strokeStyle=
"#00eaff";

ctx.lineWidth=2.5;


for(
const connection
of HAND_CONNECTIONS
){

const a=
points[connection[0]];

const b=
points[connection[1]];


ctx.beginPath();

ctx.moveTo(
a.x,
a.y
);

ctx.lineTo(
b.x,
b.y
);

ctx.stroke();

}


ctx.fillStyle=
"#00eaff";


for(
const p of points
){

ctx.beginPath();

ctx.arc(
p.x,
p.y,
4,
0,
Math.PI*2
);

ctx.fill();

}

}


/* =====================================================
   FIND PINCHING HANDS
===================================================== */

let pinching=[];


for(
let i=0;
i<detected.length;
i++
){

if(
isPinching(
detected[i]
)
){

pinching.push({

index:i,

label:getHandLabel(
results,
i
)

});

}

}


/* =====================================================
   TWO HAND GRAB
===================================================== */

if(
cubeExists &&
pinching.length===2
){

const handA=
detected[
pinching[0].index
];

const handB=
detected[
pinching[1].index
];


const p1=
screenPosition(
handA[8]
);

const p2=
screenPosition(
handB[8]
);


const d=
getDistance(
p1,
p2
);

const a=
getAngle(
p1,
p2
);


const averageX=
(p1.x+p2.x)/2;

const averageY=
(p1.y+p2.y)/2;


if(!twoHandMode){

twoHandMode=true;

grabbed=true;

twoHandStartDistance=d;

twoHandStartScale=
cubeScale;

twoHandStartAngle=a;

twoHandStartRotZ=
rotZ;

twoHandStartY=
averageY;

twoHandStartRotX=
rotX;

}


/* SCALE */

if(
twoHandStartDistance>5
){

let targetScale=
twoHandStartScale*
(
d/
twoHandStartDistance
);

targetScale=
Math.max(
.45,
Math.min(
3.5,
targetScale
)
);

cubeScale +=
(
targetScale-
cubeScale
)*.25;

}


/* TWIST */

let angleDifference=
(
a-
twoHandStartAngle
)*
180/Math.PI;


while(
angleDifference>180
){

angleDifference-=360;

}

while(
angleDifference<-180
){

angleDifference+=360;

}


rotZ +=
(
twoHandStartRotZ+
angleDifference-
rotZ
)*.25;


/* FORWARD / BACKWARD TILT */

let vertical=
averageY-
twoHandStartY;


let targetRotX=
twoHandStartRotX+
vertical*.85;


targetRotX=
Math.max(
-80,
Math.min(
80,
targetRotX
)
);


rotX +=
(
targetRotX-
rotX
)*.25;


/* MOVE */

cubeX=
averageX;

cubeY=
averageY;

velocityX=0;
velocityY=0;


modeText.textContent=
"Mode: TWO-HAND";

status.textContent=
"MOVE • TWIST • TILT • RESIZE";


updateCube();

return;

}


/* =====================================================
   EXIT TWO HAND
===================================================== */

if(twoHandMode){

twoHandMode=false;

}


/* =====================================================
   CURRENT GRAB
===================================================== */

if(
grabbed &&
grabbingHand
){

let activeIndex=-1;


/*
 Find the SAME physical hand
 using its Left/Right identity.
*/

for(
let i=0;
i<detected.length;
i++
){

const label=
getHandLabel(
results,
i
);

if(
label===
grabbingHand
){

activeIndex=i;

break;

}

}


/* =================================================
   HAND STILL THERE
================================================= */

if(
activeIndex>=0
){

const hand=
detected[
activeIndex
];


if(
isPinching(hand)
){

const fingertip=
screenPosition(
hand[8]
);


/*
 DIRECT ATTACHMENT

 The cube follows the fingertip
 without lag.
*/

cubeX=
fingertip.x+
grabOffsetX;

cubeY=
fingertip.y+
grabOffsetY;


/*
 Velocity is reset while holding.
*/

velocityX=0;

velocityY=0;


showGrabRing(
fingertip.x,
fingertip.y
);


modeText.textContent=
"Mode: GRABBED "+
grabbingHand;

status.textContent=
"CUBE IN HAND 🤏";


updateCube();

return;

}

}


/* =================================================
   HAND RELEASED
================================================= */

grabbed=false;

grabbingHand=null;

hideGrabRing();


modeText.textContent=
"Mode: PLACED";

status.textContent=
"CUBE RELEASED";


return;

}


/* =====================================================
   GRAB EXISTING CUBE
===================================================== */

if(
cubeExists &&
pinching.length>0
){

let closest=null;

let closestDistance=
Infinity;


for(
const p of pinching
){

const fingertip=
screenPosition(
detected[p.index][8]
);

const d=
Math.hypot(
fingertip.x-cubeX,
fingertip.y-cubeY
);

if(
d<closestDistance
){

closestDistance=d;

closest=p;

}

}


if(
closest &&
closestDistance<
100*cubeScale
){

const fingertip=
screenPosition(
detected[
closest.index
][8]
);


/*
 Store the actual LEFT/RIGHT
 hand identity.
*/

grabbingHand=
closest.label;

grabbed=true;


grabOffsetX=
cubeX-
fingertip.x;

grabOffsetY=
cubeY-
fingertip.y;


velocityX=0;
velocityY=0;


showGrabRing(
fingertip.x,
fingertip.y
);


modeText.textContent=
"Mode: GRABBED "+
grabbingHand;

status.textContent=
"CUBE GRABBED 🤏";


updateCube();

return;

}

}


/* =====================================================
   CREATE FIRST CUBE
===================================================== */

if(
!cubeExists &&
pinching.length>0
){

const first=
pinching[0];

const fingertip=
screenPosition(
detected[
first.index
][8]
);


cubeX=
fingertip.x;

cubeY=
fingertip.y;


cubeScale=1;

rotX=-20;

rotY=30;

rotZ=0;


velocityX=0;

velocityY=0;


cubeExists=true;

grabbed=true;

grabbingHand=
first.label;

grabOffsetX=0;

grabOffsetY=0;


showGrabRing(
fingertip.x,
fingertip.y
);


modeText.textContent=
"Mode: GRABBED "+
grabbingHand;

status.textContent=
"CUBE CREATED 🤏";


updateCube();

return;

}


/* =====================================================
   RELEASE PHYSICS
===================================================== */

if(
cubeExists &&
!grabbed
){

cubeX +=
velocityX;

cubeY +=
velocityY;


velocityX *=
.90;

velocityY *=
.90;


updateCube();


modeText.textContent=
"Mode: PLACED";

status.textContent=
"PINCH CUBE TO GRAB";

}else if(
!cubeExists
){

status.textContent=
detected.length
?
"PINCH TO CREATE CUBE"
:
"SHOW YOUR HANDS";

}

});


/* =====================================================
   CAMERA
===================================================== */

async function startCamera(){

try{

status.textContent=
"Requesting camera...";


const stream=
await navigator.mediaDevices
.getUserMedia({

video:{

facingMode:"user",

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

},

audio:false

});


video.srcObject=
stream;


await video.play();


status.textContent=
"Starting hand tracking...";


const camera=
new Camera(
video,
{

onFrame:
async()=>{

await hands.send({
image:video
});

},

width:1280,

height:720

}
);


camera.start();


}catch(error){

console.error(error);

status.textContent=
"Camera error: "+
error.message;

}

}


/* =====================================================
   START
===================================================== */

startCamera();

</script>

</body>
</html>
```
