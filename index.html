<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JARVIS AR</title>

  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;
      font-family: Arial, sans-serif;
    }

    #camera {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
    }

    #output {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 2;
    }

    #hud {
      position: fixed;
      top: 15px;
      left: 15px;
      color: white;
      background: rgba(0,0,0,.7);
      padding: 12px;
      border-radius: 10px;
      z-index: 20;
    }

    /* 3D CUBE */

    #cube-container {
      position: fixed;

      width: 90px;
      height: 90px;

      display: none;

      z-index: 10;

      pointer-events: none;

      transform:
        translate(-50%, -50%);

      perspective: 600px;
      transform-style: preserve-3d;
    }

    #cube {
      width: 90px;
      height: 90px;

      position: absolute;

      transform-style: preserve-3d;

      animation:
        rotateCube 2s linear infinite;
    }

    .face {
      position: absolute;

      width: 90px;
      height: 90px;

      box-sizing: border-box;

      border: 2px solid cyan;

      background:
        rgba(0,220,255,.22);

      box-shadow:
        inset 0 0 20px cyan,
        0 0 15px cyan;
    }

    .front {
      transform:
        translateZ(45px);
    }

    .back {
      transform:
        rotateY(180deg)
        translateZ(45px);
    }

    .right {
      transform:
        rotateY(90deg)
        translateZ(45px);
    }

    .left {
      transform:
        rotateY(-90deg)
        translateZ(45px);
    }

    .top {
      transform:
        rotateX(90deg)
        translateZ(45px);
    }

    .bottom {
      transform:
        rotateX(-90deg)
        translateZ(45px);
    }

    @keyframes rotateCube {

      from {
        transform:
          rotateX(0deg)
          rotateY(0deg);
      }

      to {
        transform:
          rotateX(360deg)
          rotateY(360deg);
      }

    }
  </style>
</head>

<body>

<video id="camera" autoplay playsinline></video>

<canvas id="output"></canvas>

<div id="hud">
  <b>JARVIS AR</b>
  <div id="status">Starting camera...</div>
  <div id="hands">Hands: 0</div>
</div>


<div id="cube-container">

  <div id="cube">

    <div class="face front"></div>
    <div class="face back"></div>
    <div class="face right"></div>
    <div class="face left"></div>
    <div class="face top"></div>
    <div class="face bottom"></div>

  </div>

</div>


<script>

const video =
  document.getElementById("camera");

const canvas =
  document.getElementById("output");

const ctx =
  canvas.getContext("2d");

const status =
  document.getElementById("status");

const handsDisplay =
  document.getElementById("hands");

const cubeContainer =
  document.getElementById("cube-container");


/* =================================
   CANVAS
================================= */

function resizeCanvas() {

  canvas.width =
    window.innerWidth;

  canvas.height =
    window.innerHeight;

}

resizeCanvas();

window.addEventListener(
  "resize",
  resizeCanvas
);


/* =================================
   CAMERA → SCREEN
================================= */

function screenPosition(point) {

  const vw =
    video.videoWidth;

  const vh =
    video.videoHeight;

  const sw =
    window.innerWidth;

  const sh =
    window.innerHeight;


  if (!vw || !vh) {

    return {
      x: sw / 2,
      y: sh / 2
    };

  }


  const videoRatio =
    vw / vh;

  const screenRatio =
    sw / sh;


  let displayWidth;
  let displayHeight;

  let offsetX = 0;
  let offsetY = 0;


  if (
    screenRatio >
    videoRatio
  ) {

    displayWidth =
      sw;

    displayHeight =
      sw / videoRatio;

    offsetY =
      (sh -
       displayHeight) / 2;

  }

  else {

    displayHeight =
      sh;

    displayWidth =
      sh * videoRatio;

    offsetX =
      (sw -
       displayWidth) / 2;

  }


  let x =
    point.x *
    displayWidth +
    offsetX;


  let y =
    point.y *
    displayHeight +
    offsetY;


  /*
    Mirror the front camera.
  */

  x =
    sw - x;


  return {
    x,
    y
  };

}


/* =================================
   MEDIAPIPE
================================= */

const hands =
  new Hands({

    locateFile:
      (file) => {

        return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

      }

  });


hands.setOptions({

  maxNumHands: 2,

  modelComplexity: 1,

  minDetectionConfidence: 0.65,

  minTrackingConfidence: 0.65

});


/* =================================
   CUBE SMOOTHING
================================= */

let cubeX =
  window.innerWidth / 2;

let cubeY =
  window.innerHeight / 2;

const smoothing =
  0.45;


/* =================================
   HAND RESULTS
================================= */

hands.onResults(
  (results) => {

    ctx.clearRect(
      0,
      0,
      canvas.width,
      canvas.height
    );


    const detectedHands =
      results.multiHandLandmarks || [];


    handsDisplay.textContent =
      "Hands: " +
      detectedHands.length;


    if (
      detectedHands.length === 0
    ) {

      status.textContent =
        "Show your hands";

      cubeContainer.style.display =
        "none";

      return;

    }


    status.textContent =
      "HAND TRACKING ACTIVE ✓";


    let pinchingHand =
      null;


    /*
      DRAW BOTH HANDS
    */

    for (
      const hand of detectedHands
    ) {

      const points =
        hand.map(
          screenPosition
        );


      /*
        Connections
      */

      ctx.strokeStyle =
        "cyan";

      ctx.lineWidth = 3;


      for (
        const connection
        of HAND_CONNECTIONS
      ) {

        const start =
          points[
            connection[0]
          ];

        const end =
          points[
            connection[1]
          ];


        ctx.beginPath();

        ctx.moveTo(
          start.x,
          start.y
        );

        ctx.lineTo(
          end.x,
          end.y
        );

        ctx.stroke();

      }


      /*
        Finger dots
      */

      ctx.fillStyle =
        "cyan";


      for (
        const point
        of points
      ) {

        ctx.beginPath();

        ctx.arc(
          point.x,
          point.y,
          5,
          0,
          Math.PI * 2
        );

        ctx.fill();

      }


      /*
        Check this hand
        for a pinch.
      */

      const thumb =
        hand[4];

      const index =
        hand[8];


      const distance =
        Math.hypot(
          thumb.x - index.x,
          thumb.y - index.y
        );


      if (
        distance < 0.065
      ) {

        pinchingHand =
          hand;

      }

    }


    /* =================================
       PINCHING HAND CONTROLS CUBE
    ================================= */

    if (pinchingHand) {

      status.textContent =
        "PINCH — CUBE GRABBED 🤏";


      const index =
        pinchingHand[8];


      const target =
        screenPosition(
          index
        );


      /*
        Smooth movement
      */

      cubeX +=
        (target.x - cubeX) *
        smoothing;

      cubeY +=
        (target.y - cubeY) *
        smoothing;


      /*
        Center cube exactly
        on fingertip.
      */

      cubeContainer.style.left =
        cubeX + "px";

      cubeContainer.style.top =
        cubeY + "px";


      cubeContainer.style.display =
        "block";

    }

    else {

      cubeContainer.style.display =
        "none";

    }

  }
);


/* =================================
   START CAMERA
================================= */

async function startCamera() {

  try {

    status.textContent =
      "Requesting camera...";


    const stream =
      await navigator.mediaDevices
      .getUserMedia({

        video: {

          facingMode: "user",

          width: {
            ideal: 1280
          },

          height: {
            ideal: 720
          }

        },

        audio: false

      });


    video.srcObject =
      stream;


    await video.play();


    status.textContent =
      "Starting hand tracking...";


    const camera =
      new Camera(
        video,
        {

          onFrame:
            async () => {

              await hands.send({
                image: video
              });

            },

          width: 1280,

          height: 720

        }
      );


    camera.start();


  }

  catch (error) {

    console.error(error);

    status.textContent =
      "Camera error: " +
      error.message;

  }

}


startCamera();

</script>

</body>
</html>
