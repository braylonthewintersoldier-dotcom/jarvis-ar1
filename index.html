```html
<!DOCTYPE html>
<html>
<head>

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>JARVIS AR</title>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  overflow:hidden;
  background:#000;
  font-family:Arial,sans-serif;
}

#camera{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  z-index:1;
}

/* Front camera is mirrored.
   JavaScript turns this on/off automatically. */

#camera.front-camera{
  transform:scaleX(-1);
}

#camera.back-camera{
  transform:scaleX(1);
}

#output{
  position:fixed;
  inset:0;
  width:100%;
  height:100%;
  pointer-events:none;
  z-index:2;
}

#hud{
  position:fixed;
  top:15px;
  left:15px;
  z-index:50;
  color:#00eaff;
  background:rgba(0,0,0,.78);
  border:1px solid #00eaff;
  border-radius:10px;
  padding:12px 16px;
  line-height:1.5;
  font-size:15px;
}

#cameraButton{
  position:fixed;
  top:15px;
  right:15px;
  z-index:60;

  padding:12px 16px;

  color:#00eaff;
  background:rgba(0,0,0,.78);

  border:1px solid #00eaff;
  border-radius:10px;

  font-size:15px;
  font-weight:bold;

  cursor:pointer;
}

#cameraButton:active{
  transform:scale(.95);
}

#cube-container{
  position:fixed;
  left:50%;
  top:50%;

  width:0;
  height:0;

  display:none;

  z-index:10;

  perspective:900px;
  transform-style:preserve-3d;

  pointer-events:none;
}

#cube{
  position:absolute;

  width:120px;
  height:120px;

  left:-60px;
  top:-60px;

  transform-style:preserve-3d;

  will-change:transform;
}

.face{
  position:absolute;

  width:120px;
  height:120px;

  box-sizing:border-box;

  border:3px solid #00eaff;

  background:rgba(0,220,255,.18);

  box-shadow:
    inset 0 0 25px rgba(0,240,255,.7),
    0 0 15px rgba(0,240,255,.8);

  backface-visibility:visible;
}

.front{
  transform:translateZ(60px);
}

.back{
  transform:
    rotateY(180deg)
    translateZ(60px);
}

.right{
  transform:
    rotateY(90deg)
    translateZ(60px);
}

.left{
  transform:
    rotateY(-90deg)
    translateZ(60px);
}

.top{
  transform:
    rotateX(90deg)
    translateZ(60px);
}

.bottom{
  transform:
    rotateX(-90deg)
    translateZ(60px);
}

#centerDot{
  position:fixed;

  width:7px;
  height:7px;

  margin-left:-3.5px;
  margin-top:-3.5px;

  border-radius:50%;

  background:#00eaff;

  box-shadow:0 0 12px #00eaff;

  display:none;

  z-index:15;
}

#grabRing{
  position:fixed;

  width:30px;
  height:30px;

  margin-left:-15px;
  margin-top:-15px;

  border:2px solid #00eaff;

  border-radius:50%;

  display:none;

  z-index:14;

  pointer-events:none;

  box-shadow:0 0 12px #00eaff;
}

</style>
</head>

<body>

<video
  id="camera"
  autoplay
  playsinline>
</video>

<canvas id="output"></canvas>


<div id="hud">

<b>JARVIS AR</b>

<div id="status">
Starting camera...
</div>

<div id="hands">
Hands: 0
</div>

<div id="mode">
Mode: STANDBY
</div>

<div id="cameraMode">
Camera: FRONT
</div>

</div>


<button id="cameraButton">
SWITCH CAMERA
</button>


<div id="grabRing"></div>

<div id="centerDot"></div>


<div id="cube-container">

<div id="cube">

<div class="face front"></div>
<div class="face back"></div>
<div class="face right"></div>
<div class="face left"></div>
<div class="face top"></div>
<div class="face bottom"></div>

</div>

</div>


<script>

/* =====================================================
   ELEMENTS
===================================================== */

const video =
document.getElementById("camera");

const canvas =
document.getElementById("output");

const ctx =
canvas.getContext("2d");

const status =
document.getElementById("status");

const handsText =
document.getElementById("hands");

const modeText =
document.getElementById("mode");

const cameraModeText =
document.getElementById("cameraMode");

const cameraButton =
document.getElementById("cameraButton");

const cubeContainer =
document.getElementById("cube-container");

const cube =
document.getElementById("cube");

const centerDot =
document.getElementById("centerDot");

const grabRing =
document.getElementById("grabRing");


/* =====================================================
   CAMERA STATE
===================================================== */

let usingFrontCamera = true;

let currentStream = null;

let cameraController = null;


/* =====================================================
   CANVAS
===================================================== */

function resizeCanvas(){

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

}

resizeCanvas();

window.addEventListener(
"resize",
resizeCanvas
);


/* =====================================================
   CAMERA → SCREEN
===================================================== */

function screenPosition(point){

const vw =
video.videoWidth;

const vh =
video.videoHeight;

const sw =
window.innerWidth;

const sh =
window.innerHeight;


if(!vw || !vh){

return{
x:sw/2,
y:sh/2
};

}


const videoRatio =
vw/vh;

const screenRatio =
sw/sh;


let width;
let height;

let offsetX=0;
let offsetY=0;


if(screenRatio>videoRatio){

width=sw;

height=
sw/videoRatio;

offsetY=
(sh-height)/2;

}else{

height=sh;

width=
sh*videoRatio;

offsetX=
(sw-width)/2;

}


let x =
point.x*width+
offsetX;

let y =
point.y*height+
offsetY;


/*
  MediaPipe coordinates are based
  on the unmirrored video.

  Front camera:
  mirror X to match the screen.

  Back camera:
  do NOT mirror.
*/

if(usingFrontCamera){

x =
sw-x;

}


return{
x:x,
y:y
};

}


/* =====================================================
   MEDIAPIPE
===================================================== */

const hands =
new Hands({

locateFile:(file)=>{

return `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`;

}

});


hands.setOptions({

maxNumHands:2,

modelComplexity:1,

minDetectionConfidence:.65,

minTrackingConfidence:.65

});


/* =====================================================
   CUBE STATE
===================================================== */

let cubeExists=false;

let cubeX=
window.innerWidth/2;

let cubeY=
window.innerHeight/2;

let rotX=-20;

let rotY=30;

let rotZ=0;

let cubeScale=1;


/* =====================================================
   PHYSICS
===================================================== */

let velocityX=0;

let velocityY=0;


/* =====================================================
   GRAB STATE
===================================================== */

let grabbed=false;

let grabX=0;

let grabY=0;

let grabOffsetX=0;

let grabOffsetY=0;


/* =====================================================
   TWO HAND STATE
===================================================== */

let twoHandMode=false;

let twoStartDistance=0;

let twoStartScale=1;

let twoStartAngle=0;

let twoStartRotZ=0;

let twoStartAverageY=0;

let twoStartRotX=0;


/* =====================================================
   PINCH
===================================================== */

function pinchDistance(hand){

const thumb=
hand[4];

const index=
hand[8];

return Math.hypot(
thumb.x-index.x,
thumb.y-index.y
);

}


function isPinching(hand){

return pinchDistance(hand)<.055;

}


/* =====================================================
   UPDATE CUBE
===================================================== */

function updateCube(){

cubeContainer.style.left=
cubeX+"px";

cubeContainer.style.top=
cubeY+"px";


cube.style.transform=
`
scale(${cubeScale})
rotateX(${rotX}deg)
rotateY(${rotY}deg)
rotateZ(${rotZ}deg)
`;


cubeContainer.style.display=
"block";


centerDot.style.display=
"block";

centerDot.style.left=
cubeX+"px";

centerDot.style.top=
cubeY+"px";

}


/* =====================================================
   GRAB RING
===================================================== */

function showRing(x,y){

grabRing.style.display=
"block";

grabRing.style.left=
x+"px";

grabRing.style.top=
y+"px";

}


function hideRing(){

grabRing.style.display=
"none";

}


/* =====================================================
   PINCHING HANDS
===================================================== */

function getPinchingHands(detected){

const list=[];


for(
let i=0;
i<detected.length;
i++
){

if(
isPinching(
detected[i]
)
){

list.push(i);

}

}


return list;

}


/* =====================================================
   CLOSEST PINCH TO CUBE
===================================================== */

function closestPinchingHand(
detected,
pinching
){

let best=-1;

let bestDistance=
Infinity;


for(
const index
of pinching
){

const fingertip=
screenPosition(
detected[index][8]
);


const d=
Math.hypot(

fingertip.x-cubeX,

fingertip.y-cubeY

);


if(
d<bestDistance
){

bestDistance=d;

best=index;

}

}


return{
index:best,
distance:bestDistance
};

}


/* =====================================================
   HAND RESULTS
===================================================== */

hands.onResults((results)=>{

ctx.clearRect(
0,
0,
canvas.width,
canvas.height
);


const detected=
results.multiHandLandmarks || [];


handsText.textContent=
"Hands: "+
detected.length;


/* =====================================================
   DRAW HANDS
===================================================== */

for(
const hand of detected
){

const points=
hand.map(
screenPosition
);


ctx.strokeStyle=
"#00eaff";

ctx.lineWidth=2.5;


for(
const connection
of HAND_CONNECTIONS
){

const a=
points[
connection[0]
];

const b=
points[
connection[1]
];


ctx.beginPath();

ctx.moveTo(
a.x,
a.y
);

ctx.lineTo(
b.x,
b.y
);

ctx.stroke();

}


ctx.fillStyle=
"#00eaff";


for(
const point of points
){

ctx.beginPath();

ctx.arc(
point.x,
point.y,
4,
0,
Math.PI*2
);

ctx.fill();

}

}


/* =====================================================
   PINCHING HANDS
===================================================== */

const pinching=
getPinchingHands(
detected
);


/* =====================================================
   TWO HAND CONTROL
===================================================== */

if(
cubeExists &&
pinching.length===2
){

const p1=
screenPosition(
detected[
pinching[0]
][8]
);

const p2=
screenPosition(
detected[
pinching[1]
][8]
);


const dx=
p2.x-p1.x;

const dy=
p2.y-p1.y;


const d=
Math.hypot(
dx,
dy
);


const a=
Math.atan2(
dy,
dx
);


const centerX=
(p1.x+p2.x)/2;

const centerY=
(p1.y+p2.y)/2;


if(!twoHandMode){

twoHandMode=true;

grabbed=true;

twoStartDistance=
Math.max(
d,
10
);

twoStartScale=
cubeScale;

twoStartAngle=
a;

twoStartRotZ=
rotZ;

twoStartAverageY=
centerY;

twoStartRotX=
rotX;

}


/* SCALE */

let targetScale=
twoStartScale*
(
d/twoStartDistance
);


targetScale=
Math.max(
.4,
Math.min(
3.5,
targetScale
)
);


cubeScale +=
(
targetScale-
cubeScale
)*.25;


/* TWIST */

let angleChange=
(
a-
twoStartAngle
)*
180/Math.PI;


while(
angleChange>180
){

angleChange-=360;

}

while(
angleChange<-180
){

angleChange+=360;

}


rotZ +=
(
twoStartRotZ+
angleChange-
rotZ
)*.25;


/* FORWARD / BACKWARD */

const vertical=
centerY-
twoStartAverageY;


let targetRotX=
twoStartRotX+
vertical*.8;


targetRotX=
Math.max(
-80,
Math.min(
80,
targetRotX
)
);


rotX +=
(
targetRotX-
rotX
)*.25;


/* MOVE */

cubeX=
centerX;

cubeY=
centerY;


velocityX=0;
velocityY=0;


modeText.textContent=
"Mode: TWO HAND";

status.textContent=
"MOVE • TWIST • TILT • RESIZE";


updateCube();

return;

}


/* =====================================================
   EXIT TWO HAND
===================================================== */

if(twoHandMode){

twoHandMode=false;

}


/* =====================================================
   CURRENT GRAB
===================================================== */

if(grabbed){

let bestHand=-1;

let bestDistance=
Infinity;


for(
let i=0;
i<detected.length;
i++
){

if(
!isPinching(
detected[i]
)
){

continue;

}


const fingertip=
screenPosition(
detected[i][8]
);


const d=
Math.hypot(

fingertip.x-grabX,

fingertip.y-grabY

);


if(
d<bestDistance
){

bestDistance=d;

bestHand=i;

}

}


/* FOLLOW */

if(
bestHand>=0 &&
bestDistance<180
){

const fingertip=
screenPosition(
detected[bestHand][8]
);


cubeX=
fingertip.x+
grabOffsetX;

cubeY=
fingertip.y+
grabOffsetY;


grabX=
fingertip.x;

grabY=
fingertip.y;


velocityX=0;
velocityY=0;


showRing(
fingertip.x,
fingertip.y
);


modeText.textContent=
"Mode: GRABBED";

status.textContent=
"CUBE IN HAND 🤏";


updateCube();

return;

}


/* RELEASE */

grabbed=false;

hideRing();

modeText.textContent=
"Mode: PLACED";

status.textContent=
"CUBE RELEASED";

return;

}


/* =====================================================
   GRAB EXISTING CUBE
===================================================== */

if(
cubeExists &&
pinching.length>0
){

const result=
closestPinchingHand(
detected,
pinching
);


if(
result.index>=0 &&
result.distance<
110*cubeScale
){

const fingertip=
screenPosition(
detected[
result.index
][8]
);


grabbed=true;


grabX=
fingertip.x;

grabY=
fingertip.y;


grabOffsetX=
cubeX-
fingertip.x;

grabOffsetY=
cubeY-
fingertip.y;


velocityX=0;
velocityY=0;


showRing(
fingertip.x,
fingertip.y
);


modeText.textContent=
"Mode: GRABBED";

status.textContent=
"CUBE GRABBED 🤏";


updateCube();

return;

}

}


/* =====================================================
   CREATE FIRST CUBE
===================================================== */

if(
!cubeExists &&
pinching.length>0
){

const index=
pinching[0];


const fingertip=
screenPosition(
detected[index][8]
);


cubeX=
fingertip.x;

cubeY=
fingertip.y;


cubeScale=1;

rotX=-20;

rotY=30;

rotZ=0;


velocityX=0;
velocityY=0;


cubeExists=true;

grabbed=true;


grabX=
fingertip.x;

grabY=
fingertip.y;


grabOffsetX=0;
grabOffsetY=0;


showRing(
fingertip.x,
fingertip.y
);


modeText.textContent=
"Mode: GRABBED";

status.textContent=
"CUBE CREATED 🤏";


updateCube();

return;

}


/* =====================================================
   RESTING CUBE
===================================================== */

if(
cubeExists
){

updateCube();

modeText.textContent=
"Mode: PLACED";

status.textContent=
"PINCH THE CUBE TO GRAB";

}else{

status.textContent=
detected.length
?
"PINCH TO CREATE CUBE"
:
"SHOW YOUR HANDS";

}

});


/* =====================================================
   START / SWITCH CAMERA
===================================================== */

async function startCamera(){

try{

status.textContent=
"Requesting camera...";


/*
  Stop previous camera stream.
*/

if(currentStream){

currentStream
.getTracks()
.forEach(
track=>track.stop()
);

currentStream=null;

}


/*
  Stop old MediaPipe camera loop.
*/

if(cameraController){

try{

cameraController.stop();

}catch(e){}

cameraController=null;

}


/*
  Choose camera.
*/

const facingMode=
usingFrontCamera
?
"user"
:
"environment";


const stream=
await navigator.mediaDevices
.getUserMedia({

video:{

facingMode:facingMode,

width:{
ideal:1280
},

height:{
ideal:720
},

frameRate:{
ideal:30,
max:30
}

},

audio:false

});


currentStream=
stream;


video.srcObject=
stream;


/*
  Set correct mirror.
*/

video.classList.remove(
"front-camera",
"back-camera"
);


if(usingFrontCamera){

video.classList.add(
"front-camera"
);

}else{

video.classList.add(
"back-camera"
);

}


await video.play();


cameraModeText.textContent=
usingFrontCamera
?
"Camera: FRONT"
:
"Camera: BACK";


cameraButton.textContent=
usingFrontCamera
?
"SWITCH TO BACK"
:
"SWITCH TO FRONT";


status.textContent=
"Starting hand tracking...";


cameraController=
new Camera(
video,
{

onFrame:
async()=>{

await hands.send({
image:video
});

},

width:1280,

height:720

}
);


cameraController.start();


}catch(error){

console.error(error);

status.textContent=
"Camera error: "+
error.message;

}

}


/* =====================================================
   CAMERA SWITCH BUTTON
===================================================== */

cameraButton.addEventListener(
"click",
async()=>{

cameraButton.disabled=true;

status.textContent=
"Switching camera...";


usingFrontCamera=
!usingFrontCamera;


await startCamera();


cameraButton.disabled=false;

});


/* =====================================================
   START
===================================================== */

startCamera();

</script>

</body>
</html>
```
